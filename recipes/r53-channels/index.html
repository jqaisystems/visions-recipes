    <title>Channels</title>

    <script src="assets/table.js"></script>

      // Three kinds of grain. NL dark grains are the sheet and the islands, and the fingertip's cuts push them aside into ridges.
      // NC dark grains are the captions, flowing from one to the next by sliced optimal transport. NT terracotta grains are the work, running down the channels.
      // Every frame is worked out from the time alone.
      const TB = window.TABLE, W = TB.w, H = TB.h, FPS = 30, BEAT = TB.beat, DUR = TB.dur, ST = TB.streams;
      const NL = 300000, NC = 36000, NT = 100000, ITERS = 22;

void main(){ vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;

      // ---------------- the dark grains: the sheet with every cut pushed into it, and the captions flowing
      const GV = `#version 300 es
precision highp float;
layout(location = 0) in vec2 aSrc; layout(location = 1) in vec2 aDst; layout(location = 2) in vec2 aMid;
uniform float uU, uB; uniform vec2 uRes; uniform float uPointSz; uniform int uNSeg; uniform highp sampler2D uSegs; uniform vec4 uCol;

vec2 push(vec2 p){   // every cut the fingertip has made so far: grains inside it are pushed out into a ridge on each side, and a cut smoothed away lets them back
  vec2 p0 = p;

    vec2 dc = p - uCol.xy; float dl = length(dc);

      // ---------------- the work: terracotta grains placed by the stream model below
      const TV = `#version 300 es
precision highp float; layout(location = 0) in vec3 aP; uniform vec2 uRes; uniform float uPointSz; out float vT; out float vW;
void main(){ vT = 1.0; vW = aP.x < -500.0 ? 0.0 : aP.z; gl_Position = vec4(aP.x / uRes.x * 2.0 - 1.0, 1.0 - aP.y / uRes.y * 2.0, 0.0, 1.0); gl_PointSize = vW > 0.0 ? uPointSz : 0.0; }`;
      const GF = `#version 300 es
precision highp float; in float vT; in float vW; uniform float uWt; out vec4 o;
void main(){ vec2 c = gl_PointCoord - 0.5; float k = exp(-dot(c, c) * 9.0) * uWt * vW; o = vec4(k, k * vT, 0.0, 1.0); }`;

      const SHADE = `#version 300 es

  d = smin(d, cap(q, vec2(356.0, 196.0), vec2(446.0, 190.0), 25.0, 32.0), 7.0);

  d = smin(d, cap(q, vec2(250.0, -86.0), vec2(470.0, -66.0), 27.0, 50.0), 30.0);

  float hb = textureLod(uS, uv, 5.0).r, hc = textureLod(uS, uv, 1.5).r, hs = textureLod(uS, uv, 0.8).r;
  float dx = textureLod(uS, uv + vec2(2.0 / uRes.x, 0), 0.8).r - textureLod(uS, uv - vec2(2.0 / uRes.x, 0), 0.8).r;
  float dy = textureLod(uS, uv + vec2(0, 2.0 / uRes.y), 0.8).r - textureLod(uS, uv - vec2(0, 2.0 / uRes.y), 0.8).r;
  vec2 c = (uv - 0.5) * vec2(1.0, 0.72); float v = exp(-dot(c, c) * 2.6);
  vec3 lit = mix(vec3(0.86, 0.36, 0.06), vec3(1.0, 0.76, 0.40), v) * uLight * 1.12;
  float g = mix(h21(floor(px * 0.5)), h21(floor(px) + 7.0), 0.5);
  float cover = 1.0 - exp(-2.6 * mix(h, hs, 0.5) * (0.8 + 0.4 * n2(px * 0.42)));
  float dark = smoothstep(g - 0.06, g + 0.06, cover);
  vec3 nrm = normalize(vec3(-dx * 1.6, -dy * 1.6, 1.0)); float l = max(dot(nrm, normalize(vec3(-0.55, 0.55, 0.62))), 0.0);
  float isT = step(h21(floor(px * 0.5) + 19.0), tf * 1.1);
  vec3 base = mix(vec3(0.082, 0.040, 0.018), vec3(0.66, 0.23, 0.10), isT);
  vec3 sand = base * (0.18 + 2.1 * l * l) * (0.7 + 0.6 * h21(floor(px * 0.5) + 3.0)) * uLight;
  sand += lit * exp(-3.4 * hc) * 0.55;
  vec3 col = mix(lit, sand, dark);
  col += lit * pow(clamp(1.0 - hb * 1.05, 0.0, 1.0), 2.2) * 0.09;
  if (uF.w > 0.5) { vec2 tip = uF.xy, ax = normalize(uPiv - tip), ay = vec2(-ax.y, ax.x); float sc = 1.0 + uF.z * 0.5;
    vec2 q = vec2(dot(px - tip, ax), dot(px - tip, ay)) / sc; float d = hand(q) * sc, w = 2.5 + uF.z * 46.0;
    float a = 1.0 - smoothstep(-w, w, d); float bod = smoothstep(-58.0, -4.0, d), sh = n2(q * 0.012 + 4.0);
    vec3 sk = vec3(0.075, 0.036, 0.022) * 0.16 * (0.5 + 0.65 * sh) + lit * 0.34 * exp(-abs(d) * 0.16) * (1.0 - bod * 0.4); sk *= uLight;
    col = mix(col, sk, a * (1.0 - 0.15 * uF.z)); }

  o = vec4(col + (h21(px + 11.0) - 0.5) / 255.0, 1.0);
}`;

      const $ = (s) => document.querySelector(s);
      const r = (x, a, b) => Math.min(1, Math.max(0, (x - a) / (b - a))), lerp = (a, b, u) => a + (b - a) * u, eO = (u) => 1 - Math.pow(1 - u, 3), sm = (u) => u * u * (3 - 2 * u);
      const hash = (i, s) => { let x = (i * 374761393 + s * 668265263) | 0; x = Math.imul(x ^ (x >>> 13), 1274126177); x ^= x >>> 16; return (x >>> 0) / 4294967296; };
      let gl, ovG, PR = {}, hT, hF, segT, frame = -1, land, capPlan = [], tBuf;

      // ---------------- pictures, drawn once and sampled as grain positions
      function raster(marks) {
        const c = document.createElement("canvas"); c.width = W; c.height = H; const g = c.getContext("2d", { willReadFrequently: true });
        g.fillStyle = "#000"; g.fillRect(0, 0, W, H); g.lineCap = "round"; g.lineJoin = "round";
        const path = (sts) => { g.beginPath(); for (const st of sts) { g.moveTo(st[0][0], st[0][1]); for (let i = 1; i < st.length; i++) g.lineTo(st[i][0], st[i][1]); } };
        for (const m of marks) {
          if (m[0] === "sheet") { g.fillStyle = "#4a4a4a"; g.beginPath(); g.roundRect(m[1], m[2], m[3], m[4], m[5]); g.fill(); }
          else if (m[0] === "block") { g.fillStyle = "#fff"; g.beginPath(); g.roundRect(m[1], m[2], m[3], m[4], m[5]); g.fill(); }
          else if (m[0] === "disc") { g.fillStyle = "#fff"; g.beginPath(); g.arc(m[1], m[2], m[3], 0, Math.PI * 2); g.fill(); }
          else if (m[0] === "cut") { g.strokeStyle = "#000"; g.lineWidth = m[1]; path(m[2]); g.stroke(); }
          else { g.strokeStyle = "#fff"; g.lineWidth = m[1]; path(m[2]); g.stroke(); }
        }

      }
      const CDF = new Float64Array(W * H);
      function sample(marks, n, seed) {
        const d = raster(marks); let s = 0; for (let i = 0; i < W * H; i++) { s += d[i * 4]; CDF[i] = s; }
        const out = new Float32Array(n * 2);
        for (let i = 0; i < n; i++) {
          const t = (i + hash(i, seed)) / n * s; let lo = 0, hi = W * H - 1; while (lo < hi) { const m = (lo + hi) >> 1; if (CDF[m] < t) lo = m + 1; else hi = m; }
          out[i * 2] = (lo % W) + hash(i, seed + 1); out[i * 2 + 1] = Math.floor(lo / W) + hash(i, seed + 2);
        }

      }
      const KEY = new Float64Array(NC), PT = new Float32Array(NC);
      function transfer(src, tgt, n) {   // sliced optimal transport, then an exact match along a Hilbert curve, as in Same Sand
        const p = src.slice(0, n * 2);

          const a = (k * 0.6180339887 % 1) * Math.PI, cx = Math.cos(a), cy = Math.sin(a), step = k < ITERS - 4 ? 1.0 : 0.6;
          for (let i = 0; i < n; i++) { const v = p[i * 2] * cx + p[i * 2 + 1] * cy; KEY[i] = Math.round((v + 6000) * 64) * 1048576 + i; PT[i] = tgt[i * 2] * cx + tgt[i * 2 + 1] * cy; }

        ka.sort(); kb.sort(); const out = new Float32Array(n * 2);
        for (let j = 0; j < n; j++) { const i = ka[j] % 1048576, t = kb[j] % 1048576; out[i * 2] = tgt[t * 2]; out[i * 2 + 1] = tgt[t * 2 + 1]; }

      function hil(x, y) {

        for (let s = 2048; s > 0; s >>= 1) { const rx = (X & s) > 0 ? 1 : 0, ry = (Y & s) > 0 ? 1 : 0; d += s * s * ((3 * rx) ^ ry);
          if (ry === 0) { if (rx === 1) { X = 4095 - X; Y = 4095 - Y; } const t = X; X = Y; Y = t; } }

      // ---------------- the streams: every terracotta grain gets a route, a time it arrives in a pile, a time it leaves, a lane and a speed
      function dense(pts) {   // a path resampled every 2 px, with its normals
        const X = [], Y = []; for (let i = 0; i < pts.length - 1; i++) { const [ax, ay] = pts[i], [bx, by] = pts[i + 1], d = Math.hypot(bx - ax, by - ay), n = Math.max(1, Math.ceil(d / 2));

      function arc(a, b) {   // through the basin: round the decision layer once, the long way, then out
