<!DOCTYPE html>

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <!--
      R45 · Forage. 34.44 s at 108 bpm, 62 beats (season 6, ink feedback, film 3). For the AI Client Acquisition System, whose
      bottleneck is turning 500 cold results into 30 qualified prospects. Slime mould does that physically.
      409,600 agents live in a float texture. Each one senses the trail ahead, turns towards the strongest and leaves a
      little more trail, in one feedback buffer that diffuses and decays. A mask steers them: food in red, repellent in green,
      words in blue. The trail is shown as a wet height field with real specular light. Crisp type and data sit on a 2D layer.
      The simulation runs forward from one anchor at time 0, so any frame is rebuilt the same way. All data is fictional.
    -->

    <script src="assets/table.js"></script>
    <style>

  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="34.4444" data-width="1920" data-height="1080">
      <div id="ct-stage" class="clip" data-start="0" data-duration="34.4444" data-track-index="0">
        <canvas id="stage" width="1920" height="1080" data-layout-allow-overflow></canvas>
        <img id="logo" src="assets/brand/your-mark.svg" alt="Your mark" data-layout-allow-overflow>

    </div>

    <script>
      const VS = "#version 300 es\nin vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }";
      // each agent: sense ahead, turn, move. xy position, z heading, w its id
      const AG_FS = `#version 300 es
precision highp float;
uniform sampler2D uA, uT, uM;
uniform vec2 uC;
uniform float uR, uSO, uSA, uRA, uSS, uWF, uWT, uWR, uPull, uFrame, uJit, uActive, uCrowd, uCap, uOut;
out vec4 o;
const vec2 SZ = vec2(1280.0, 720.0);
float h(vec3 p){ p = fract(p * vec3(0.1031, 0.1030, 0.0973)); p += dot(p, p.yzx + 33.33); return fract((p.x + p.y) * p.z); }
vec2 dr(float a){ return vec2(cos(a), sin(a)); }
float S(vec2 p){ vec2 uv = p / SZ; vec4 m = textureLod(uM, uv, 0.0); float q = textureLod(uT, uv, 0.0).r; q = q < uCap ? q : uCap - (q - uCap) * uCrowd; return q + uWF * m.r + uWT * m.b - uWR * m.g; }
void main(){
  vec4 s = texelFetch(uA, ivec2(gl_FragCoord.xy), 0);
  vec2 p = s.xy; float a = s.z, id = s.w;
  if (id > uActive) { o = s; return; }
  float c = S(p + uSO * dr(a)), l = S(p + uSO * dr(a + uSA)), r = S(p + uSO * dr(a - uSA));
  float n1 = h(vec3(gl_FragCoord.xy, uFrame)), n2 = h(vec3(gl_FragCoord.yx + 17.0, uFrame * 1.7));
  if (c > l && c > r) { }
  else if (c < l && c < r) a += (n1 < 0.5 ? 1.0 : -1.0) * uRA;
  else if (l > r) a += uRA; else a -= uRA;
  a += (n2 - 0.5) * uJit;
  vec2 to = uC - p; float dd = length(to);
  if (dd > uR) a = atan(to.y, to.x) + (n1 - 0.5) * 1.4;
  float sp = uSS;
  if (uOut > 0.0 && dd > 1.0) { float ta = atan(-to.y, -to.x); a += atan(sin(ta - a), cos(ta - a)) * uOut; }
  if (uPull > 0.0) { float ta = atan(to.y, to.x); a += atan(sin(ta - a), cos(ta - a)) * uPull; sp *= min(1.0, dd / 30.0) * 0.8 + 0.2; }
  p += sp * dr(a);
  if (p.x < 1.0 || p.y < 1.0 || p.x > SZ.x - 1.0 || p.y > SZ.y - 1.0) { p = clamp(p, vec2(1.0), SZ - 1.0); a += 3.14159 * (0.6 + 0.8 * n1); }
  o = vec4(p, a, id);
}`;
      const DEP_VS = `#version 300 es
precision highp float;
uniform sampler2D uA; uniform float uActive; uniform int uN;
const vec2 SZ = vec2(1280.0, 720.0);
void main(){
  vec4 s = texelFetch(uA, ivec2(gl_VertexID % uN, gl_VertexID / uN), 0);
  gl_Position = s.w > uActive ? vec4(9.0, 9.0, 9.0, 1.0) : vec4(s.xy / SZ * 2.0 - 1.0, 0.0, 1.0);
  gl_PointSize = 1.0;
}`;
      const DEP_FS = `#version 300 es
precision highp float;
uniform float uDep; out vec4 o; void main(){ o = vec4(uDep, 0.0, 0.0, 1.0); }`;
      // the feedback: diffuse and decay. Where a word is being grown, what's outside it dims faster
      const FLD_FS = `#version 300 es
precision highp float;
uniform sampler2D uT, uM; uniform vec2 uTex; uniform float uDecay, uDim, uFade;
out vec4 o;
void main(){
  vec2 uv = gl_FragCoord.xy * uTex; float s = 0.0;
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) s += textureLod(uT, uv + vec2(x, y) * uTex, 0.0).r * (x == 0 && y == 0 ? 0.28 : (x == 0 || y == 0) ? 0.12 : 0.06);
  vec4 m = textureLod(uM, uv, 0.0);
  float k = uDecay - uDim * (1.0 - smoothstep(0.1, 0.6, m.b));
  o = vec4(s * k * uFade, 0.0, 0.0, 1.0);
}`;
      // the look: the trail is a wet height field, lit by one moving light
      const DISP_FS = `#version 300 es
precision highp float;
uniform sampler2D uT, uOv, uM;
uniform vec2 uCam, uOff; uniform float uZ, uTime, uInv, uGain, uK, uWord;
out vec4 o;
const vec2 RES = vec2(1920.0, 1080.0), TX = vec2(1.0 / 1280.0, 1.0 / 720.0);
float h(vec2 p){ vec3 q = fract(vec3(p.xyx) * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
float H(vec2 q, float l){ return 1.0 - exp(-textureLod(uT, q, l).r * uK); }
float G(vec2 q, float l, float k){ vec2 d = TX * pow(2.0, l) * 0.75; float s = 0.0;
  for (int i = 0; i < 8; i++) { float a = float(i) * 0.7854 + 0.39; s += textureLod(uT, q + d * vec2(cos(a), sin(a)), l).r; }
  s = s * 0.0625 + textureLod(uT, q, l).r * 0.5; return 1.0 - exp(-s * k); }
void main(){
  vec2 uv = vec2(gl_FragCoord.x, RES.y - gl_FragCoord.y) / RES;
  vec2 q = uCam + (uv - 0.5) / uZ + uOff;
  float lod = max(0.0, log2(1.5 / uZ));
  float v = H(q, lod);
  vec2 e = TX * 1.3 / max(1.0, uZ * 0.55);
  float hx = H(q + vec2(e.x, 0.0), lod + 0.4) - H(q - vec2(e.x, 0.0), lod + 0.4), hy = H(q + vec2(0.0, e.y), lod + 0.4) - H(q - vec2(0.0, e.y), lod + 0.4);
  vec3 n = normalize(vec3(-hx * 3.2, -hy * 3.2, 1.0));
  vec3 L = normalize(vec3(0.5 * sin(uTime * 0.7) - 0.4, -0.65 + 0.2 * cos(uTime * 0.5), 0.75));
  float spec = pow(max(dot(n, normalize(L + vec3(0.0, 0.0, 1.0))), 0.0), 46.0) * smoothstep(0.08, 0.5, v);
  float dif = max(dot(n, L), 0.0);
  float g1 = G(q, 2.5, uK), g2 = G(q, 4.0, uK * 1.6), g3 = G(q, 5.5, uK * 2.2);
  vec3 Y = vec3(0.96, 0.82, 0.09), A = vec3(0.50, 0.25, 0.015), W = vec3(1.0, 0.97, 0.74);
  vec3 c = vec3(0.022, 0.024, 0.03) * (0.8 + 0.4 * h(floor(q * 900.0)));
  c += A * g3 * 0.40 + Y * g2 * 0.18 + Y * g1 * 0.12;
  vec3 body = mix(A * 0.9, Y, smoothstep(0.10, 0.52, v)); body = mix(body, W, smoothstep(0.72, 0.98, v));
  c = mix(c, body * (0.55 + 0.6 * dif), smoothstep(0.03, 0.2, v));
  c += W * spec * 0.8;
  float mb = texture(uM, q).b; c *= 1.0 - uWord * 0.72 * (1.0 - mb); c += uWord * mb * (A * 0.55 + Y * 0.1);
  c *= uGain;
  vec2 vg = uv - 0.5; c *= 1.0 - dot(vg, vg) * 0.75;
  // the flip: black ink on yellow
  vec3 inv = Y * (1.0 - smoothstep(0.08, 0.42, v) * 0.97) * (0.92 + 0.1 * h(floor(q * 700.0)));
  c = mix(c, inv, uInv);
  vec4 ov = texture(uOv, uv);
  c = c * (1.0 - ov.a) + ov.rgb;
  c += (h(gl_FragCoord.xy + uTime * 61.0) - 0.5) * 0.012;
  o = vec4(c, 1.0);
}`;

      const TB = window.TABLE, DUR = TB.dur, BEAT = TB.beat, W = 1920, H = 1080, SW = TB.sw, SH = TB.sh, AN = 640, STEPS = 2, FPS = 30, SX = W / SW;
      const $ = (s) => document.querySelector(s);
      const r = (x, a, b) => Math.min(1, Math.max(0, (x - a) / (b - a))), lerp = (a, b, k) => a + (b - a) * k;
      const eO = (k) => 1 - Math.pow(1 - k, 3), eI = (k) => k * k * k, eS = (k) => k * k * (3 - 2 * k);
      const eX = (k) => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k), eB = (k) => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
      const eIO = (k) => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      const Y = "#F5D117", BONE = "#F4F0DC", INK = "#07080A", DROP = 25.5, FLY = 31, FLIP = 37, MAIL = 39, NEV = 46, CLOSE = 53, LOGO = 57;
      const C = [SW / 2, SH / 2];
      const N = TB.nodes, H_ = N[TB.hero], R_ = N[TB.rej];

      // ---------------- the simulation's settings, as a function of the beat
      function reach(B) { return B < 4 ? 6 + 44 * r(B, 0.2, 4) : B >= 13 ? 3000 : 50 + 710 * Math.pow(r(B, 4, 13), 1.6); }
      function params(B) {
        const cc = r(B, DROP, DROP + 1.2), set = r(B, DROP + 3, DROP + 5.5), sp = r(B, NEV, NEV + 2.5), pull = r(B, CLOSE, CLOSE + 2.4);
        const w1 = r(B, 14, 15) * (1 - r(B, 17.3, 17.9)), w2 = r(B, 18, 19) * (1 - r(B, 21, 21.6)), word = Math.max(w1, w2);
        let p = {
          R: reach(B), SO: 9, SA: 0.6, RA: 0.45, SS: 3.0, out: 0.02 * (1 - r(B, 12, 14)), jit: 0.16, WF: 1.6, WT: 0, WR: 2.5, dep: 0.018, decay: 0.92, dim: 0, pull: 0, fade: 1, crowd: 1.2, cap: 0.3,
          active: Math.min(1, Math.pow(reach(B) / 760, 2)),
        };
        p.crowd = lerp(p.crowd, 0.5, word); p.cap = lerp(p.cap, 0.7, word); p.WT = 14 * word; p.dim = 0.11 * word; p.WF = lerp(1.6, 0.2, word);
        // the contraction: long senses, fast legs, and only the fed routes pay
        p.SO = lerp(p.SO, 30, cc * (1 - set)); p.SS = lerp(p.SS, 6.5, cc * (1 - set)); p.decay = lerp(p.decay, 0.85, cc * (1 - set)); p.WF = lerp(p.WF, 16, cc); p.RA = lerp(p.RA, 0.7, cc * (1 - set));
        p.crowd = lerp(p.crowd, 0, cc); p.cap = lerp(p.cap, 50, cc); p.jit = lerp(p.jit, 0.05, cc); p.SO = lerp(p.SO, 9, set); p.SS = lerp(p.SS, 1.7, set); p.decay = lerp(p.decay, 0.9, set);
        // spreading again, around the contacted
        p.crowd = lerp(p.crowd, 1.2, sp); p.cap = lerp(p.cap, 0.3, sp); p.out = 0.015 * sp * (1 - pull); p.WF = lerp(p.WF, 2.2, sp); p.SO = lerp(p.SO, 15, sp); p.SS = lerp(p.SS, 2.6, sp); p.jit = lerp(p.jit, 0.16, sp); p.decay = lerp(p.decay, 0.925, sp); p.WR = lerp(p.WR, 30, r(B, NEV - 0.5, NEV + 0.5));
        // home
        p.crowd = lerp(p.crowd, 0, pull); p.pull = 0.34 * eI(pull); p.SS = lerp(p.SS, 7.5, pull); p.WF = lerp(p.WF, 0, pull); p.WR = lerp(p.WR, 0, pull); p.decay = lerp(p.decay, 0.82, pull);
        p.fade = 1 - r(B, LOGO - 0.8, LOGO + 0.1);
        return p;
      }

      // ---------------- the mask: food in red, repellent in green, words in blue
      let mC, mG, mKey = "";
      function drawWord(g, a, y, size) { g.font = `900 condensed ${size}px Archivo`; g.textAlign = "center"; g.textBaseline = "alphabetic"; g.fillText(a, SW / 2, y); }
      function mask(B) {
        const key = Math.floor(B * 12);
        if (key === mKey) return false;
        mKey = key;
        const g = mG; g.globalCompositeOperation = "source-over"; g.fillStyle = "#000"; g.fillRect(0, 0, SW, SH);
        g.globalCompositeOperation = "lighter";
        // food
        const sp = r(B, NEV, NEV + 1.5), pull = r(B, CLOSE, CLOSE + 1);
        if (pull < 1) {
          g.fillStyle = "rgb(255,0,0)";
          for (let i = 0; i < N.length; i++) {
            const gone = TB.gone[i];
            if (gone !== undefined && B >= gone) continue;
            if (N[i][3] && B >= NEV && TB.contacted.includes(i)) continue;
            if (i === TB.rej && B >= 44.5) continue;
            const R = N[i][3] && B >= DROP ? 7 : 4;
            g.globalAlpha = gone !== undefined ? 0.55 : 1;
            g.beginPath(); g.arc(N[i][0], N[i][1], R, 0, 7); g.fill();
          }
          // a fresh search
          if (sp > 0) { g.globalAlpha = sp; for (const f of TB.fresh) { g.beginPath(); g.arc(f[0], f[1], 3, 0, 7); g.fill(); } }
          g.globalAlpha = 1;
          // the arteries: the routes the survivors feed
          const a = r(B, DROP, DROP + 1.6) * (1 - sp * 0.75);
          if (a > 0) {
            g.strokeStyle = "rgb(255,0,0)"; g.lineCap = "round"; g.lineJoin = "round";
            for (let k = 0; k < TB.arteries.length; k++) {
              const e = TB.arteries[k]; if (k === TB.rejEdge && B >= 44.5) continue;
              if (B >= NEV && (TB.contacted.includes(e.a) || TB.contacted.includes(e.b))) continue;
              g.globalAlpha = a; g.lineWidth = 3.4; g.beginPath(); e.pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.stroke();
            }
            g.globalAlpha = 1;
          }
        }
        // repellent
        if (B >= 44.5 && pull < 1) {
          const e = TB.arteries[TB.rejEdge].pts, m = e[Math.floor(e.length * 0.35)];
          g.fillStyle = "rgb(0,255,0)"; if (B < 46) { g.beginPath(); g.arc(m[0], m[1], 11, 0, 7); g.fill(); }
          if (B >= NEV) for (const c of TB.contacted) { g.beginPath(); g.arc(N[c][0], N[c][1], 46 * eO(r(B, NEV, NEV + 1.2)), 0, 7); g.fill(); }
        }
        // words
        g.fillStyle = "rgb(0,0,255)";
        if (B >= 14 && B < 17.9) drawWord(g, "SEARCH", 470, 340);
        if (B >= 18 && B < 21.6) drawWord(g, "SCORE", 470, 350);
        g.globalCompositeOperation = "source-over";
        return true;
      }

      // ---------------- the camera
      function heroPath(k) { const p = TB.arteries[TB.heroEdge].pts, f = k * (p.length - 1), i = Math.min(p.length - 2, Math.floor(f)), u = f - i; return [lerp(p[i][0], p[i + 1][0], u), lerp(p[i][1], p[i + 1][1], u)]; }
      function camera(B, t) {
        let z = lerp(7, 1, eIO(r(B, 2.5, 14))), cx = C[0], cy = C[1];
        z += 0.05 * eS(r(B, 14, 25));
        z -= 0.05 * eX(r(B, DROP, DROP + 0.8));
        const heroAim = [H_[0] + 150, H_[1]];
        if (B >= FLY - 1) {
          const k = eIO(r(B, FLY - 1, FLY + 1.6)), q = heroPath(k * 0.999 + 0.001);
          const j = eS(r(B, FLY - 1, FLY + 0.2));
          cx = lerp(cx, q[0] + 150 * k, j); cy = lerp(cy, q[1], j); z = lerp(z, 3.0, k);
          z += 0.14 * r(B, FLY + 1.6, FLIP);
        }
        if (B >= MAIL - 0.2) { const k = eIO(r(B, MAIL - 0.2, MAIL + 1.4)), mid = [(H_[0] + R_[0]) / 2 + 80, (H_[1] + R_[1]) / 2]; cx = lerp(cx, mid[0], k); cy = lerp(cy, mid[1], k); z = lerp(z, Math.max(1.5, Math.min(2.2, 560 / (Math.hypot(H_[0] - R_[0], H_[1] - R_[1]) + 150))), k); }
        if (B >= NEV - 0.4) { const k = eIO(r(B, NEV - 0.4, NEV + 1.6)); cx = lerp(cx, C[0], k); cy = lerp(cy, C[1], k); z = lerp(z, 1.0, k); }
        if (B >= CLOSE) { z = lerp(z, 3.4, eI(r(B, CLOSE + 0.5, LOGO - 0.4))); }
        // keep the frame inside the dish
        const hw = SW / 2 / z, hh = SH / 2 / z; cx = Math.max(hw, Math.min(SW - hw, cx)); cy = Math.max(hh, Math.min(SH - hh, cy));
        let ox = 0, oy = 0;
        for (const [h, a] of HITS) { const d = t - h * BEAT; if (d < 0 || d > 0.7) continue; const q = Math.exp(-d * 8) * a; ox += q * Math.sin(d * 71); oy += q * Math.cos(d * 59); z *= 1 + q * 0.0006; }
        return { z, cx, cy, ox, oy };
      }
      const HITS = [[DROP, 26], [DROP + 2.5, 14], [FLIP, 18], [FLIP + 0.5, 10], [FLIP + 1, 10], [14, 8], [18, 8], [44.5, 10], [NEV, 8], [NEV + 1.5, 8], [LOGO, 6]];
      const w2s = (cam, x, y) => [(x - cam.cx) * cam.z * SX + W / 2 + cam.ox, (y - cam.cy) * cam.z * SX + H / 2 + cam.oy];

      // ---------------- WebGL2
      let gl, PA, PD, PF, PS, UA = {}, UD = {}, UF = {}, US = {}, ag = [], agF = [], tr = [], trF = [], cur = 0, curT = 0, mT, ovT, ovC, ovG, simN = -1, vaoP;
      function initAgents() {
        let s = 44 >>> 0;
        const rnd = () => { s = (s + 0x6D2B79F5) >>> 0; let z = s; z = Math.imul(z ^ (z >>> 15), z | 1); z ^= z + Math.imul(z ^ (z >>> 7), z | 61); return ((z ^ (z >>> 14)) >>> 0) / 4294967296; };
        const D = new Float32Array(AN * AN * 4);
        for (let i = 0; i < AN * AN; i++) { const x = rnd() * SW, y = rnd() * SH, d = Math.hypot(x - C[0], y - C[1]); D[i * 4] = x; D[i * 4 + 1] = y; D[i * 4 + 2] = rnd() * 6.2832; D[i * 4 + 3] = Math.pow(d / 760, 2); }
        return D;
      }
      function resetSim() {
        const D = initAgents();
        gl.bindTexture(gl.TEXTURE_2D, ag[0]); gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, AN, AN, gl.RGBA, gl.FLOAT, D);
        for (const f of trF) { gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.viewport(0, 0, SW, SH); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); }
        cur = 0; curT = 0; simN = 0; mKey = "";
      }
      function initGL() {
        gl = $("#stage").getContext("webgl2", { antialias: false, alpha: false, depth: false, stencil: false, preserveDrawingBuffer: true });
        if (!gl.getExtension("EXT_color_buffer_float")) throw new Error("EXT_color_buffer_float is needed");
        const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
        const prog = (vs, fs) => { const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs)); gl.bindAttribLocation(p, 0, "p"); gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)); return p; };
        PA = prog(VS, AG_FS); PD = prog(DEP_VS, DEP_FS); PF = prog(VS, FLD_FS); PS = prog(VS, DISP_FS);
        for (const n of ["uA", "uT", "uM", "uC", "uR", "uSO", "uSA", "uRA", "uSS", "uWF", "uWT", "uWR", "uPull", "uFrame", "uJit", "uActive", "uCrowd", "uCap", "uOut"]) UA[n] = gl.getUniformLocation(PA, n);
        for (const n of ["uA", "uActive", "uN"]) UD[n] = gl.getUniformLocation(PD, n);
        UD.uDep = gl.getUniformLocation(PD, "uDep");
        for (const n of ["uT", "uM", "uTex", "uDecay", "uDim", "uFade"]) UF[n] = gl.getUniformLocation(PF, n);
