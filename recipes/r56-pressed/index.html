<!doctype html>
<html>
  <head>

    <meta name="viewport" content="width=1920, height=1080">
    <title>Pressed</title>
    <!-- Pressed: a pin screen made entirely in code. A wall of 36,864 steel pins under one low raking light, and every picture, every word and the
         briefing is a relief pushed into it from behind. The sources, the field and the briefing are a demo, and this film is code. -->
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/table.js"></script>
    <style>
      @font-face { font-family: "Archivo"; src: url("assets/fonts/Archivo.ttf") format("truetype"); font-weight: 100 900; font-stretch: 62% 125%; }
      @font-face { font-family: "JBM"; src: url("assets/fonts/jetbrains-mono.woff2") format("woff2"); font-weight: 100 800; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #08090C; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #08090C; }
      #ct-stage { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      #stage, #over { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
      #logo { position: absolute; left: -2000px; top: 0; width: 926px; height: 193px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="38.4" data-width="1920" data-height="1080">
      <div id="ct-stage" class="clip" data-start="0" data-duration="38.4" data-track-index="0">
        <canvas id="stage" width="1920" height="1080" data-layout-allow-overflow></canvas>
        <canvas id="over" width="1920" height="1080" data-layout-allow-overflow></canvas>
        <img id="logo" src="assets/brand/your-mark.svg" alt="Your mark" data-layout-allow-overflow>
      </div>
      <audio id="score" src="assets/bgm/score.wav" data-start="0" data-duration="38.4" data-track-index="7" data-volume="1"></audio>
    </div>

    <script>
      // The wall: NX by NY pins. Each frame, every pin's height is worked out from the time alone (the reliefs pressed in so far, the noise,
      // the filter wave), uploaded as one small texture, and the shader draws each pixel as the frontmost pin there, shaft and domed head,
      // in a slight perspective, with its shadow traced back towards the lamp through the heights of the pins in between.
      const TB = window.TABLE, W = TB.w, H = TB.h, FPS = 30, BEAT = TB.beat, DUR = TB.dur, NX = TB.nx, NY = TB.ny, P = TB.pitch, OX = TB.ox, OY = TB.oy, EXT = TB.ext;
      const CAMD = 7000;

      const VS = `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;
      // ---------------- the picture: pins of steel under one raking lamp
      const FS = `#version 300 es
precision highp float; out vec4 o;
uniform highp sampler2D uH; uniform vec2 uRes; uniform float uP; uniform vec2 uO; uniform float uE; uniform vec2 uVP; uniform float uD;
uniform vec3 uL; uniform float uLi; uniform vec2 uSpot; uniform ivec2 uN;
float h21(vec2 p){ vec3 q = fract(vec3(p.xyx) * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
float hAt(ivec2 c){ if (c.x < 0 || c.y < 0 || c.x >= uN.x || c.y >= uN.y) return -1.0; return texelFetch(uH, c, 0).r; }
vec2 base(ivec2 c){ return uO + (vec2(c) + 0.5) * uP; }
vec2 proj(vec2 b, float z){ return uVP + (b - uVP) * uD / (uD - z); }

  // the pins that could cover this pixel lean away from the vanishing point, so look back along that lean
  vec2 sm = (x - uVP) * (uE + RH) / uD;
  vec2 a = (min(x, x - sm) - uO) / uP - 1.0, b = (max(x, x - sm) - uO) / uP + 1.0;
  ivec2 c0 = ivec2(floor(a)), c1 = ivec2(floor(b));
  float bestZ = -1e9; vec3 n = vec3(0.0, 0.0, 1.0); vec3 Pw = vec3(x, BZ); float hh = 0.0, isPin = 0.0, cid = 0.0;
  for (int j = c0.y; j <= c1.y; j++) for (int i = c0.x; i <= c1.x; i++) {

  for (int k = 1; k <= 30; k++) {

    ivec2 c = ivec2(floor((q - uO) / uP)); float h = hAt(c); if (h < 0.0) continue;

  vec3 R = reflect(-V, n); float sheen = pow(max(dot(R, normalize(vec3(uL.xy * 0.6, 0.8))), 0.0), 5.0);
  vec3 warm = vec3(1.0, 0.86, 0.70), cool = vec3(0.42, 0.52, 0.66);

  vec3 col;

    float var = 0.88 + 0.24 * h21(vec2(cid, 3.1)), depth = mix(0.34, 1.4, clamp(hh, 0.0, 1.0)), shd = 0.3 + 0.7 * sh;
    vec3 steel = vec3(0.42, 0.43, 0.46) * var;

  } else if (inWall) {

    vec2 e = max(uO - x, x - (uO + vec2(uN) * uP)); float bev = clamp(1.0 - max(e.x, e.y) / 22.0, 0.0, 1.0);
    col = vec3(0.022, 0.022, 0.026) * key * (0.4 + 0.8 * bev);

  col = col / (1.0 + col * 0.55); col = pow(max(col, 0.0), vec3(0.86));
  o = vec4(col + (h21(x + 11.0) - 0.5) / 255.0, 1.0);
}`;

      const $ = (s) => document.querySelector(s);
      const r = (x, a, b) => Math.min(1, Math.max(0, (x - a) / (b - a))), lerp = (a, b, u) => a + (b - a) * u, sm = (u) => u * u * (3 - 2 * u);

          else if (t === "frame") { g.globalAlpha = m[6]; g.lineWidth = m[5]; g.beginPath(); g.roundRect(m[1] + m[5] / 2, m[2] + m[5] / 2, m[3] - m[5], m[4] - m[5], m[7]); g.stroke(); }

          else if (t === "text") { const [, s, x, y, size, wt, v, al, fit] = m; g.globalAlpha = v; let sz = size; g.font = `${wt} ${sz}px "Archivo"`;
            if (fit > 0) { const w = g.measureText(s).width; if (w > fit) { sz = size * fit / w; g.font = `${wt} ${sz}px "Archivo"`; } }
            g.textAlign = al === "c" ? "center" : "left"; g.textBaseline = "alphabetic"; g.fillText(s, x, y); }

      function wkey(K, b) {

      function build_layers() {

          for (let k = 0; k < N; k++) {
            let v = l.delay === "x" ? (PX[k] - OX) / (NX * P) : l.delay === "y" ? (PY[k] - OY) / (NY * P) : l.delay === "r" ? Math.hypot(PX[k] - R.cx, PY[k] - R.cy) / 600 : HN[k];

        const waving = b >= TB.wave[0][0] - 0.2 && b <= TB.wave[1][0] + 0.4;
        const filt = (k) => b < TB.wave[0][0] ? 1 : sm(r(PX[k], front - 70, front + 10));
        for (const l of LAY) {

          const mv = mkey(l.move, b), A = l.anchor;
          for (let k = 0; k < N; k++) {
            const w = wkey(l.keys, b - l.dl[k]); if (w <= 0) continue;
            let v;
            if (mv && (mv[0] !== 0 || mv[1] !== 0 || mv[2] !== 1)) {   // the relief slides and shrinks: sample it where this pin came from
              const qx = A[0] + (PX[k] - A[0] - mv[0]) / mv[2], qy = A[1] + (PY[k] - A[1] - mv[1]) / mv[2];
              const fi = (qx - OX) / P - 0.5, fj = (qy - OY) / P - 0.5, i0 = Math.floor(fi), j0 = Math.floor(fj), u = fi - i0, t = fj - j0;
              const g = (i, j) => (i < 0 || j < 0 || i >= NX || j >= NY) ? 0 : l.h[j * NX + i];
              v = lerp(lerp(g(i0, j0), g(i0 + 1, j0), u), lerp(g(i0, j0 + 1), g(i0 + 1, j0 + 1), u), t);
            } else v = l.h[k];
            if (v <= 0) continue;
            HGT[k] += w * v * (l.filt ? filt(k) : 1);
          }
        }
        // the noise: every pin pushed to a height of its own, changing on the sixteenths
        const na = wkey(TB.noise, b);

          const s = b * 4;
          for (let k = 0; k < N; k++) { const ph = s + HN[k], f = Math.floor(ph), u = sm(ph - f), v = lerp(hash(k, f), hash(k, f + 1), u);
            HGT[k] += na * Math.pow(v, 1.6) * 0.9 * filt(k) * (PY[k] < 250 ? 0.25 : 1); }
        }

        if (waving) for (let k = 0; k < N; k++) { const d = (PX[k] - front) / 46; HGT[k] += 0.62 * Math.exp(-d * d) * (0.85 + 0.3 * HN[k]); }
        // a breath when the light comes on
        if (b > 1.0 && b < 7.0) { const rr = (b - 1.2) * 520, a = 0.16 * (1 - r(b, 4.0, 7.0));
          for (let k = 0; k < N; k++) { const d = (Math.hypot(PX[k] - W / 2, PY[k] - H / 2) - rr) / 70; HGT[k] += a * Math.exp(-d * d); } }

      }

      function prog(vs, fs, names) {
        const sh = (t, src) => { const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };

      function initGL() {

      function lk(K, b, n) {   // a light or camera key, [beat, ...values], eased

      async function build() {
