    <script>
      const VS = `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;

      // ---------------- the clay: shared by every scene
      const COMMON = `#version 300 es
precision highp float; precision highp sampler2DArray;
out vec4 o;
uniform vec2 uRes, uJit; uniform vec3 uEye, uTar; uniform float uFov, uSeed, uMorph;
uniform vec3 uWall, uFloor, uKey; uniform vec4 uSpot;
uniform vec4 uHP[10], uHQ[10], uHC[10]; uniform vec4 uThumb;
uniform vec4 uLump; uniform float uLR, uRoll, uTw, uSys;
uniform vec4 uStack; uniform vec4 uPl[4]; uniform vec4 uP0[5], uP1[5]; uniform vec4 uStamp;
uniform float uLand[45], uPicW[45], uPalW[45], uMove;
uniform sampler2DArray uWords; uniform vec4 uA0, uA1, uB0, uB1, uC0, uC1; uniform vec3 uAC, uBC, uCC;
float gD; vec3 gC, gQ; float gK; float gSh = 0.0;
float h31(vec3 p){ return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }
float vn(vec3 p){ vec3 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(h31(i), h31(i + vec3(1,0,0)), f.x), mix(h31(i + vec3(0,1,0)), h31(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(h31(i + vec3(0,0,1)), h31(i + vec3(1,0,1)), f.x), mix(h31(i + vec3(0,1,1)), h31(i + vec3(1,1,1)), f.x), f.y), f.z); }
mat2 rot(float a){ float s = sin(a), c = cos(a); return mat2(c, s, -s, c); }   // rot(a) * v turns v by +a
float smin(float a, float b, float k){ float h = max(k - abs(a - b), 0.0) / k; return min(a, b) - h * h * k * 0.25; }
// hand-made: nothing is true. A cheap wobble in the object's own coordinates, so it travels with the object
float wob(vec3 q, float s){ return sin(q.x * 3.1 * s + sin(q.z * 2.3 * s + 1.3)) * sin(q.y * 2.7 * s + sin(q.x * 1.9 * s)) + 0.5 * sin(q.z * 5.3 * s + q.y * 4.1 * s); }
float rbox(vec3 p, vec3 b, float r){ vec3 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0) - r; }
float cyl(vec3 p, float R, float h, float r){ vec2 d = vec2(length(p.xy) - R + r, abs(p.z) - h + r); return min(max(d.x, d.y), 0.0) + length(max(d, 0.0)) - r; }
float tor(vec3 p, float R, float rr){ return length(vec2(length(p.xy) - R, p.z)) - rr; }
void U(float d, vec3 c, vec3 q, float k){ if (d < gD) { gD = d; gC = c; gQ = q; gK = k; } }
const vec3 EMB = vec3(0.80, 0.19, 0.03), BON = vec3(0.78, 0.70, 0.55), TEA = vec3(0.01, 0.20, 0.24), INK = vec3(0.025, 0.03, 0.05), TAN = vec3(0.66, 0.40, 0.26);
float box2(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }
float cap(vec3 p, vec3 a, vec3 b, float r){ vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0); return length(pa - ba * h) - r; }
// a word pressed out of clay: a 2D distance field in a texture, extruded and rounded. Outside its box the field keeps growing, so its shadow is letters and not a block
float wordF(vec3 p, vec4 W0, vec4 W1){
  if (W1.x <= 0.0) return 1e3;
  vec3 q = p - W0.xyz; q.y -= W0.w; vec3 w = vec3(W1.x, W1.x * 0.25, W1.y);
  float bb = rbox(q, w + 0.04, 0.02); if (bb > 0.5) return bb;
  float d2 = textureLod(uWords, vec3(q.x / w.x * 0.5 + 0.5, 0.5 - q.y / w.y * 0.5, W1.z), 0.0).r * w.x + wob(q * 3.0, 1.0) * 0.007 + length(max(abs(q.xy) - w.xy, vec2(0.0)));
  float e = abs(q.z) - w.z, rr = 0.04; vec2 v = vec2(d2 + rr, e + rr);
  return min(max(v.x, v.y), 0.0) + length(max(v, 0.0)) - rr;
}
`;

      // ---------------- the scenes. Each writes into U(). A shot only compiles what it shows
      const SCENES = {
        heap: `
void heap(vec3 p){
  // loose pictures: one plaque shape each. The picture itself is shaded later, as a height map
  for (int i = 0; i < 10; i++) { vec4 Q = uHQ[i]; if (Q.x <= 0.0) continue;
    vec3 q = p - uHP[i].xyz; q.xz = rot(Q.z) * q.xz; q.xy = rot(uHP[i].w) * q.xy;
    float d = rbox(q, vec3(Q.x, Q.y, 0.13), 0.09) + wob(q, 1.4) * 0.006; U(d, vec3(0.6), q, 30.0 + float(i)); }
  if (uThumb.w > 0.0) { vec3 q = p - uThumb.xyz; vec3 tv = vec3(18.0, 1.5, 6.0); float h = clamp(dot(q, tv) / dot(tv, tv), 0.0, 1.0); float d = cap(q, vec3(0.0), tv, uThumb.w * (1.0 + h * 0.75 + 0.1 * sin(h * 19.0) * step(0.12, h))) + wob(q, 1.5) * 0.02; U(d, TAN, q, 6.0); }
}`,
        lump: `
void lump(vec3 p){
  if (uLR <= 0.0) return;
  vec3 q = p - uLump.xyz; float sq = uLump.w; q.y /= sq; q.xz *= sqrt(sq); q.xz = rot(uRoll) * q.xz;
  float d = (length(q) - uLR) * min(sq, 1.0) + wob(q, 1.2) * 0.05 * min(sq, 1.0); U(d, vec3(0.6), q, 20.0);
}`,
        wall: `
void wall(vec3 p){
  // one wall of pictures: one cell's distance at a time, so forty-five cost the same as one
  vec3 q = p - vec3(0.0, 6.6, -4.2); vec2 c = vec2(clamp(floor(q.x / 2.6 + 0.5), -4.0, 4.0), clamp(floor(q.y / 2.0 + 0.5), -2.0, 2.0));
  int id = int(c.y + 2.0) * 9 + int(c.x + 4.0); float l = uLand[id]; vec3 t = q - vec3(c * vec2(2.6, 2.0), 0.0);
  if (l <= 0.0) { vec2 e = vec2(1.3, 1.0) - abs(t.xy); U(gSh > 0.5 ? max(abs(t.z) - 0.25, 0.45) : max(max(abs(t.z) - 0.25, min(e.x, e.y) + 0.1), 0.03), vec3(0.0), t, 7.0); return; }
  t.z -= (l - 1.0) * 1.25; float d = rbox(t, vec3(1.15, 0.85, 0.13), 0.09) + wob(t + float(id), 1.4) * 0.006; U(d, vec3(0.6), t, 80.0 + float(id));
}`,
        mould: `
void mould(vec3 p){
  // the press: four plates on a screw. Everything lives in the stack's coordinates
  vec3 s = p - uStack.xyz;
  for (int i = 0; i < 4; i++) { if (uPl[i].w <= 0.0) continue; vec3 t = s - uPl[i].xyz; float d = rbox(t, vec3(3.0, 0.48, 0.95), 0.1) + wob(t + float(i), 1.1) * 0.012; U(d, i == 3 ? EMB : BON, t + float(i) * 3.0, 2.0 + float(i));
    if (uP1[i].x > 0.0) U(wordF(s, uP0[i], uP1[i]), i == 3 ? BON : INK, t, 70.0); }
  if (uStack.w > 0.0) { float R = 0.42 + 0.03 * sin(s.y * 9.0); U(cap(s, vec3(0.0, 4.0, 0.0), vec3(0.0, 44.0, 0.0), R), vec3(0.16, 0.12, 0.10), s, 8.0); }
}`,
        stamp: `
void stamp(vec3 p){
  if (uStamp.w <= 0.0) return;
  vec3 q = p - uStamp.xyz; float d = rbox(q, vec3(1.9, 1.4, 0.7), 0.16) + wob(q, 1.1) * 0.012; U(d, EMB, q, 9.0);
  if (uP1[4].x > 0.0) U(wordF(q, uP0[4], uP1[4]), BON, q, 70.0);
}`,
      };

      const MAIN = `
vec3 N(vec3 p){ const vec2 e = vec2(0.0035, 0.0); return normalize(vec3(map(p + e.xyy) - map(p - e.xyy), map(p + e.yxy) - map(p - e.yxy), map(p + e.yyx) - map(p - e.yyx))); }
// the surface, in the object's own coordinates so it moves with the object
float thumbs(vec3 q, float tile){
  float S = 1.5, H = 0.0; vec3 g = q * S + tile * 3.1; vec3 i = floor(g);
  for (int z = -1; z <= 1; z++) for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
    vec3 c = i + vec3(x, y, z); if (h31(c) < 0.45) continue;
    vec3 o2 = vec3(h31(c + 1.1), h31(c + 2.2), h31(c + 3.3)); vec3 d = g - c - o2;
    float a = h31(c + 4.4) * 3.14; d.xy = rot(a) * d.xy; d.yz = rot(a * 1.7) * d.yz;
    float l = length(d * vec3(1.0, 1.5, 1.0)), m = smoothstep(0.5, 0.22, l); if (m <= 0.0) continue;
    H += m * (-0.8 + 0.2 * sin((length(d.xy * vec2(1.0, 1.55)) + vn(d * 4.0) * 0.1) * 95.0));
  }
  return H;
}
float surf(vec3 q, float tile){
  float h = 0.8 * vn(q * 2.1 + 3.0) + 0.42 * vn(q * 5.3 + 7.0) + 0.14 * vn(q * 15.0) + 0.05 * vn(q * 46.0);   // lumps, dents and nicks
  h += 0.28 * thumbs(q, tile);
  h += 0.035 * vn(q * 6.0 + uSeed * 11.0) + 0.016 * vn(q * 19.0 + uSeed * 37.0);                               // touched since the last pose
  h -= 0.018 * smoothstep(0.88, 0.92, vn(vec3(q.x * 2.2, q.y * 22.0, q.z * 2.2) + 9.0));                        // a tool mark
  return h;
}

// ---- the pictures: layers of flattened clay, one on another, each with a pillowed edge
vec3 gPC; float gPH;
void lay(float d, vec3 c, float h){ gPC = mix(gPC, c, smoothstep(0.018, -0.018, d)); gPH += h * smoothstep(0.04, -0.04, d); }
float tri2(vec2 p, vec2 a, vec2 b, vec2 c){ vec2 e0 = b - a, e1 = c - b, e2 = a - c, v0 = p - a, v1 = p - b, v2 = p - c;
  vec2 p0 = v0 - e0 * clamp(dot(v0, e0) / dot(e0, e0), 0.0, 1.0), p1 = v1 - e1 * clamp(dot(v1, e1) / dot(e1, e1), 0.0, 1.0), p2 = v2 - e2 * clamp(dot(v2, e2) / dot(e2, e2), 0.0, 1.0);
  float s = sign(e0.x * e2.y - e0.y * e2.x); vec2 d = min(min(vec2(dot(p0, p0), s * (v0.x * e0.y - v0.y * e0.x)), vec2(dot(p1, p1), s * (v1.x * e1.y - v1.y * e1.x))), vec2(dot(p2, p2), s * (v2.x * e2.y - v2.y * e2.x)));
  return -sqrt(d.x) * sign(d.y); }
void pic(float id, vec2 u, float T, vec3 A, vec3 B, vec3 C){ gPC = A; gPH = 0.0;
  if (id < 0.5) { // a boat on small waves
    lay(length(u - vec2(0.62, 0.48)) - 0.28, B, 0.22); vec2 q = u - vec2(-0.08, -0.2 + 0.03 * sin(T * 2.2)); q = rot(0.13 * sin(T * 1.7)) * q;
    lay(tri2(q, vec2(-0.03, 0.72), vec2(-0.03, 0.14), vec2(0.5, 0.14)), C, 0.3); lay(box2(q - vec2(0.0, -0.02), vec2(0.66, 0.15), 0.13), B, 0.42);
    lay(u.y + 0.42 + 0.07 * sin(u.x * 5.0 + T * 2.4), C, 0.5); lay(u.y + 0.72 + 0.05 * sin(u.x * 7.0 - T * 2.0), B, 0.25);
  } else if (id < 1.5) { // a bird breaking the water
    float a = sin(T * 6.0); vec2 c = u - vec2(0.0, 0.05 + 0.05 * a); lay((length(c / vec2(0.62, 0.27)) - 1.0) * 0.27, B, 0.4);
    lay(tri2(c, vec2(-0.3, 0.05), vec2(0.28, 0.05), vec2(-0.5 - 0.1 * a, 0.72 + 0.26 * a)), C, 0.32); lay(tri2(c, vec2(-0.5, 0.06), vec2(-0.5, -0.1), vec2(-1.0, 0.1 + 0.12 * a)), C, 0.24); lay(tri2(c, vec2(0.58, 0.08), vec2(0.58, -0.08), vec2(1.06, -0.02)), C, 0.25); lay(length(c - vec2(0.38, 0.07)) - 0.05, A, 0.08);
    lay(u.y + 0.62 + 0.04 * sin(u.x * 6.0 + T * 3.0), C, 0.4);
  } else if (id < 2.5) { // mountains over a still lake
    lay(tri2(u, vec2(-1.3, -0.14), vec2(-0.3, 0.8), vec2(0.72, -0.14)), B, 0.38); lay(tri2(u, vec2(-0.05, -0.14), vec2(0.72, 0.5), vec2(1.34, -0.14)), C, 0.28);
    lay(u.y + 0.14, C, 0.12); for (int i = 0; i < 3; i++) { float y = -0.32 - float(i) * 0.2; lay(box2(u - vec2(0.3 * sin(float(i) * 2.0 + T), y), vec2(0.7 - float(i) * 0.15, 0.03), 0.03), B, 0.12); }
  } else if (id < 3.5) { // a car, no badge
    vec2 q = u - vec2(0.0, 0.012 * sin(T * 9.0)); lay(u.y + 0.6, C, 0.16); lay(box2(q - vec2(-0.08, 0.16), vec2(0.56, 0.24), 0.2), B, 0.32); lay(box2(q - vec2(-0.08, 0.17), vec2(0.42, 0.13), 0.1), A, 0.05);
    lay(box2(q - vec2(0.0, -0.18), vec2(1.02, 0.25), 0.2), B, 0.42); lay(box2(q - vec2(0.0, -0.13), vec2(0.95, 0.04), 0.03), C, 0.1);
    lay(length(q - vec2(-0.6, -0.44)) - 0.2, INK, 0.3); lay(length(q - vec2(0.6, -0.44)) - 0.2, INK, 0.3);
  } else if (id < 4.5) { // a yacht from the side, on a long wake
    vec2 q = u - vec2(0.0, 0.015 * sin(T * 2.0)); lay(tri2(q, vec2(-1.02, 0.02), vec2(1.12, 0.02), vec2(-0.66, -0.36)), B, 0.44); lay(tri2(q, vec2(-0.92, 0.02), vec2(0.58, 0.02), vec2(-0.72, 0.26)), B, 0.3);
    lay(box2(q - vec2(-0.32, 0.12), vec2(0.36, 0.06), 0.04), A, 0.06); lay(tri2(q, vec2(-0.68, 0.24), vec2(0.0, 0.24), vec2(-0.52, 0.46)), C, 0.2);
    lay(u.y + 0.46 + 0.03 * sin(u.x * 6.0 + T * 2.4), C, 0.42); lay(box2(u - vec2(-0.6 + 0.08 * sin(T), -0.66), vec2(0.42, 0.03), 0.03), B, 0.1);
  } else if (id < 5.5) { // a figure and a megaphone
    vec2 c = u - vec2(-0.48, 0.0); lay(box2(c - vec2(0.0, -0.45), vec2(0.3, 0.55), 0.18), C, 0.32); lay(length(c - vec2(0.0, 0.34)) - 0.24, B, 0.42);
    lay(tri2(c, vec2(0.12, 0.2), vec2(0.12, 0.05), vec2(0.72, 0.44)) , B, 0.2); lay(tri2(c, vec2(0.12, 0.05), vec2(0.72, 0.44), vec2(0.72, -0.2)), B, 0.3);
    for (int i = 0; i < 2; i++) { float r = 0.32 + float(i) * 0.26 + 0.05 * sin(T * 6.0 - float(i)); vec2 m = c - vec2(0.72, 0.12); lay(max(abs(length(m) - r) - 0.035, -m.x), C, 0.18); }
  } else if (id < 6.5) { // lights over a ridge
    for (int i = 0; i < 3; i++) { float y = 0.6 - float(i) * 0.36 + 0.14 * sin(u.x * 2.5 + float(i) * 1.7 + T * 1.2); lay(abs(u.y - y) - 0.09 + 0.03 * sin(u.x * 4.0 - T), i == 1 ? C : B, 0.18); }
    lay(u.y + 0.4 + 0.2 * abs(sin(u.x * 2.3 + 0.6)), C, 0.42);
  } else { // a record
    lay(length(u) - 0.93, INK, 0.3); float r = length(u); gPH += 0.035 * sin(r * 62.0) * step(0.34, r) * step(r, 0.9);
    lay(r - 0.32, B, 0.08); vec2 q = rot(T * 3.3) * u; lay(length(q - vec2(0.18, 0.0)) - 0.06, C, 0.05); lay(r - 0.04, A, 0.04);
  }
}
void pal(float k, out vec3 A, out vec3 B, out vec3 C){
  if (k < 0.5) { A = TEA; B = EMB; C = BON; } else if (k < 1.5) { A = EMB; B = BON; C = TEA; } else if (k < 2.5) { A = BON; B = TEA; C = EMB; }
  else if (k < 3.5) { A = vec3(1.0, 0.06, 0.40); B = vec3(0.55, 0.85, 0.05); C = vec3(0.02, 0.72, 0.85); }
  else if (k < 10.5) { A = vec3(0.04, 0.14, 0.70); B = vec3(0.92, 0.78, 0.05); C = vec3(0.70, 0.04, 0.05); } else if (k < 11.5) { A = vec3(0.35, 0.05, 0.60); B = vec3(0.90, 0.80, 0.05); C = vec3(0.02, 0.60, 0.20); }
  else if (k < 12.5) { A = vec3(0.00, 0.50, 0.25); B = vec3(0.95, 0.35, 0.05); C = vec3(0.70, 0.70, 0.75); } else if (k < 13.5) { A = vec3(0.75, 0.72, 0.05); B = vec3(0.02, 0.08, 0.50); C = vec3(0.80, 0.05, 0.05); }
  else if (k < 14.5) { A = vec3(0.90, 0.90, 0.85); B = vec3(0.10, 0.10, 0.10); C = vec3(0.02, 0.40, 0.90); } else { A = vec3(0.50, 0.20, 0.05); B = vec3(0.10, 0.75, 0.70); C = vec3(0.85, 0.75, 0.10); }
}
// the marbled lump: colour that runs through the volume, and really twists as it's kneaded
vec3 marble(vec3 q0){ vec3 q = q0; q.xz = rot(uTw * q.y * 0.75) * q.xz; float w = vn(q * 1.1 + 3.0) * 3.0;
  float b1 = smoothstep(-0.10, 0.10, sin((q.x + q.y * 0.6) * 2.6 + w * 3.0 + uTw * 0.5)), b2 = smoothstep(-0.10, 0.10, sin((q.z - q.y) * 3.4 + w * 2.2));
  vec3 a = mix(vec3(0.04, 0.14, 0.70), EMB, uSys), b = mix(vec3(0.92, 0.78, 0.05), BON, uSys), c = mix(vec3(0.35, 0.05, 0.60), TEA, uSys), d = mix(vec3(0.00, 0.50, 0.25), INK, uSys);
  return mix(mix(a, b, b1), mix(c, d, b1), b2); }
float shadow(vec3 ro, vec3 rd){ gSh = 1.0; float s = 1.0, t = 0.04 + 0.05 * fract(sin(dot(gl_FragCoord.xy + uJit * 7.0, vec2(12.9898, 78.233))) * 43758.5453); for (int i = 0; i < 40; i++) { float d = map(ro + rd * t); s = min(s, 16.0 * d / t); t += clamp(d * 0.85, 0.035, 0.7); if (s < 0.002 || t > 26.0) break; } gSh = 0.0; s = clamp(s, 0.0, 1.0); return s * s * (3.0 - 2.0 * s); }
float ao(vec3 p, vec3 n){ float a = 0.0, w = 1.0; gSh = 1.0; for (int i = 1; i <= 5; i++) { float h = 0.03 + 0.14 * float(i); a += (h - map(p + n * h)) * w; w *= 0.62; } gSh = 0.0; return clamp(1.0 - 1.15 * a, 0.0, 1.0); }
