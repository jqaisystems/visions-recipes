<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <!--
      R32 · Pinned. 33.6 s at 100 bpm, paper cut-out stop motion (season 4, film 1). For Etsy to Pinterest, João's
      pipeline that turns Etsy listings into Pinterest-ready image and video pins. The pipeline as a craft table: a
      listing slides in, its gallery fans out, scissors cut out the charts that are not pins, each photo is cut to a 2:3
      pin and a tag unfolds with its own title and alt text, two boards pop up out of a spread and the pins are pushed
      on, a week of strips takes the pins with gaps between them, and the video folds into 9:16, gets a cover and is
      filed in the manual folder. Then the table is swept and the JQ AI SYSTEMS logo lands.
      Technique: one Canvas 2D. Every piece is a cut path whose edge is torn by noise along its normals and filled with
      a paper stock generated from noise (fibres, mottling, speckle); a tabletop light gives each piece a shadow that
      grows with its height. Time is snapped to 12 poses a second (shot on twos), and every pose nudges each piece and
      re-cuts its edge a little, like stop motion. paint(t) draws every frame from one baked table (assets/table.js,
      from bake/table.py); score/compose.py reads it too.
    -->
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/table.js"></script>
    <style>
      @font-face { font-family: "Archivo"; src: url("assets/fonts/Archivo.ttf") format("truetype"); font-weight: 100 900; }
      @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/InstrumentSerif-Regular.ttf") format("truetype"); font-weight: 400; font-style: normal; }
      @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/InstrumentSerif-Italic.ttf") format("truetype"); font-weight: 400; font-style: italic; }
      @font-face { font-family: "JBM"; src: url("assets/fonts/jetbrains-mono.woff2") format("woff2"); font-weight: 100 800; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #2c4a3a; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #2c4a3a; color: #221f1d; }
      #ct-stage { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      #cv { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
      #ct-ui { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      .hud { position: absolute; top: 40px; font: 600 17px "JBM", monospace; letter-spacing: 0.2em; white-space: nowrap; color: #f2e9d8; text-transform: uppercase; text-shadow: 0 2px 8px rgba(0,0,0,0.6); }
      #hud-l { left: 64px; }
      #hud-l span { color: #7fd8cb; }
      #hud-r { right: 64px; letter-spacing: 0.12em; text-transform: none; color: #7fd8cb; }
      #title { position: absolute; inset: 0; opacity: 0; }
      #t-logo { position: absolute; left: 590px; top: 352px; width: 740px; height: 154px; }
      #t-name { position: absolute; left: 0; right: 0; top: 560px; text-align: center; font: 700 50px "Archivo", sans-serif; color: #f2e9d8; white-space: nowrap; opacity: 0; }
      #t-line { position: absolute; left: 0; right: 0; top: 632px; text-align: center; font: italic 400 38px "Instrument Serif", serif; color: #cbbfab; white-space: nowrap; opacity: 0; }
      #t-url { position: absolute; left: 0; right: 0; top: 708px; height: 40px; text-align: center; font: 500 30px "JBM", monospace; color: #3cc4b4; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="33.6" data-width="1920" data-height="1080">
      <div id="ct-stage" class="clip" data-start="0" data-duration="33.6" data-track-index="0">
        <canvas id="cv" width="1920" height="1080" data-layout-allow-overflow></canvas>
      </div>
      <div id="ct-ui" class="clip" data-start="0" data-duration="33.6" data-track-index="1">
        <div class="hud" id="hud-l" data-layout-allow-occlusion>JQ AI SYSTEMS <span>· etsy to pinterest</span></div>
        <div class="hud" id="hud-r" data-layout-allow-occlusion><span id="hud-st">01 import</span></div>
        <div id="title" data-layout-allow-occlusion>
          <img id="t-logo" src="assets/brand/jqai-logo.png" alt="JQ AI SYSTEMS">
          <div id="t-name">Etsy to Pinterest</div>
          <div id="t-line">Etsy media in, Pinterest queue out</div>
          <div id="t-url"></div>
        </div>
      </div>
      <audio id="score" src="assets/bgm/score.wav" data-start="0" data-duration="33.6" data-track-index="7" data-volume="0.8"></audio>
    </div>

    <script>
      const TB = window.TABLE, T = TB.T, E = TB.E, DUR = TB.dur, BEAT = TB.beat, PZ = TB.poses;
      const W = 1920, H = 1080;
      const URL_TEXT = "ai.joaoqueiros.com/systems/etsy-to-pinterest";
      const $ = (s) => document.querySelector(s);
      const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const r = (t, a, b) => cl((t - a) / (b - a));
      const lerp = (a, b, u) => a + (b - a) * u;
      const eOut = (u) => 1 - Math.pow(1 - u, 3), eIn = (u) => u * u * u, eIO = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
      const eBack = (u) => { const c = 1.6, c3 = c + 1; return 1 + c3 * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
      function hash(n) { const s = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); }
      function vnoise(x, seed) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i + seed * 57.31), hash(i + 1 + seed * 57.31), u) * 2 - 1; }
      function prng(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

      let ctx, POSE = 0, DEPTH = 0, PARA = true;
      const CAM = { x: 960, y: 540, z: 1 };

      // ---------------------------------------------------------------- paper stocks, made once from noise
      const STOCK = { kraft: "#c09769", cream: "#f2e9d8", white: "#f8f5ef", news: "#e8e2d4", ink: "#221f1d", teal: "#16a194", green: "#3f6c4c", greenD: "#2e523a",
        terra: "#c65f3d", mustard: "#dcab4a", manila: "#e4c88f", manilaD: "#d3b278", sky: "#a7cde0", sand: "#dcc49b", wood: "#8c6642", woodD: "#755233",
        water: "#3a7da5", steel: "#bfc3c6", cork: "#b98a5a", sun: "#f1b54b", grey: "#8f897f", blue: "#2b85c5", mat: "#2c4a3a", pencil: "#e3b23a", lead: "#3a3633" };
      const PAT = {};
      function makeStocks() {
        Object.entries(STOCK).forEach(([k, base], si) => {
          const c = document.createElement("canvas"); c.width = c.height = 512;
          const g = c.getContext("2d"), R = prng(1000 + si * 7919);
          g.fillStyle = base; g.fillRect(0, 0, 512, 512);
          const dk = k === "ink" ? 0.04 : 0.03, lt = k === "ink" ? 0.012 : 0.04;
          const wrapDraw = (fn) => { for (const ox of [-512, 0, 512]) for (const oy of [-512, 0, 512]) fn(ox, oy); };
          for (let i = 0; i < 110; i++) {
            const x = R() * 512, y = R() * 512, rad = 20 + R() * 80, d = R() < 0.5;
            wrapDraw((ox, oy) => { const gr = g.createRadialGradient(x + ox, y + oy, 0, x + ox, y + oy, rad);
              gr.addColorStop(0, d ? `rgba(0,0,0,${dk})` : `rgba(255,255,255,${lt})`); gr.addColorStop(1, "rgba(0,0,0,0)");
              g.fillStyle = gr; g.fillRect(x + ox - rad, y + oy - rad, rad * 2, rad * 2); });
          }
          g.lineWidth = 0.8;
          for (let i = 0; i < 1500; i++) {
            const x = R() * 512, y = R() * 512, a = R() * Math.PI, l = 4 + R() * 16, dark = R() < 0.55, al = (dark ? 0.07 : 0.11) * R();
            g.strokeStyle = dark ? `rgba(0,0,0,${al})` : `rgba(255,255,255,${al})`;
            wrapDraw((ox, oy) => { if (Math.abs(ox) + Math.abs(oy) && (x > 24 && x < 488 && y > 24 && y < 488)) return;
              g.beginPath(); g.moveTo(x + ox, y + oy); g.quadraticCurveTo(x + ox + Math.cos(a + 0.7) * l * 0.5, y + oy + Math.sin(a + 0.7) * l * 0.5, x + ox + Math.cos(a) * l, y + oy + Math.sin(a) * l); g.stroke(); });
          }
          for (let i = 0; i < 700; i++) { g.fillStyle = `rgba(0,0,0,${0.1 * R()})`; g.fillRect(R() * 512, R() * 512, 1.2, 1.2); }
          PAT[k] = ctx.createPattern(c, "repeat");
        });
      }
      let GRAIN, LIGHT;
      function makePost() {
        GRAIN = document.createElement("canvas"); GRAIN.width = GRAIN.height = 256;
        const g = GRAIN.getContext("2d"), im = g.createImageData(256, 256), R = prng(77);
        for (let i = 0; i < 256 * 256; i++) { const v = 100 + R() * 56; im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = 255; }
        g.putImageData(im, 0, 0);
        LIGHT = document.createElement("canvas"); LIGHT.width = W; LIGHT.height = H;
        const l = LIGHT.getContext("2d");
        let gr = l.createRadialGradient(760, 300, 80, 900, 520, 1250);
        gr.addColorStop(0, "rgba(255, 238, 205, 0.16)"); gr.addColorStop(0.55, "rgba(255, 238, 205, 0)"); gr.addColorStop(1, "rgba(6, 10, 8, 0.5)");
        l.fillStyle = gr; l.fillRect(0, 0, W, H);
      }

      // ---------------------------------------------------------------- cut paper
      const SH = new Map();
      function resample(poly, step) {
        const pts = [];
        for (let i = 0; i < poly.length; i++) {
          const [x0, y0] = poly[i], [x1, y1] = poly[(i + 1) % poly.length];
          const n = Math.max(1, Math.round(Math.hypot(x1 - x0, y1 - y0) / step));
          for (let k = 0; k < n; k++) pts.push([x0 + ((x1 - x0) * k) / n, y0 + ((y1 - y0) * k) / n]);
        }
        return pts;
      }
      function shape(key, make, step) {
        let s = SH.get(key);
        if (s) return s;
        const pts = resample(make(), step), n = pts.length, nrm = [];
        for (let i = 0; i < n; i++) { const a = pts[(i - 1 + n) % n], b = pts[(i + 1) % n]; const nx = b[1] - a[1], ny = -(b[0] - a[0]), l = Math.hypot(nx, ny) || 1; nrm.push([nx / l, ny / l]); }
        s = { pts, nrm }; SH.set(key, s); return s;
      }
      const RECT = (w, h) => () => [[-w / 2, -h / 2], [w / 2, -h / 2], [w / 2, h / 2], [-w / 2, h / 2]];
      const CIRC = (rx, ry = rx, n = 36) => () => Array.from({ length: n }, (_, i) => [rx * Math.cos((i / n) * 2 * Math.PI), ry * Math.sin((i / n) * 2 * Math.PI)]);
      function fillStock(path, stock, seed) {
        const p = PAT[stock];
        p.setTransform(new DOMMatrix().translate(hash(seed) * 512, hash(seed + 1.3) * 512));
        ctx.fillStyle = p; ctx.fill(path);
      }
      // one piece of paper: a torn outline, a stock, a shadow from its height, and whatever is printed or glued on it
      function piece(P) {
        const S = shape(P.key, P.make, P.step || 12), n = S.pts.length, tear = P.tear ?? 1.3, seed = P.seed ?? 1;
        const path = new Path2D();
        for (let i = 0; i < n; i++) {
          const p = S.pts[i], q = S.nrm[i];
          const d = tear * vnoise(i * 0.55, seed) + 0.55 * (hash(i * 3.17 + seed * 11.3 + POSE * 0.731) - 0.5);
          const x = p[0] + q[0] * d, y = p[1] + q[1] * d;
          i ? path.lineTo(x, y) : path.moveTo(x, y);
        }
        path.closePath();
        const jx = (hash(seed * 7.7 + POSE * 1.37) - 0.5) * 1.0, jy = (hash(seed * 3.3 + POSE * 2.11) - 0.5) * 1.0, jr = (hash(seed * 5.1 + POSE * 0.77) - 0.5) * 0.004;
        ctx.save();
        const h = P.h ?? 0.6, top = DEPTH === 0 && PARA;
        const px = top ? (P.x - CAM.x) * h * 0.01 : 0, py = top ? (P.y - CAM.y) * h * 0.01 : 0, ps = top ? 1 + h * 0.008 : 1;
        ctx.translate(P.x + jx + px, P.y + jy + py); ctx.rotate((P.rot || 0) + jr);
        const s = (P.s ?? 1) * ps; ctx.scale(s * (P.sx ?? 1), s * (P.sy ?? 1));
        if (P.alpha !== undefined) ctx.globalAlpha *= P.alpha;
        const z = (PARA ? CAM.z : 1) * (P.zs ?? 1);
        if (h > 0) {
          ctx.shadowColor = `rgba(6, 12, 8, ${(0.5 - 0.05 * Math.min(h, 4)).toFixed(3)})`;
          ctx.shadowBlur = (2 + h * 9) * z; ctx.shadowOffsetX = (1.5 + h * 6) * z; ctx.shadowOffsetY = (2 + h * 8) * z;
        }
        fillStock(path, P.stock, seed);
        ctx.shadowColor = "transparent";
        if (P.content) { ctx.save(); ctx.clip(path); DEPTH++; P.content(); DEPTH--; ctx.restore(); }
        ctx.lineWidth = 1.5 / Math.max(0.2, s); ctx.strokeStyle = P.edge || "rgba(255, 248, 236, 0.34)"; ctx.stroke(path);
        ctx.restore();
      }
      function txt(s, x, y, font, col, align = "center") { ctx.font = font; ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = "middle"; ctx.fillText(s, x, y); }
      function fillRectStock(stock, x, y, w, h, seed = 3) { const p = new Path2D(); p.rect(x, y, w, h); fillStock(p, stock, seed); }

      // ---------------------------------------------------------------- the listing's own media, as prints
      // photos and charts are 2:3; a print is a square sheet with the photo on the left and a paper margin the scissors trim
      const IMG = {}, FRAMES = [];
      const MEDIA_OF = (kind) => typeof kind === "number" ? "photo" + kind : kind;
      function drawImg(im, x, y, w, h, fy = 0.5) {
        // cover crop of an image into a box, fy picks where the crop sits vertically
        if (!im) { ctx.fillStyle = "#cfc6b4"; ctx.fillRect(x, y, w, h); return; }
        const ir = im.naturalWidth / im.naturalHeight, br = w / h;
        let sw = im.naturalWidth, sh = im.naturalHeight, sx = 0, sy = 0;
        if (ir > br) { sw = sh * br; sx = (im.naturalWidth - sw) / 2; } else { sh = sw / br; sy = (im.naturalHeight - sh) * fy; }
        ctx.drawImage(im, sx, sy, sw, sh, x, y, w, h);
      }
      function photoContent(kind, seed, dx = 0) {
        const name = MEDIA_OF(kind), n = ["photo0", "photo1", "size", "photo2", "colour", "photo3"].indexOf(name) + 1;
        return () => {
          ctx.save(); ctx.translate(dx, 0); ctx.beginPath(); ctx.rect(-155, -155, 310, 310); ctx.clip();
          drawImg(IMG[name], -155, -150, 200, 300);
          // the margin: the print's own notes and a registration mark
          ctx.save(); ctx.translate(100, 0); ctx.rotate(-Math.PI / 2);
          txt("KAYAK · IMG 0" + n, 0, -18, '700 15px "JBM"', "#221f1d"); txt("1000 × 1500", 0, 6, '500 13px "JBM"', "#8a7f70");
          ctx.restore();
          ctx.strokeStyle = "rgba(34, 31, 29, 0.6)"; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.arc(100, -120, 9, 0, 7); ctx.moveTo(86, -120); ctx.lineTo(114, -120); ctx.moveTo(100, -134); ctx.lineTo(100, -106); ctx.stroke();
          ctx.restore();
        };
      }
      // a square crop of a photo, for the listing's hero image
      function heroContent(name) { return () => drawImg(IMG[name], -155, -155, 310, 310, 0.12); }
      const frameAt = (i) => FRAMES[((i % FRAMES.length) + FRAMES.length) % FRAMES.length];

      // ---------------------------------------------------------------- the film: three frames on an ink strip
      function filmFrame(k, seed) {
        return () => {
          fillRectStock("ink", -95, -100, 190, 200, seed);
          for (let i = 0; i < 5; i++) for (const y of [-86, 86]) { ctx.fillStyle = "#2c4a3a"; ctx.fillRect(-80 + i * 36, y - 6, 18, 12); }
          ctx.save(); ctx.beginPath(); ctx.rect(-80, -70, 160, 140); ctx.clip();
          drawImg(frameAt([6, 36, 66][k]), -80, -70, 160, 140, 0.3);
          ctx.restore();
        };
      }
      function drawFilm(x, y, rot, s, fold, h, seed = 600) {
        // the outer frames fold in behind the middle one
        const c = Math.cos(rot), sn = Math.sin(rot), u = fold;
        [0, 2, 1].forEach((k) => {
          const off = k === 1 ? 0 : (k === 0 ? -1 : 1) * (95 + 95 * (1 - u)), sx = k === 1 ? 1 : Math.max(0.02, 1 - u);
          if (k !== 1 && u >= 0.999) return;
          piece({ key: "frame", make: RECT(190, 200), x: x + off * c * s, y: y + off * sn * s, rot, s, sx, h: h + (k === 1 ? 0.2 : 0), stock: "ink", seed: seed + k * 13, tear: 0.8, step: 14, content: filmFrame(k, seed + k * 13), edge: "rgba(255,248,236,0.18)" });
        });
      }

      // ---------------------------------------------------------------- scissors, cut from card: two steel blades and two handles
      const BLADE = () => [[-8, -8], [146, -4], [168, 0], [146, 6], [-8, 9]];
      function scissors(x, y, rot, open, s = 1) {
        for (const sg of [1, -1]) {
          const a = rot + sg * open * 0.5;
          piece({ key: "handle", make: CIRC(34, 22, 26), x: x - Math.cos(a) * 74 * s, y: y - Math.sin(a) * 74 * s, rot: a, s, h: 2.6, stock: "terra", seed: 40 + sg, tear: 0.6, step: 8 });
          piece({ key: "blade", make: BLADE, x, y, rot: a, s, h: 2.8, stock: "steel", seed: 44 + sg, tear: 0.3, step: 10 });
        }
        piece({ key: "rivet", make: CIRC(7, 7, 12), x, y, s, h: 2.9, stock: "ink", seed: 48, tear: 0.2, step: 4 });
      }
      function pushpin(x, y, h) {
        piece({ key: "pp", make: CIRC(14, 14, 18), x, y, h, stock: "terra", seed: 70 + x * 0.01, tear: 0.4, step: 5,
          content: () => { ctx.fillStyle = "rgba(255, 240, 220, 0.75)"; ctx.beginPath(); ctx.arc(-4, -5, 4.5, 0, 7); ctx.fill(); } });
      }

      // ---------------------------------------------------------------- type: every word on its own strip of paper
      const WC = new Map();
      function wordW(text, font) { const k = font + "|" + text; if (!WC.has(k)) { ctx.font = font; WC.set(k, ctx.measureText(text).width); } return WC.get(k); }
      function wrapText(text, font, maxW) {
        ctx.font = font; const out = []; let cur = "";
        for (const w of text.split(" ")) { const t = cur ? cur + " " + w : w; if (ctx.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; }
        if (cur) out.push(cur); return out;
      }
      function layLines() {
        TB.lines.forEach((L, i) => {
          const big = !!L.big, fs = big ? 128 : 74, fa = big ? 152 : 90;
          const words = L.words.map((w, k) => {
            const acc = k === L.accent, font = acc ? `italic 400 ${fa}px "Instrument Serif"` : `800 ${fs}px "Archivo"`;
            return { text: w, font, acc, w: wordW(w, font) + (big ? 46 : 32), h: fs * 1.24 };
          });
          const gap = big ? 18 : 12, total = words.reduce((s, w) => s + w.w, 0) + gap * (words.length - 1);
          let x = L.at[0] === 0 ? 960 - total / 2 : L.at[0];
          L.lay = words.map((w, k) => {
            const sd = 300 + i * 20 + k, ink = !w.acc && k % 2 === 1;
            const o = { ...w, key: `w${i}_${k}`, x: x + w.w / 2, y: L.at[1] + (hash(sd) - 0.5) * 14, rot: (hash(sd * 1.7) - 0.5) * 0.07, seed: sd,
              stock: w.acc ? "teal" : ink ? "ink" : "news", col: w.acc || ink ? "#f6efe2" : "#221f1d", dy: w.acc ? fs * 0.02 : fs * 0.05 };
            x += w.w + gap; return o;
          });
        });
      }
      function drawLine(L, t) {
        if (t < L.t || t > L.out + 1.4) return;
        const n = L.lay.length;
        L.lay.forEach((w, k) => {
          const ti = L.t + k * 0.16, to = L.out + (n - 1 - k) * 0.08;
          if (t < ti) return;
          const a = eOut(r(t, ti, ti + 0.25)), b = eIn(r(t, to, to + 0.4));
          if (b >= 1) return;
          piece({ key: w.key, make: RECT(w.w, w.h), x: w.x + 40 * b, y: w.y - 22 * (1 - a) - 320 * b, rot: w.rot + (k % 2 ? 0.5 : -0.5) * b, s: lerp(1.14, 1, a) + 0.08 * b,
            h: lerp(3.6, 0.45, a) + 3.5 * b, stock: w.stock, seed: w.seed, tear: 1.6, step: 14, content: () => txt(w.text, 0, w.dy, w.font, w.col) });
        });
      }

      // ---------------------------------------------------------------- layout
      const LIST = { w: 980, h: 560 };
      const thumbAt = (g) => [6 + g * 66, 196];
      const fanAt = (k) => { const d = k - 3; return { x: 960 + d * 236, y: 690 + 14 * d * d, rot: d * 0.06 }; };
      const rowAt = (j) => ({ x: 960 + (j - 1.5) * 365, y: 470 });
      const PHOTO_G = [0, 1, 3, 5];                 // where each photo sits in the gallery
      const BOOK = { y: 650, base: 800 }, BOARDX = [660, 1260];
      const DAYX = (d) => 960 + (d - 2) * 268, DAYY = 620, DAYS = ["MON", "TUE", "WED", "THU", "FRI"];
      const timeY = (s) => { const [hh, mm] = s.split(":").map(Number); return DAYY - 205 + ((hh + mm / 60 - 8) / 14) * 440; };
      const FOLD = { x: 1300, y: 600 };
      let TITLE_LINES = [], PIN_TXT = [], ALT_TXT = [];

      function listingAt(t) {
        const a = eBack(r(t, E.listIn[0], E.listIn[1])), lift = eIO(r(t, E.lift, E.fan[0] + 0.3)), out = eIn(r(t, E.listOut[0], E.listOut[1]));
        return { x: lerp(2600, 960, a) + lerp(0, 490, lift) + 400 * out, y: lerp(560, 390, lift) - 860 * out, s: lerp(1, 0.55, lift), rot: lerp(0.03, -0.02, a) + 0.03 * lift, h: 0.6 + 1.6 * lift + 2 * out };

      // ---------------------------------------------------------------- the scissors' path through the film
      function scissorsAt(t) {

      // ---------------------------------------------------------------- the frame
      function drawTable() {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        const p = PAT.kraft; p.setTransform(new DOMMatrix().scale(1.5)); ctx.fillStyle = p; ctx.fillRect(0, 0, W, H);
        ctx.setTransform(CAM.z, 0, 0, CAM.z, W / 2 - CAM.x * CAM.z, H / 2 - CAM.y * CAM.z);
        // a self-healing cutting mat: a fine grid, a heavier line every five squares, the angle guides and the numbers
        piece({ key: "mat", make: RECT(2600, 1640), x: 960, y: 540, h: 0, stock: "mat", seed: 1, tear: 2, step: 40, edge: "rgba(0,0,0,0)", content: () => {
          ctx.lineWidth = 1.2;
          for (let i = -26; i <= 26; i++) { ctx.strokeStyle = i % 5 ? "rgba(214, 236, 222, 0.08)" : "rgba(214, 236, 222, 0.2)"; ctx.beginPath(); ctx.moveTo(i * 50, -820); ctx.lineTo(i * 50, 820); ctx.stroke(); }
          for (let i = -16; i <= 16; i++) { ctx.strokeStyle = i % 5 ? "rgba(214, 236, 222, 0.08)" : "rgba(214, 236, 222, 0.2)"; ctx.beginPath(); ctx.moveTo(-1300, i * 50); ctx.lineTo(1300, i * 50); ctx.stroke(); }
          ctx.strokeStyle = "rgba(214, 236, 222, 0.11)"; ctx.setLineDash([16, 10]);
          for (const a of [Math.PI / 4, -Math.PI / 4, Math.PI / 3]) { ctx.beginPath(); ctx.moveTo(-1400 * Math.cos(a), -1400 * Math.sin(a)); ctx.lineTo(1400 * Math.cos(a), 1400 * Math.sin(a)); ctx.stroke(); }
          ctx.setLineDash([]);
          for (let i = -4; i <= 4; i++) { txt(String(i + 5), i * 250 + 8, -428, '500 15px "JBM"', "rgba(214, 236, 222, 0.42)", "left"); txt(String(i + 5), -948, i * 250 - 8, '500 15px "JBM"', "rgba(214, 236, 222, 0.42)", "left"); }
        } });
        // what lives on a craft table
        const pa = -0.32, pc = Math.cos(pa), psn = Math.sin(pa);
        piece({ key: "pbody", make: RECT(380, 26), x: 230, y: 990, rot: pa, h: 1.1, stock: "pencil", seed: 51, tear: 0.4, step: 12, content: () => { ctx.fillStyle = "rgba(0,0,0,0.12)"; ctx.fillRect(-190, 4, 380, 9); } });
        piece({ key: "ptip", make: () => [[0, -13], [52, 0], [0, 13]], x: 230 + 190 * pc, y: 990 + 190 * psn, rot: pa, h: 1.1, stock: "cream", seed: 52, tear: 0.4, step: 8,
          content: () => { ctx.fillStyle = "#3a3633"; ctx.beginPath(); ctx.moveTo(36, -4); ctx.lineTo(54, 0); ctx.lineTo(36, 4); ctx.fill(); } });
        piece({ key: "pferr", make: RECT(22, 28), x: 230 - 201 * pc, y: 990 - 201 * psn, rot: pa, h: 1.1, stock: "steel", seed: 53, tear: 0.3, step: 6 });
        piece({ key: "perase", make: RECT(30, 26), x: 230 - 226 * pc, y: 990 - 226 * psn, rot: pa, h: 1.1, stock: "terra", seed: 54, tear: 0.4, step: 6 });
        piece({ key: "tape", make: CIRC(74, 74, 40), x: 118, y: 560, h: 1.5, stock: "terra", seed: 55, tear: 0.6, step: 10, content: () => {
          ctx.strokeStyle = "rgba(255, 240, 225, 0.35)"; ctx.lineWidth = 2; for (const rr of [52, 60, 66]) { ctx.beginPath(); ctx.arc(0, 0, rr, 0, 7); ctx.stroke(); }
          ctx.fillStyle = "#2c4a3a"; ctx.beginPath(); ctx.arc(0, 0, 44, 0, 7); ctx.fill(); ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.beginPath(); ctx.arc(4, 5, 44, 0, 7); ctx.fill(); } });
        piece({ key: "spoolT", make: RECT(84, 120), x: 1838, y: 560, h: 1.4, stock: "blue", seed: 56, tear: 0.4, step: 8, content: () => {
          ctx.strokeStyle = "rgba(255,255,255,0.18)"; ctx.lineWidth = 1.5; for (let i = -56; i < 60; i += 6) { ctx.beginPath(); ctx.moveTo(-42, i); ctx.lineTo(42, i + 3); ctx.stroke(); } } });
        for (const dy of [-68, 68]) piece({ key: "spoolE", make: RECT(112, 18), x: 1838, y: 560 + dy, h: 1.5, stock: "wood", seed: 57 + dy, tear: 0.4, step: 8 });
        [[330, 905, "teal"], [1590, 215, "cream"], [70, 830, "terra"], [1860, 330, "mustard"], [1180, 1030, "cream"], [690, 1036, "teal"], [1880, 780, "news"], [420, 150, "mustard"]].forEach(([x, y, st], i) =>
          piece({ key: "scrap" + (i % 3), make: [() => [[-22, -14], [26, -6], [-6, 18]], RECT(54, 14), () => [[-18, -18], [20, -10], [14, 16], [-16, 12]]][i % 3], x, y, rot: hash(i * 7.3) * 6, h: 0.15, stock: st, seed: 60 + i, tear: 0.5, step: 6 }));
      }
      // the camera: stepped like a stop-motion rig, a nudge per pose; close in on the cuts, follow the scissors, push into the clip
      function camAt(t) {
        const k2 = itemAt(2, E.snips[0]), k4 = itemAt(4, E.snips[1]);
        const K = [[0, 1080, 560, 1.16], [E.listIn[1] + 0.3, 960, 560, 1.05], [E.fan[0], 960, 540, 1.0],
          [E.snips[0] - 0.45, 960, 560, 1.0], [E.snips[0] - 0.1, k2.x + 60, k2.y - 40, 1.24], [E.snips[0] + 0.4, k2.x + 60, k2.y - 40, 1.24],
          [E.snips[1] - 0.1, k4.x - 60, k4.y - 40, 1.24], [E.snips[1] + 0.4, k4.x - 60, k4.y - 40, 1.22], [E.align[0], 960, 540, 1.0],
          [E.cuts[0][0] - 0.1, rowAt(0).x + 160, 500, 1.16], [E.cuts[3][1], rowAt(3).x - 100, 500, 1.16], [E.tags[3] + 0.5, 960, 560, 1.04],
          [E.hover[1], 960, 520, 1.0], [E.open[1], 960, 600, 1.08], [E.pinOn[3] + 0.4, 960, 620, 1.1], [E.bookOut[0], 960, 560, 1.0],
          [E.drops[0], 900, 560, 1.02], [E.schedOut[0], 1040, 540, 1.06], [E.filmIn[1], 800, 560, 1.06], [E.grow[1] + 0.3, 780, 560, 1.22],
          [E.file[0], 900, 560, 1.12], [E.file[1] + 0.3, 1200, 580, 1.08], [T.title + 0.8, 960, 540, 1.0], [DUR, 960, 540, 1.0]];
        let i = 0; while (i < K.length - 2 && t > K[i + 1][0]) i++;
        const A = K[i], B = K[i + 1], u = eIO(r(t, A[0], B[0]));
        return { x: lerp(A[1], B[1], u), y: lerp(A[2], B[2], u), z: lerp(A[3], B[3], u) };
      }
      function post(t) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        // the table light; once the black sheet has covered the set it only grazes it
        ctx.globalAlpha = 1 - 0.7 * r(t, E.sweep[0], E.sweep[1]); ctx.drawImage(LIGHT, 0, 0); ctx.globalAlpha = 1;
        // stop-motion exposure flicker, a touch per pose
        const f = (hash(POSE * 1.713) - 0.5) * 0.05;
        ctx.fillStyle = f > 0 ? `rgba(255, 244, 228, ${f.toFixed(3)})` : `rgba(20, 10, 4, ${(-f).toFixed(3)})`; ctx.fillRect(0, 0, W, H);
        ctx.save(); ctx.globalCompositeOperation = "overlay"; ctx.globalAlpha = 0.16;
        const ox = Math.floor(hash(POSE * 3.1) * 256), oy = Math.floor(hash(POSE * 5.3) * 256);
        for (let x = -ox; x < W; x += 512) for (let y = -oy; y < H; y += 512) ctx.drawImage(GRAIN, x, y, 512, 512);
        ctx.restore();
      }
      function sweep(t) {
        const u = r(t, E.sweep[0], E.sweep[1]);
        if (u <= 0) return false;
        const x = lerp(-1300, 960, eOut(u));
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        piece({ key: "sheet", make: RECT(2500, 1500), x, y: 540, rot: lerp(0.06, 0, eOut(u)), h: 2 * (1 - u) + 0.6, stock: "ink", seed: 900, tear: 7, step: 26, edge: "rgba(255,248,236,0.12)" });
        return u >= 1;
      }

      function paint(t) {
        const ts = Math.floor(t * PZ + 1e-4) / PZ;   // shot on twos: every frame shows the pose of its twelfth of a second
        POSE = Math.round(ts * PZ);
        const covered = ts >= E.sweep[1];
        Object.assign(CAM, camAt(ts));
        if (!covered) {
          PARA = true;
          drawTable();
          drawBook(ts); drawSchedule(ts); drawGallery(ts); drawListing(ts); drawPins(ts); drawVideo(ts);
          const sc = scissorsAt(ts); if (sc) scissors(sc.x, sc.y, sc.rot, sc.open, 1);
          // the type sits on a sheet of glass over the set, so the camera does not move it
          ctx.setTransform(1, 0, 0, 1, 0, 0); PARA = false;
          TB.lines.forEach((L) => drawLine(L, ts));
        }
        PARA = false;
        sweep(ts);
        post(ts);
        // the end card: the logo, flat, lands on the black sheet
        const lo = r(ts, E.logo, E.logo + 0.25);
        $("#title").style.opacity = lo > 0 ? 1 : 0;
        $("#t-logo").style.opacity = lo.toFixed(3); $("#t-logo").style.transform = `scale(${lerp(1.06, 1, eOut(lo)).toFixed(4)})`;
        $("#t-name").style.opacity = r(ts, E.name, E.name + 0.25).toFixed(3);
        $("#t-line").style.opacity = r(ts, E.name + 0.4, E.name + 0.7).toFixed(3);
        $("#t-url").textContent = URL_TEXT.slice(0, Math.round(URL_TEXT.length * r(t, E.url, E.url + 1.1)));
        let st = TB.hud[0][1]; for (const [a, s] of TB.hud) if (ts >= a) st = s;
        $("#hud-st").textContent = st;
        const ho = (1 - r(ts, E.sweep[0], E.sweep[0] + 0.4)).toFixed(3);
        $("#hud-l").style.opacity = ho; $("#hud-r").style.opacity = ho;
      }

      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => paint(clock.t) }, 0);

      async function build() {
        await Promise.all([document.fonts.load('800 40px "Archivo"'), document.fonts.load('700 40px "Archivo"'), document.fonts.load('italic 400 40px "Instrument Serif"'),
          document.fonts.load('500 20px "JBM"'), document.fonts.load('700 20px "JBM"'), $("#t-logo").decode()]);
        const load = (src) => new Promise((res) => { const im = new Image(); im.onload = () => im.decode().then(() => res(im), () => res(im)); im.onerror = () => res(null); im.src = src; });
        const M = TB.media, names = [...M.photos, ...M.charts, M.cover];
        (await Promise.all(names.map((n) => load(`assets/img/${n}.jpg`)))).forEach((im, i) => (IMG[names[i]] = im));
        FRAMES.push(...(await Promise.all(Array.from({ length: M.frames }, (_, i) => load(`assets/img/frames/f${String(i).padStart(3, "0")}.jpg`)))));
        ctx = $("#cv").getContext("2d");
        makeStocks(); makePost(); layLines();
        TITLE_LINES = wrapText(TB.listing.title, 'italic 400 46px "Instrument Serif"', 450);
        PIN_TXT = TB.pins.map((p) => wrapText(p.title, '700 16px "Archivo"', 214).slice(0, 3));
        ALT_TXT = TB.pins.map((p) => { const L = wrapText("alt: " + p.alt, '500 12px "JBM"', 214); return L.length > 2 ? [L[0], L[1].replace(/\s*\S*$/, "") + "…"] : L; });
        window.addEventListener("hf-seek", (ev) => paint(ev.detail.time));
        paint(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
      }
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["pinned"] = build();
    </script>
  </body>
