      and bursts into nine; the camera pulls back over an endless field of glass tiles with a wave on every beat; a dolly
      zoom down a profile column, and nine tiles drop in posting order into one seamless picture; ten tools in ten hard
      cuts, each a new shape of the same field; a kaleidoscope folds the field into one tile in a browser, and three
      words shatter on it; the nine tiles lock into the mark.
      Technique: one WebGL2 fragment shader on a full-screen triangle. An infinite field from one cell (domain
      repetition, the nearest four cells evaluated per step), heights from a travelling wave and beat pulses, a polar
      fold for the kaleidoscope, per-cell shape blends for the tools (box, sphere, bars, lines, squircle, QR bits). Glass
      shading: three rays refracted per pixel, one per colour, read the photo at the tile's base, so the picture splits

    vec2 l = ij - o;

  c += vec3(0.9, 0.88, 0.84) * 1.0 * smoothstep(0.2, 0.3, r.y) * smoothstep(0.47, 0.37, r.y) * smoothstep(0.1, -0.3, r.z) * smoothstep(1.0, 0.5, abs(r.x));
  c += vec3(0.62, 0.11, 0.035) * 3.0 * smoothstep(0.72, 0.84, r.x) * smoothstep(0.32, 0.12, abs(r.y - 0.12));

}
vec3 photo(vec2 xz, vec2 id, float lod) {
  vec2 uv;
  bool win = abs(id.x) < uWin.x && abs(id.y) < uWin.y;
  if (win) uv = vec2(xz.x / (2.0 * uImgH.x) + 0.5, xz.y / (2.0 * uImgH.y) + 0.5);
  else { vec2 hh = vec2(hash(id + 1.3), hash(id + 5.7)), l = (xz - id * uPitch) / uPitch + 0.5; uv = 0.12 + hh * 0.5 + l * 0.36; }

}
const vec3 L = normalize(vec3(-0.35, 1.0, 0.45));
const vec3 BG = vec3(0.0042, 0.0035, 0.003);
const vec3 TERRA = vec3(0.539, 0.073, 0.016), INK = vec3(0.0091, 0.0079, 0.0063), PAPER = vec3(0.955, 0.94, 0.905);

  float t = rd.y < 0.0 ? max(0.0, (ro.y - 3.4) / -rd.y) : 0.0, d = 1.0; bool hit = false;

      vec3 base;
      for (int c = 0; c < 3; c++) {

  col = aces(col * 1.12);
  col = pow(col, vec3(1.0 / 2.2));
  col += (hash(gl_FragCoord.xy) - 0.5) / 255.0;
  fragColor = vec4(col, 1.0);
}
`;

    <script>
      const TB = window.TABLE, T = TB.T, DUR = TB.dur, BEAT = TB.beat;
      const W = 1920, H = 1080;

      const lv = (A, B, u) => A.map((v, i) => lerp(v, B[i], u));

        eExpoIO = E("expo.inOut"), eQuadIn = E("power2.in"), eBack = E("back.out(2.2)");
      const lin = (h) => [16, 8, 0].map((s) => Math.pow(((parseInt(h.slice(1), 16) >> s) & 255) / 255, 2.2));
      const typed = (s, u) => s.slice(0, Math.round(s.length * cl(u)));
      const at = (x) => x;   // a time from the table

      // ---------------- the camera, matching the shader's lookAt and focal length
      const sub = (a, b) => a.map((v, i) => v - b[i]), dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
      const norm = (a) => { const l = Math.hypot(...a); return a.map((v) => v / l); };

        $("#veil").style.opacity = (1 - eOut(r(t, 0.0, 0.5))).toFixed(3);
        // HUD
        let st = HUD[0][1]; for (const [a, s] of HUD) if (t >= a) st = s;
        $("#hud-st").textContent = st;
        const hudO = r(t, 0.4, 0.8) * (1 - r(t, T.title, T.title + 0.3));
        $("#hud-l").style.opacity = hudO; $("#hud-r").style.opacity = hudO;
        // title: the flat mark resolves over the liquid's own, then the name, the line, the URL
        $("#title").style.opacity = t >= T.title ? 1 : 0;
        $("#t-mark").style.opacity = r(t, TB.mark, TB.mark + 0.5);
        const nu = r(t, TB.line, TB.line + 0.5); $("#t-name").style.opacity = nu; $("#t-name").style.transform = `translateY(${(20 * (1 - eOut(nu))).toFixed(1)}px)`;
        $("#t-line").style.opacity = r(t, TB.line + 0.5, TB.line + 1.0);
        $("#t-url").textContent = typed(URL_TEXT, r(t, TB.line + 1.0, TB.line + 1.8));
      }

      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => paint(clock.t) }, 0);

      async function build() {
        img = new Image(); img.src = "assets/img/demo-banner.jpg";
        await Promise.all([img.decode(), document.fonts.load('850 40px "Archivo"'), document.fonts.load('400 40px "Instrument Serif"'),
          document.fonts.load('italic 400 40px "Instrument Serif"'), document.fonts.load('500 20px "JBM"')]);
        FLIES.forEach((F) => { F.w = F.el.offsetWidth; });   // measured once, with the fonts loaded
        initGL();
        window.addEventListener("hf-seek", (ev) => paint(ev.detail.time));
        paint(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
      }
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["ninefold"] = build();
    </script>
  </body>
</html>
