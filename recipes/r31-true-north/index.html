    <!--
      R31 · True North. 33 s at 116 bpm, raymarched shader (season 3, film 3). For Atlas Studio, João's visual prompt
      studio. Every image starts as a prompt: a compass needle spins up in its ring while a real Atlas prompt types out,
      the camera pulls back to a glass globe tiled with João's own --stills, the globe whips round and brakes and the
      needle points, the camera dives into one still, an endless zoom carries each still inside the compass ring of the
      last, the zoom breaks into a tunnel of stills, three rings come alive as --motion clips, and every image collapses
      into the official Atlas Studio lockup.
      Technique: two WebGL2 passes on one canvas. Pass 1 draws, by section: the needle and ring as raymarched SDFs inside
      an analytic glass sphere whose surface carries the stills by latitude and longitude (front tiles over the needle
      over the back tiles); a Droste zoom in log scale, each level rotated and nested in the last one's ring, its next
      still revealed by the needle's sweep; and a cylinder of stills flown through, time-smeared for motion blur. The
      stills sit in one texture array. Pass 2 adds bloom from the mip chain, a chromatic kick on the beats, the motion
      rings and the mark's light. paint(t) sets every uniform from one baked table (assets/table.js, from bake/table.py);
      score/compose.py reads it too.
    -->

    <script>
      // pass 1: the scene, linear HDR
      const FS1 = `#version 300 es
precision highp float;
precision highp sampler2DArray;
uniform sampler2DArray uImg;
uniform vec2 uRes;
uniform float uTime, uMode, uMix;
// globe and needle
uniform vec3 uCamP, uCamT;
uniform float uFocal, uRot, uGlobe, uGlass, uNeedle, uBlade, uRingA, uCoral, uHi, uHiAmt;
uniform int uMap[128];
// droste
uniform float uS, uWipe;
uniform int uDro[8];
// tunnel
uniform float uTz, uTv, uRoll, uTwist, uTdim;
out vec4 fragColor;

const float PI = 3.14159265, TAU = 6.2831853;
const float RR = 0.62;           // the compass ring's radius inside the unit globe
int gMat;

float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
mat2 rot2(float a) { float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }
vec3 still(int l, vec2 uv) { vec3 c = texture(uImg, vec3(clamp(uv, 0.0, 1.0), float(l))).rgb; return c * c * (0.3 + 0.7 * c); }

float sdTri(vec2 p, vec2 p0, vec2 p1, vec2 p2) {
  vec2 e0 = p1 - p0, e1 = p2 - p1, e2 = p0 - p2, v0 = p - p0, v1 = p - p1, v2 = p - p2;
  vec2 q0 = v0 - e0 * clamp(dot(v0, e0) / dot(e0, e0), 0.0, 1.0);
  vec2 q1 = v1 - e1 * clamp(dot(v1, e1) / dot(e1, e1), 0.0, 1.0);
  vec2 q2 = v2 - e2 * clamp(dot(v2, e2) / dot(e2, e2), 0.0, 1.0);
  float s = sign(e0.x * e2.y - e0.y * e2.x);
  vec2 d = min(min(vec2(dot(q0, q0), s * (v0.x * e0.y - v0.y * e0.x)), vec2(dot(q1, q1), s * (v1.x * e1.y - v1.y * e1.x))), vec2(dot(q2, q2), s * (v2.x * e2.y - v2.y * e2.x)));
  return -sqrt(d.x) * sign(d.y);
}
float ex(float d, float z, float h) { vec2 w = vec2(d, abs(z) - h); return min(max(w.x, w.y), 0.0) + length(max(w, 0.0)); }

// ---------------- the needle, its hub and its ring, standing in the globe's middle
float map(vec3 p) {
  float d = 1e5; gMat = 0;
  // the ring, drawn on from north, clockwise
  float ang = fract(atan(p.x, p.y) / TAU + 1.0);
  float ring = length(vec2(length(p.xy) - RR, p.z)) - 0.011;
  ring = max(ring, (ang - uRingA) * RR * TAU);
  if (ring < d) { d = ring; gMat = 5; }
  for (int k = 0; k < 3; k++) {
    vec2 c = k == 0 ? vec2(RR, 0.0) : (k == 1 ? vec2(-RR, 0.0) : vec2(0.0, -RR));
    float s = length(p - vec3(c, 0.0)) - 0.03 * step(0.0, uRingA - (k == 0 ? 0.25 : (k == 1 ? 0.75 : 0.5)));
    if (s < d) { d = s; gMat = 6; }
  }
  float co = length(p - vec3(0.0, RR, 0.0)) - 0.036 * smoothstep(0.0, 0.3, uCoral + uRingA * 0.0);
  if (co < d) { d = co; gMat = 7; }
  if (uBlade > 0.001) {
    vec3 q = vec3(rot2(-uNeedle) * p.xy / uBlade, p.z / uBlade);
    vec2 a = vec2(0.70710678), n = vec2(-a.y, a.x);
    float bl = ex(sdTri(q.xy, -a * 0.06 + n * 0.115, -a * 0.06 - n * 0.115, a * 0.86), q.z - 0.004, 0.012) * uBlade;
    if (bl < d) { d = bl; gMat = 1; }
    float nv = ex(sdTri(q.xy, a * 0.06 + n * 0.125, a * 0.06 - n * 0.125, -a * 0.79), q.z + 0.004, 0.012) * uBlade;
    if (nv < d) { d = nv; gMat = 2; }
    float hub = ex(length(q.xy) - 0.115, q.z, 0.026) * uBlade;
    if (hub < d) { d = hub; gMat = 3; }
    float dot_ = ex(length(q.xy) - 0.066, q.z, 0.031) * uBlade;
    if (dot_ < d) { d = dot_; gMat = 4; }
  }
  return d;
}
vec3 nrm(vec3 p) { vec2 e = vec2(0.0007, -0.0007); int m = gMat;
  vec3 n = normalize(e.xyy * map(p + e.xyy) + e.yyx * map(p + e.yyx) + e.yxy * map(p + e.yxy) + e.xxx * map(p + e.xxx)); gMat = m; return n; }

vec3 env(vec3 r) {
  vec3 c = mix(vec3(0.003, 0.005, 0.012), vec3(0.02, 0.03, 0.065), clamp(r.y * 0.5 + 0.5, 0.0, 1.0));
  c += vec3(1.0, 0.98, 0.95) * 3.2 * smoothstep(0.86, 0.95, dot(r, normalize(vec3(-0.55, 0.65, 0.55))));
  c += vec3(0.17, 0.43, 1.0) * 2.6 * smoothstep(0.8, 0.93, dot(r, normalize(vec3(0.9, 0.1, 0.4))));
  c += vec3(1.0, 0.41, 0.28) * 1.4 * smoothstep(0.9, 0.97, dot(r, normalize(vec3(-0.3, -0.5, 0.8))));
  c += vec3(0.16, 0.2, 0.34) * smoothstep(0.6, 1.0, r.z) * (0.6 + 0.4 * r.y);   // a broad soft light behind the camera
  return c;
}
vec3 shadeNeedle(vec3 p, vec3 rd, int m) {
  vec3 n = nrm(p), r = reflect(rd, n), L = normalize(vec3(-0.4, 0.6, 0.7));
  float df = max(dot(n, L), 0.0), sp = pow(max(dot(r, L), 0.0), 60.0);
  float fr = 0.04 + 0.96 * pow(1.0 - clamp(dot(n, -rd), 0.0, 1.0), 5.0);
  if (m == 1) return vec3(0.025, 0.16, 1.0) * (0.3 + 1.1 * df) + env(r) * (0.08 + fr) + sp * 2.0 + vec3(0.02, 0.1, 0.6) * 0.5;
  if (m == 2) return vec3(0.02, 0.03, 0.07) * (0.4 + df) + env(r) * (0.3 + fr) + sp * 2.0;
  if (m == 3) return vec3(0.92, 0.94, 1.0) * (0.25 + 0.9 * df) + env(r) * fr * 0.5 + sp;
  if (m == 4) return vec3(0.006, 0.01, 0.03) + env(r) * (0.1 + fr) + sp * 1.5;
  if (m == 5) return env(r) * vec3(0.75, 0.82, 1.0) * 0.9 + vec3(0.1, 0.14, 0.25) * df;
  if (m == 6) return vec3(0.01, 0.015, 0.04) + env(r) * (0.15 + fr) + sp;
  return vec3(1.0, 0.41, 0.28) * (0.3 + 7.0 * uCoral) + sp;
}
vec3 bgGlobe(vec2 uv) {
  float g = exp(-dot(uv, uv) * 1.6);
  return vec3(0.0015, 0.0025, 0.0065) + vec3(0.004, 0.011, 0.034) * g * (0.5 + 0.5 * uGlass);
}

// a tile of the globe, by the local direction n: rgb, coverage
vec4 tile(vec3 n, float fw, out float lines, out float hi) {
  float lon = atan(n.x, n.z), lat = asin(clamp(n.y, -1.0, 1.0));
  float u = (lon + PI) / TAU * 16.0, v = (lat + PI / 3.0) / (PI / 12.0);
  float i = floor(u), j = floor(v), fu = fract(u), fv = fract(v);
  float cw = TAU / 16.0 * cos(lat), chh = PI / 12.0;
  // the atlas lines: every meridian, every parallel, dashed like the mark's
  float dm = min(fu, 1.0 - fu) * cw, dp = min(fract((lat) / (PI / 12.0)), 1.0 - fract((lat) / (PI / 12.0))) * chh;
  lines = smoothstep(fw * 1.5, 0.0, dm) + smoothstep(fw * 1.5, 0.0, dp) * step(0.5, fract(lon * 18.0));
  hi = 0.0;
  if (j < 0.0 || j > 7.0) return vec4(0.0);
  int id = int(j) * 16 + int(mod(i, 16.0));
  int l = uMap[id];
  if (l < 0) return vec4(0.0);
  float isHi = float(id) == uHi ? uHiAmt : 0.0;
  float a = clamp(uGlobe * 1.8 - hash(vec2(i, j)) * 0.8, 0.0, 1.0);
  a = a * a * (3.0 - 2.0 * a);
  vec2 lc = vec2((fu - 0.5) * cw, (fv - 0.5) * chh), hs = vec2(0.5 * cw - 0.012, 0.5 * chh - 0.012) * a;
  vec2 dd = abs(lc) - hs;
  float inside = smoothstep(fw, -fw, max(dd.x, dd.y));
  vec2 uv = lc / max(hs * 2.0, 1e-4) + 0.5;
  vec3 c = still(l, vec2(uv.x, 1.0 - uv.y));
  hi = isHi * smoothstep(fw * 2.0, 0.0, abs(max(dd.x, dd.y))) ;
  return vec4(c * (1.0 + 0.35 * isHi), inside);
}

vec3 globe(vec2 uv) {
  vec3 fwd = normalize(uCamT - uCamP), rt = normalize(cross(fwd, vec3(0.0, 1.0, 0.0))), up = cross(rt, fwd);
  vec3 rd = normalize(uv.x * rt + uv.y * up + uFocal * fwd), ro = uCamP;
  vec3 col = bgGlobe(uv);
  float b = dot(ro, rd), c = dot(ro, ro) - 1.0, h = b * b - c;
  float fw = length(ro) / uRes.y / uFocal * 1.2;
  if (h > 0.0) {
    float sh = sqrt(h), t0 = -b - sh, t1 = -b + sh;
    float ca = cos(uRot), sa = sin(uRot);
    // behind: the back of the globe, seen from inside, dim
    vec3 pb = ro + rd * t1, lb = vec3(pb.x * ca + pb.z * sa, pb.y, -pb.x * sa + pb.z * ca);
    float lnb, hib; vec4 tb = tile(lb, fw, lnb, hib);
    vec3 behind = mix(col, tb.rgb * 0.22, tb.a * 0.9) + vec3(0.2, 0.3, 0.6) * 0.12 * lnb * uGlass;
    // the needle, inside
    float t = max(t0, 0.0);
    for (int i = 0; i < 90; i++) {
      float d = map(ro + rd * t);
      if (d < 0.0004 * t) { behind = shadeNeedle(ro + rd * t, rd, gMat); break; }
      t += d;
      if (t > t1) break;
    }
    // the front: a still on glass, or the glass alone
    vec3 pf = ro + rd * t0, lf = vec3(pf.x * ca + pf.z * sa, pf.y, -pf.x * sa + pf.z * ca);
    float lnf, hif; vec4 tf = tile(lf, fw, lnf, hif);
    float fr = 0.04 + 0.96 * pow(1.0 - clamp(dot(pf, -rd), 0.0, 1.0), 5.0);
    float limb = 0.6 + 0.4 * clamp(dot(pf, -rd), 0.0, 1.0);
    float op = 0.86 + 0.14 * step(0.5, hif + uHiAmt * 0.0);
    col = mix(behind, tf.rgb * limb, tf.a * op);
    col += env(reflect(rd, pf)) * fr * 0.55 * uGlass + vec3(0.45, 0.6, 1.0) * 0.5 * lnf * uGlass * (1.0 - tf.a * 0.7);
    col += vec3(1.0, 0.55, 0.35) * 2.5 * hif;
  }
  return col;
}

// ---------------- the tunnel: a cylinder of stills, flown through, time-smeared
vec3 tunnel(vec2 p) {
  vec3 rd = normalize(vec3(rot2(uRoll) * p, -1.05));
  float rxy = length(rd.xy), t = 1.0 / max(rxy, 1e-4), depth = -rd.z * t;
  float a = atan(rd.y, rd.x) + uTwist * depth;
  float fw = depth / uRes.y * 2.2;
  vec3 acc = vec3(0.0);
  for (int k = 0; k < 8; k++) {
    float z = uTz - depth + uTv * (float(k) / 7.0 - 0.5) / 150.0;
    float u = a / TAU * 8.0, v = z / 1.18;
    float i = floor(u), j = floor(v), fu = fract(u), fv = fract(v);

        gl.uniform3fv(U1.uCamP, C.p); gl.uniform3fv(U1.uCamT, C.t); f1("uFocal", C.f);
        f1("uRot", S.rot); f1("uGlobe", S.globe); f1("uGlass", S.glass); f1("uNeedle", S.needle); f1("uBlade", S.blade); f1("uRingA", S.ringA); f1("uCoral", S.coral);
        f1("uHi", S.hi); f1("uHiAmt", S.hiAmt); f1("uS", S.s); f1("uWipe", S.wipe);
        f1("uTz", S.tz); f1("uTv", S.tv); f1("uRoll", S.roll); f1("uTwist", S.twist); f1("uTdim", S.tdim);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.bindTexture(gl.TEXTURE_2D, tex); gl.generateMipmap(gl.TEXTURE_2D);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.useProgram(P2);
        const f2 = (n, v) => gl.uniform1f(U2[n], v);
        gl.uniform1i(U2.uTex, 0); gl.uniform2f(U2.uRes, W, H); f2("uCA", S.ca); f2("uTime", t); f2("uGlow", S.glow); f2("uGScale", S.gscale); f2("uGSpin", S.gspin);
        gl.uniform3fv(U2.uRings, S.rings);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      }

      // ---------------- the type
      const URL_TEXT = "ai.joaoqueiros.com/atlastudio", URL_STILLS = "visions.joaoqueiros.com/stills", URL_MOTION = "visions.joaoqueiros.com/motion";
      function typeUrl(el, txt, t, t0, t1) {
        const n = Math.round(txt.length * r(t, t0, t0 + 0.8));
        el.textContent = txt.slice(0, n); el.style.opacity = (r(t, t0 - 0.05, t0) * (1 - r(t, t1 - 0.25, t1))).toFixed(3);
      }
      const HUD = [[0, "prompt"], [TB.pull[0], "--stills"], [T.tunnel[0], "--stills"], [T.motion[0], "--motion"]];
      let lastPrompt = "", lastCap = -1, lastTag = -1;
      function slam(el, t, t0, t1) {
        if (t < t0 || t >= t1) { el.style.opacity = 0; return; }
        const a = r(t, t0, t0 + 0.14), z = r(t, t1 - 0.12, t1);
        el.style.opacity = 1; el.style.transform = `scale(${(1.25 - 0.25 * eBack(a)).toFixed(3)})`;
        el.style.clipPath = `inset(${(100 * z).toFixed(1)}% 0 ${(100 * (1 - eExpo(a))).toFixed(1)}% 0)`;
      }
      function fadeLine(el, t, t0, t1, rise = 18) {
        const o = r(t, t0, t0 + 0.35) * (1 - r(t, t1 - 0.25, t1));
        el.style.opacity = o.toFixed(3); el.style.transform = `translateY(${(rise * (1 - eOut(r(t, t0, t0 + 0.6)))).toFixed(1)}px)`;
      }

      function paint(t) {
        const S = scene(t);
        if (gl) drawGL(S, t);
        // I · the prompt types out
        const po = r(t, TB.typing[0] - 0.3, TB.typing[0]) * (1 - r(t, TB.pull[0] - 0.1, TB.pull[0] + 0.25));
        $("#panel").style.opacity = po.toFixed(3);
        const n = Math.round(TB.prompt.length * r(t, TB.typing[0], TB.typing[1]));
        const html = esc(TB.prompt.slice(0, n)) + (n < TB.prompt.length || Math.floor(t / (BEAT * 0.5)) % 2 === 0 ? "<i></i>" : "");
        if (html !== lastPrompt) { $("#p-text").innerHTML = html; lastPrompt = html; }
        $("#p-meta").textContent = TB.promptMeta;
        fadeLine($("#l-open"), t, TB.openLine, TB.pull[0] + 0.2);
        // II · the tag on each brake's tile
        let tg = -1; BR.forEach((k, j) => { if (t >= k.t && t < (j < 2 ? k.t + BEAT * 2.2 : TB.dive[0] + 0.2)) tg = j; });
        const tagEl = $("#tag");
        if (tg >= 0) {
          const K = BR[tg], s = TB.stills[K.layer];
          if (tg !== lastTag) { tagEl.innerHTML = `<span>--stills ·</span> ${esc(s.title)}`; lastTag = tg; }
          const u = r(t, K.t, K.t + 0.25), x = K.sx + 0, y = K.sy + 150;
          tagEl.style.opacity = (eOut(u) * (1 - r(t, (tg < 2 ? K.t + BEAT * 2.2 : TB.dive[0] + 0.2) - 0.15, tg < 2 ? K.t + BEAT * 2.2 : TB.dive[0] + 0.2))).toFixed(3);
          tagEl.style.transform = `translate(${x.toFixed(1)}px, ${(y + 14 * (1 - eOut(u))).toFixed(1)}px) translateX(-50%)`;
        } else tagEl.style.opacity = 0;
        slam($("#s-stills"), t, TB.dive[0], TB.dive[1]);
        // III · the caption for whichever still fills the frame
        const ci = t >= TB.dive[1] && t < T.tunnel[0] ? Math.min(7, Math.round(S.s)) : -1;
        const cap = $("#cap");
        if (ci >= 0) {
          if (ci !== lastCap) { const s = TB.stills[TB.droste[ci]]; $("#cap-t").textContent = s.title; $("#cap-p").textContent = `"${s.prompt}"`; lastCap = ci; }
          const st = TB.drosteSteps[ci] + (ci ? -BEAT * 0.5 : 0.15), u = r(t, st, st + 0.3);
          cap.style.opacity = (eOut(u) * (1 - r(t, T.tunnel[0] - 0.2, T.tunnel[0]))).toFixed(3);
          cap.style.clipPath = `inset(0 ${(100 * (1 - eExpo(u))).toFixed(1)}% 0 0)`;
        } else cap.style.opacity = 0;
        // IV · tunnel lines
        fadeLine($("#l-t0"), t, TB.tunnelLines[0], TB.tunnelLines[1] - 0.05);
        fadeLine($("#l-t1"), t, TB.tunnelLines[1], T.motion[0] + 0.1);
        typeUrl($("#u-stills"), URL_STILLS, t, TB.tunnelLines[1] + 0.45, T.motion[0] + 0.1);
        // V · --motion: the clips in their rings
        [0, 1, 2].forEach((k) => {
          const o = S.rings[k], w = $("#w" + k), sc = 0.4 + 0.6 * o;
          w.style.opacity = cl(o * 3).toFixed(3); w.style.transform = `scale(${sc.toFixed(3)})`;
          const vt = $("#vt" + k); vt.style.opacity = (r(t, TB.rings[k] + 0.3, TB.rings[k] + 0.6) * (1 - r(t, T.title - 0.2, T.title + 0.1))).toFixed(3);
        });
        fadeLine($("#l-motion"), t, TB.motionLine, T.title);
        typeUrl($("#u-motion"), URL_MOTION, t, TB.motionLine + 0.45, T.title);
        // a flash on every cut, a veil in from black
        let fl = 0; for (const c of TB.cuts) if (t >= c && t < c + 0.1) fl = Math.max(fl, 0.45 * (1 - (t - c) / 0.1));
        $("#flash").style.opacity = fl.toFixed(3);
        $("#veil").style.opacity = (1 - eOut(r(t, 0.0, 0.5))).toFixed(3);
        let st = HUD[0][1]; for (const [a, s] of HUD) if (t >= a) st = s;
        $("#hud-st").textContent = st;
        const hudO = r(t, 0.4, 0.8) * (1 - r(t, T.title, T.title + 0.3));
        $("#hud-l").style.opacity = hudO; $("#hud-r").style.opacity = hudO;
        // VI · title: the paper opens from the needle's hub, carrying the official lockup
        const pr = eIO(r(t, TB.mark - 0.3, TB.mark + 0.45)) * 2300;
        $("#title").style.clipPath = `circle(${pr.toFixed(1)}px at 501px 420px)`;
        $("#t-line").style.opacity = r(t, TB.line, TB.line + 0.5);
        $("#t-line").style.transform = `translateY(${(16 * (1 - eOut(r(t, TB.line, TB.line + 0.6)))).toFixed(1)}px)`;
        $("#t-url").textContent = URL_TEXT.slice(0, Math.round(URL_TEXT.length * r(t, TB.line + 0.6, TB.line + 1.5)));
      }

      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => paint(clock.t) }, 0);

      async function build() {
        const imgs = TB.stills.map((s) => { const im = new Image(); im.src = s.src; return im; });
        await Promise.all([...imgs.map((im) => im.decode()), document.fonts.load('850 40px "Archivo"'), document.fonts.load('400 40px "Instrument Serif"'),
          document.fonts.load('500 20px "JBM"'), $("#t-logo").decode()]);
        initGL(imgs);
        window.addEventListener("hf-seek", (ev) => paint(ev.detail.time));
        paint(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
      }
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["true-north"] = build();
    </script>
  </body>
</html>
