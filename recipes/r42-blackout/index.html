<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <!--
      R42 · Blackout. 33.6 s at 100 bpm, 56 beats (season 6, ink feedback, film 2). For Codex Control Center, which keeps
      the record and not the words. So the film is blackout poetry: a fictional session log fills a page, wet ink floods
      everything private, and only the times and event types survive, as islands of paper. They become the dashboard.
      One WebGL2 feedback buffer holds ink, water, resist and red ink. Ink moves by a reaction-diffusion step over a paper
      fibre texture, so its front stays crisp and feathers instead of blurring. A crisp 2D layer of type is composited in
      the same shader, so a stamp's ripple bends everything. The ink restarts at two anchors, so any frame is rebuilt the
      same way. paint(t) reads one baked table (assets/table.js, from bake/table.py).
    -->
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/table.js"></script>
    <style>

      #stage { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
      #logo { position: absolute; left: -2000px; top: 0; width: 926px; height: 193px; }
    </style>

    <script>
      const VS = "#version 300 es\nin vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }";
      // the paper, baked once: R porosity, G fine tooth, B slow pools, A a noise per column for the run-off
      const FIB_FS = `#version 300 es
precision highp float;
uniform vec2 uRes;
out vec4 o;
float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(h(i), h(i + vec2(1, 0)), f.x), mix(h(i + vec2(0, 1)), h(i + vec2(1, 1)), f.x), f.y); }
float fbm(vec2 p){ float a = 0.5, s = 0.0; for (int i = 0; i < 5; i++) { s += a * n(p); p = mat2(1.6, 1.2, -1.2, 1.6) * p + 3.1; a *= 0.5; } return s; }
void main(){
  vec2 uv = gl_FragCoord.xy / uRes, q = uv * vec2(1.7778, 1.0);
  float fib = 0.0;
  for (int i = 0; i < 4; i++) { float an = float(i) * 0.81 + 0.3; mat2 m = mat2(cos(an), -sin(an), sin(an), cos(an));
    vec2 d = m * q; fib = max(fib, 1.0 - abs(2.0 * n(vec2(d.x * 14.0, d.y * 150.0)) - 1.0)); }
  float por = smoothstep(0.22, 0.78, 0.55 * fbm(q * 16.0) + 0.45 * pow(fib, 3.0));
  float tooth = fbm(q * 240.0);
  float pools = smoothstep(0.26, 0.72, fbm(q * 3.4 + 7.0));
  float streak = smoothstep(0.25, 0.75, 0.6 * n(vec2(uv.x * 70.0, 1.3)) + 0.4 * n(vec2(uv.x * 260.0, 4.7)));
  o = vec4(por, tooth, pools, streak);
}`;
      // the step. State: R ink, G water, B resist, A red ink.
      const SIM_FS = `#version 300 es
precision highp float;
uniform sampler2D uPrev, uFib, uM, uM2;
uniform vec2 uTex, uBC;
uniform float uFirst, uSoak, uFlood, uBR, uResFade, uWash, uRedFade;
out vec4 o;
void main(){
  vec2 uv = gl_FragCoord.xy * uTex;
  vec4 f = texture(uFib, uv);
  float por = f.r, str = f.a;
  // the wash: a front of water running down the page, with fingers ahead of it
  float behind = 0.0;
  if (uWash > -0.5) {
    float fr = uWash + 0.05 * (f.b - 0.5);
    behind = max(smoothstep(0.0, 0.03, fr - uv.y), 0.8 * smoothstep(0.0, 0.02, fr + 0.16 * str * str - uv.y) * step(0.62, str));
  }
  vec2 src = uv;
  src.y -= behind * uTex.y * (1.5 + 5.0 * str);
  src.x += behind * uTex.x * 0.8 * (f.b - 0.5);
  vec4 c = texture(uPrev, src);
  vec4 nb = 0.25 * (texture(uPrev, src + vec2(uTex.x, 0.0)) + texture(uPrev, src - vec2(uTex.x, 0.0)) + texture(uPrev, src + vec2(0.0, uTex.y)) + texture(uPrev, src - vec2(0.0, uTex.y)));
  float wet = c.g;
  float gate = clamp(abs(uSoak) + wet * 1.5, 0.0, 1.0);
  // reaction-diffusion: the front stays crisp and is pushed on by the water, faster along the fibres
  float a = mix(clamp(0.5 - (uSoak + 0.42 * wet) * (0.15 + 0.85 * por), 0.03, 0.97), 0.93, behind);
  float I = c.r + mix(0.05, 0.9, por * por) * gate * (nb.r - c.r);
  I += gate * 0.95 * I * (1.0 - I) * (I - a);
  // the flood rises out of the slow pools, and one drop can bloom to fill the page
  float field = 0.62 * f.b + 0.38 * por;
  if (uFlood > 0.001) I = max(I, smoothstep(field - 0.015, field + 0.015, uFlood));
  if (uBR > 0.0) { float d = length((uv - uBC) * vec2(1.7778, 1.0)) + 0.26 * (f.b - 0.5) + 0.07 * (por - 0.5); I = max(I, smoothstep(0.012, -0.012, d - uBR)); }
  vec4 m = uFirst * texture(uM, uv), m2 = uFirst * texture(uM2, uv);
  I = max(I, m.r);
  float res = texture(uPrev, uv).b;
  res = max(res * (1.0 - uResFade), m.b) * (1.0 - behind);
  I *= 1.0 - smoothstep(0.32, 0.68, res + (por - 0.5) * 0.45 * step(0.01, res));
  I *= mix(1.0, 0.958 + 0.03 * str, behind);
  float w = max(max(nb.g * 0.994, m.g), behind * 0.85);
  float A = c.a + 0.5 * gate * (nb.a - c.a);
  A += 0.5 * gate * A * (1.0 - A) * (A - 0.47);
  A = max(A, m2.r) * (1.0 - uRedFade) * mix(1.0, 0.95, behind);
  o = vec4(clamp(I, 0.0, 1.0), clamp(w, 0.0, 1.0), res, clamp(A, 0.0, 1.0));
}`;
      const DISP_FS = `#version 300 es
precision highp float;
uniform sampler2D uS, uFib, uOv;
uniform vec2 uRes, uPiv, uOff;
uniform float uZoom, uTime;
uniform vec3 uRip[3];
out vec4 o;
const vec3 PAPER = vec3(0.929, 0.910, 0.863), INK = vec3(0.047, 0.047, 0.055), VERM = vec3(0.910, 0.204, 0.110);
float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
void main(){
  vec2 uv = gl_FragCoord.xy / uRes; uv.y = 1.0 - uv.y;
  vec2 px = uv * uRes, disp = vec2(0.0);
  for (int i = 0; i < 3; i++) { float t = uRip[i].z; if (t < 0.0) continue;
    vec2 d = px - uRip[i].xy; float l = length(d) + 0.001, R = t * 1500.0, k = (l - R);
    disp += d / l * 26.0 * exp(-t * 2.4) * exp(-k * k / 12000.0) * cos(k / 24.0); }
  vec2 s = uPiv + (uv - uPiv) / uZoom + uOff + disp / uRes;
  vec4 S = texture(uS, s), F = texture(uFib, s);
  float vis = smoothstep(0.34, 0.62, S.r);
  vec3 paper = PAPER * (0.975 + 0.05 * F.g);
  paper *= 1.0 - 0.26 * smoothstep(0.02, 0.32, S.r) - 0.07 * S.g * (0.6 + 0.4 * F.r);
  vec3 ink = INK + 0.022 * F.g * (0.4 + S.g);
  vec3 col = mix(paper, ink, vis);
  col = mix(col, VERM, smoothstep(0.4, 0.58, S.a));
  vec4 ov = texture(uOv, s);
  col = col * (1.0 - ov.a) + ov.rgb;
  col += (h(gl_FragCoord.xy + fract(uTime * 7.0) * 91.0) - 0.5) / 130.0;
  o = vec4(col, 1.0);
}`;
    </script>

    <script>
      const TB = window.TABLE, DUR = TB.dur, BEAT = TB.beat;
      const W = 1920, H = 1080, SW = 1280, SH = 720, DT = 1 / 30, ITER = 4, SUB = 8, SHUT = 1 / 60;
      const $ = (s) => document.querySelector(s);
      const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), r = (t, a, b) => cl((t - a) / (b - a)), lerp = (a, b, u) => a + (b - a) * u;
      const E = (n) => gsap.parseEase(n), eO = E("power3.out"), eIO = E("power3.inOut"), eX = E("expo.out"), eXIO = E("expo.inOut"), eB = E("back.out(1.9)"), eI = E("power3.in"), eS = E("sine.inOut");
      const BONE = "#EDE8DC", INK = "#0C0C0E", VERM = "#E8341C", GREY = "#5B5850";
      const prng = (s) => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let x = Math.imul(s ^ s >>> 15, 1 | s); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; };
      const HEAVY = (s) => `900 condensed ${s}px "Archivo"`, MONO = (s, w = 500) => `${w} ${s}px "JBM"`;
      const anchorOf = (t) => (t >= 21.5 * BEAT - 1e-6 ? 21.5 * BEAT : 0);

      // ---------------- the log
      const N = TB.lines.length, ROWS = TB.rows, RH = 46, Y0 = 72, XT = 72, XE = 262, XP = 560, LOCK = 9.8;
      const VIS = TB.lines.slice(-ROWS);
      const head = (B) => 1 + (N - 1) * Math.pow(r(B, 0, LOCK), 2.0);
      const rowY = (i, S) => Y0 + (i - S) * RH;
      function drawLog(g, B) {
        const hd = head(B), S = Math.max(0, hd - ROWS), n = Math.floor(hd);
        g.save(); g.beginPath(); g.rect(0, 52, W, H); g.clip();
        g.font = MONO(27); g.textBaseline = "middle"; g.textAlign = "left"; g.fillStyle = INK;
        for (let i = Math.max(0, Math.floor(S) - 1); i < Math.min(N, n + 1); i++) {
          const L = TB.lines[i], y = rowY(i, S); if (y < -40 || y > H + 40) continue;
          const lift = B >= 20 && i >= N - ROWS ? chipL(i - (N - ROWS)) : 1e9;
          if (i === n && B < LOCK) { const ch = Math.floor((hd - n) * 62), full = L[0] + "  " + L[1].padEnd(14) + "  " + L[2]; g.fillText(full.slice(0, ch), XT, y); continue; }
          if (B < lift) g.fillText(L[0], XT, y);
          if (B < lift + 0.3) g.fillText(L[1], XE, y);
          if (B < 16) g.fillText(L[2].slice(0, 76), XP, y);
        }
        g.restore();
      }
      // ---------------- the islands: what survives
      let CH = [];
      const chipL = (j) => 20 + (j % 7) * 0.05 + Math.floor(j / 7) * 0.12;
      function buildChips(g) {
        g.font = MONO(27); CH = [];
        const counts = {}; const cw = 1040 / TB.types.length;
        VIS.forEach((L, j) => {
          const y = rowY(j + N - ROWS, N - ROWS), tw = g.measureText(L[0]).width, ew = g.measureText(L[1]).width;
          const c = TB.types.indexOf(L[1]); counts[c] = (counts[c] || 0) + 1;
          CH.push({ j, txt: L[0], kind: "t", x: XT - 10, y: y - 21, w: tw + 20, h: 42, tx: 80 + j * (1040 / ROWS), ty: 756, tw: 1040 / ROWS - 8, th: 34, L: chipL(j) });
          CH.push({ j, txt: L[1], kind: "e", x: XE - 10, y: y - 21, w: ew + 20, h: 42, tx: 80 + c * cw, ty: 628 - (counts[c] - 1) * 62, tw: cw - 12, th: 54, L: chipL(j) + 0.08 });
        });
      }
      function drawChips(g, B) {
        const out = eI(r(B, 28, 28.8));
        CH.forEach((c) => {
          if (B < c.L) return;
          const u = eXIO(r(B, c.L, c.L + 1)), pop = 1 + 0.1 * Math.sin(Math.PI * r(B, c.L, c.L + 0.25));
          const x = lerp(c.x, c.tx, u), y = lerp(c.y, c.ty, u) + 1400 * out, w = lerp(c.w, c.tw, u) * pop, h = lerp(c.h, c.th, u) * pop;
          g.fillStyle = BONE; g.fillRect(x, y, w, h);
          if (u < 0.5) { g.globalAlpha = 1 - r(u, 0.25, 0.5); g.font = MONO(27); g.fillStyle = INK; g.textAlign = "left"; g.textBaseline = "middle"; g.fillText(c.txt, x + 10, y + h / 2); g.globalAlpha = 1; }
        });
      }

      // ---------------- type
      function fit(g, s, x, y, w, col, a = "left", max = 900) {
        g.font = HEAVY(200); const size = Math.min(max, 200 * w / g.measureText(s).width);
        g.font = HEAVY(size); g.fillStyle = col; g.textAlign = a; g.textBaseline = "alphabetic"; g.fillText(s, x, y); return size;
      }
      function pop(g, s, x, y, w, col, B, at, a = "left") {   // letters up from a mask line
        const u = eX(r(B, at, at + 0.5)); if (u <= 0) return;
        g.save(); g.font = HEAVY(200); const size = 200 * w / g.measureText(s).width;
        g.beginPath(); g.rect(-100, y - size * 0.82, W + 200, size * 0.86); g.clip();
        fit(g, s, x, y + size * 0.9 * (1 - u), w, col, a); g.restore();
      }
      function lab(g, s, x, y, col, size = 18, a = "left") { g.font = MONO(size, 600); g.fillStyle = col; g.textAlign = a; g.textBaseline = "middle"; g.letterSpacing = "2px"; g.fillText(s, x, y); g.letterSpacing = "0px"; }
      function hud(g, B) {
        if (B >= 50.4) return;
        if (B >= 10.4 && B < 20.6) { g.font = MONO(17, 600); g.letterSpacing = "2px"; const tw = g.measureText("DEMO DATA").width; g.letterSpacing = "0px"; g.fillStyle = BONE; g.fillRect(1848 - tw - 14, 18, tw + 28, 32); lab(g, "DEMO DATA", 1848, 34, INK, 17, "right"); return; }
        const onInk = B >= 15 && B < 46;
        lab(g, TB.name.toUpperCase() + " · DEMO DATA", 72, 34, onInk ? BONE : INK, 17);
        const mode = B < 10 ? "A SESSION" : B < 20 ? "METADATA ONLY" : B < 28 ? "OBSERVE MODE" : B < 40 ? "CONTROL MODE" : "PUBLISH CHECK";
        lab(g, mode, 1848, 34, onInk ? BONE : INK, 17, "right");
      }
      function tile(g, x, y, w, h, B, at) {   // a tile of paper thrown onto the page
        const u = eB(r(B, at, at + 0.6)), out = eI(r(B, 28 + (x % 3) * 0.1, 28.8));
        g.translate(0, (1 - u) * 900 + out * 1400);
        g.fillStyle = BONE; g.fillRect(x, y, w, h);
      }

      // ---------------- the sections
      function sObserve(g, B) {
        if (B < 20 || B >= 29.2) return;
        const out = eI(r(B, 28, 28.8));
        g.save(); g.translate(0, 1400 * out); g.globalAlpha = r(B, 21, 21.5);
        lab(g, "ACTIVITY · EVENT TYPES", 80, 170, BONE, 20);
        const cw = 1040 / TB.types.length;
        TB.types.forEach((ty, c) => { g.font = MONO(15, 600); g.fillStyle = BONE; g.textAlign = "left"; g.textBaseline = "middle"; g.fillText(ty, 80 + c * cw, 704); });
        lab(g, "SESSIONS · TIMES ONLY", 80, 736, BONE, 16);
        g.restore();
        drawChips(g, B);
        g.save(); tile(g, 1200, 150, 648, 300, B, 21.5);
        lab(g, "READINESS", 1228, 186, INK, 20); fit(g, String(Math.round(86 * eO(r(B, 21.6, 23)))), 1228, 426, 300, INK, "left", 240); g.restore();
        g.save(); tile(g, 1200, 470, 648, 150, B, 22);
        lab(g, "USAGE REMAINING", 1228, 506, INK, 20); g.fillStyle = "#CFC9BA"; g.fillRect(1228, 548, 592, 40); g.fillStyle = INK; g.fillRect(1228, 548, 592 * 0.64 * eXIO(r(B, 22.2, 23.4)), 40); g.restore();
        g.save(); tile(g, 1200, 640, 648, 150, B, 22.5);
        lab(g, "WORKSPACES · LABELS, NOT PATHS", 1228, 672, INK, 18);
        TB.workspaces.forEach((s, i) => { g.globalAlpha = r(B, 23 + i * 0.25, 23.1 + i * 0.25); g.font = MONO(22, 600); g.fillStyle = INK; g.textAlign = "left"; g.fillText(s, 1228 + (i === 1 ? 300 : 0), 716 + (i === 2 ? 40 : 0)); }); g.restore();
        g.save(); g.translate(0, 1400 * out); pop(g, "NO API KEY TO OBSERVE.", 80, 1020, 1768, BONE, B, 24); g.restore();
      }
      let STAMP = {};
      function makeStamp(word, seed) {
        const c = document.createElement("canvas"); c.width = 1400; c.height = 420; const g = c.getContext("2d"), R = prng(seed);
        g.strokeStyle = VERM; g.fillStyle = VERM; g.lineWidth = 22; g.strokeRect(24, 24, 1352, 372);
        g.font = HEAVY(330); g.textAlign = "center"; g.textBaseline = "alphabetic"; const m = g.measureText(word).width; g.font = HEAVY(330 * Math.min(1, 1240 / m)); g.fillText(word, 700, 330);
        g.globalCompositeOperation = "destination-out"; g.fillStyle = "#000";
        for (let i = 0; i < 2600; i++) { g.beginPath(); g.arc(R() * 1400, R() * 420, R() * R() * 4.5, 0, 7); g.fill(); }
        for (let i = 0; i < 26; i++) { g.save(); g.translate(R() * 1400, R() * 420); g.rotate(R() * 3); g.globalAlpha = 0.5; g.fillRect(-90 * R(), -2, 180 * R(), 3 + 6 * R()); g.restore(); }
        return c;
      }
      const LAND = { a: 32, b: 36 };
      function card(g, x, y, w, h, tag, title, status, statusCol, B) {
        g.fillStyle = BONE; g.fillRect(x, y, w, h);
        lab(g, tag, x + 44, y + 56, INK, 22);
        g.font = HEAVY(200); const ts = Math.min(h * 0.25, 200 * (w - 88) / g.measureText(title).width); g.font = HEAVY(ts); g.fillStyle = INK; g.textAlign = "left"; g.textBaseline = "alphabetic"; g.fillText(title, x + 40, y + h * 0.33 + ts * 0.3);
        lab(g, status, x + 44, y + h - 56, statusCol, 22);
      }
      function stampOn(g, cv, cx, cy, land, B, rot) {
        if (B < land - 0.2) return;
        const u = r(B, land - 0.2, land), s = lerp(2.2, 0.62, u * u * u), a = r(B, land - 0.2, land - 0.1);
        g.save(); g.globalAlpha = a; g.translate(cx, cy); g.rotate(rot); g.scale(s, s); g.drawImage(cv, -700, -210); g.restore();
      }
      function sApprove(g, B) {
        if (B < 28.5 || B >= 41) return;
        const X = 240, Yc = 120, CW = 1440, CH2 = 560;
        // the queue
        const leave = eXIO(r(B, 30.8, 31.6));
        TB.tasks.forEach((s, i) => {
          const at = 29 + i * 0.5; if (B < at) return;
          const u = eB(r(B, at, at + 0.5)), x0 = 90 + i * 590, y0 = lerp(-500, 330, u);
          if (i === 0) {
            const x = lerp(x0, X, leave), y = lerp(y0, Yc, leave), w = lerp(560, CW, leave), h = lerp(300, CH2, leave);
            const ex = eXIO(r(B, 35.3, 35.9));
            g.save(); g.translate(0, -1400 * ex);
            card(g, x, y, w, h, "TASK 01 · " + (B < 32 ? "QUEUED" : B < 35 ? "APPROVED" : "DONE"), s, "SANDBOX: READ-ONLY", INK, B);
            if (B >= 32.4) { const p = eS(r(B, 32.4, 34.8)); g.fillStyle = "#CFC9BA"; g.fillRect(x + 44, y + h - 112, w - 88, 16); g.fillStyle = INK; g.fillRect(x + 44, y + h - 112, (w - 88) * p, 16); }
            stampOn(g, STAMP.a, 1180, 535, LAND.a, B, -0.07);
            g.restore();
          } else {
            const o = eI(r(B, 30.8, 31.4));
            g.save(); g.translate(0, 900 * o); card(g, x0, y0, 560, 300, "TASK 0" + (i + 1) + " · QUEUED", s, "SANDBOX: READ-ONLY", INK, B); g.restore();
          }
        });
        if (B < 31) lab(g, "NOTHING STARTS UNTIL IT'S APPROVED", 960, 800, BONE, 26, "center");
        // full access arrives, and is refused
        if (B >= 34.8) {
          const u = eXIO(r(B, 34.8, 35.7)), fall = eI(r(B, 39.7, 40.6));
          g.save(); g.translate(lerp(1700, 0, u), 1300 * fall); g.translate(960, 400); g.rotate(fall * 0.14); g.translate(-960, -400);
          card(g, X, Yc, CW, CH2, "TASK 04 · " + (B < 36 ? "REQUESTED" : "NOT RUN"), "Full access", "SANDBOX: FULL", INK, B);
          stampOn(g, STAMP.b, 1180, 535, LAND.b, B, 0.06);
          g.restore();
        }
        if (B >= 36.4) { const fo = 1 - r(B, 40, 40.6); g.save(); g.globalAlpha = fo; pop(g, "NOTHING RUNS UNTIL YOU SAY SO.", 80, 1010, 1760, BONE, B, 36.4); g.restore(); }
      }
      const PRIV_Y = [210, 345, 480, 615, 750];
      function sWash(g, B) {
        if (B < 41.5 || B >= 51.75) return;
        const K = keepRects();
        K.forEach((k, i) => {
