<!doctype html>
<html>
  <head>

    <meta name="viewport" content="width=1920, height=1080">
    <title>Pinpoint</title>
    <!-- Pinpoint: kinetic motion graphics made entirely in code. One coral dot is carried through every scene: found in a field of
         prospects, the needle of a fit gauge, the top bar of a sorted list, the marker on an enriched record, the cursor of a
         message that writes itself, the nose of a paper plane that freezes short of SEND. The pipeline is a demo, and this film is code. -->
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/table.js"></script>
    <style>
      @font-face { font-family: "Archivo"; src: url("assets/fonts/Archivo.ttf") format("truetype"); font-weight: 100 900; font-stretch: 62% 125%; }
      @font-face { font-family: "JBM"; src: url("assets/fonts/jetbrains-mono.woff2") format("woff2"); font-weight: 100 800; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0D0D11; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0D0D11; }
      #ct-stage { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      #stage { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
      #logo { position: absolute; left: -2000px; top: 0; width: 926px; height: 193px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="38.71" data-width="1920" data-height="1080">
      <div id="ct-stage" class="clip" data-start="0" data-duration="38.71" data-track-index="0">
        <canvas id="stage" width="1920" height="1080" data-layout-allow-overflow></canvas>
        <img id="logo" src="assets/brand/your-mark.svg" alt="Your mark" data-layout-allow-overflow>
      </div>
      <audio id="score" src="assets/bgm/score.wav" data-start="0" data-duration="38.71" data-track-index="7" data-volume="1"></audio>
    </div>

    <script>
      // Every frame is worked out from the beat alone, so any frame renders on its own. Each frame is drawn eight times across a
      // half-frame shutter and averaged, which is real motion blur: fast moves streak the way they do from a camera.
      const TB = window.TABLE, Q = TB.q, W = TB.w, H = TB.h, FPS = 30, BEAT = TB.beat, DUR = TB.dur, NB = TB.beats;
      const $ = (s) => document.querySelector(s);
      const INK = "#0D0D11", BONE = "#F3EAD6", CORAL = "#FF4F36", TEAL = "#2FD6C3", AMBER = "#F2B46A";
      const r = (x, a, b) => Math.min(1, Math.max(0, (x - a) / (b - a))), lerp = (a, b, u) => a + (b - a) * u, PI = Math.PI;

      const fq = (b) => (Math.floor(b * BEAT * FPS + 1e-6) + 0.5) / FPS / BEAT;   // the beat at the middle of b's frame: typed text changes once a frame, so it never ghosts

      // ---------------- the field: 2,304 prospects on a jittered grid, each with a fit score. The hero is the coral one
      const COLS = 64, ROWS = 36, NF = COLS * ROWS, FX = new Float32Array(NF), FY = new Float32Array(NF), FS = new Uint8Array(NF), FH = new Float32Array(NF), FH2 = new Float32Array(NF);

      { let best = 1e9; for (let i = 0; i < NF; i++) { const c = i % COLS, rw = (i / COLS) | 0;
          FX[i] = 15 + c * 30 + (hash(i, 1) - 0.5) * 12; FY[i] = 15 + rw * 30 + (hash(i, 2) - 0.5) * 12; FS[i] = Math.floor(hash(i, 7) * 100);

      const LP = [[300, 300], [760, 720], [1420, 330], [1660, 760], [HX, HY]];
      function lensPos(b) { const u = sm(r(b, Q.lens[0], Q.lens[1])) * (LP.length - 1), k = Math.min(LP.length - 2, Math.floor(u)), t = u - k;
        const p0 = LP[Math.max(0, k - 1)], p1 = LP[k], p2 = LP[k + 1], p3 = LP[Math.min(LP.length - 1, k + 2)];
        const cr = (a, b2, c, d) => 0.5 * (2 * b2 + (-a + c) * t + (2 * a - 5 * b2 + 4 * c - d) * t * t + (-a + 3 * b2 - 3 * c + d) * t * t * t);
        return [cr(p0[0], p1[0], p2[0], p3[0]), cr(p0[1], p1[1], p2[1], p3[1])]; }
      const lensR = (b) => (b < Q.lock ? 170 * back(r(b, Q.lens[0], Q.lens[0] + 0.45), 1.4) : lerp(170, 34, eio3(r(b, Q.lock, Q.lock + 0.3))));
      const LIT = new Float32Array(NF).fill(1e9), LITS = [];
      for (let s = 0; s <= 900; s++) { const b = lerp(Q.lens[0] + 0.2, Q.lens[1], s / 900), p = lensPos(b), R = 150;
        for (let i = 0; i < NF; i++) if (FS[i] >= 85 && LIT[i] > 1e8 && Math.hypot(FX[i] - p[0], FY[i] - p[1]) < R) { LIT[i] = b; LITS.push(b); } }

      function fieldPos(i, b) {
        const d = FH[i], e = eoE(r(b, Q.burst + d * 0.15, Q.burst + 1.3 + d * 0.5)), ang = (1 - e) * (FH2[i] - 0.5) * 1.8;
        const dx = FX[i] - 960, dy = FY[i] - 540, c = Math.cos(ang), s = Math.sin(ang), dr = r(b, 4.4, 5.6) * 1.6;

      }

      // ---------------- the big words. Letters drop in one by one and land on the beat, or type themselves out in the stillness
      function head(hd, b) {
        const [lines, bin, bout, size, cy, col, mode, lands] = hd; if (b < bin || b > bout + 0.05) return;
        g.font = `800 ${size}px Archivo`; g.textBaseline = "alphabetic"; g.textAlign = "left";
        const tr = -0.035 * size, n = lines.length, fill = col === "ink" ? INK : BONE; let k = 0, last = 0;
        const geo = lines.map((ln) => { const ws = [...ln].map((ch) => g.measureText(ch).width + tr); return { ws, tot: ws.reduce((a, c) => a + c, 0) - tr }; });
        for (let li = 0; li < n; li++) { const base = cy + (li - (n - 1) / 2) * size * 1.02 + size * 0.36; let x = 960 - geo[li].tot / 2;
          [...lines[li]].forEach((ch, ci) => { const L = lands[li][ci], adv = geo[li].ws[ci];
            if (L !== null) { last = Math.max(last, L);
              const ex = ei3(r(b, bout - 0.38 + k * 0.022, bout - 0.06 + k * 0.022)); let dy = -size * 1.25 * ex, sy = 1, a = 1 - ex;
              if (mode === "slam") { const u = r(b, L - 0.22, L); dy += -size * 1.15 * (1 - u * u); if (b < L - 0.22) a = 0;
                const t = b - L; if (t > 0) sy = 1 - 0.16 * Math.exp(-t * 14) * Math.cos(t * 40); }

            x += adv; k++; }); }

        const gh = r(b, last, last + 0.6); if (mode === "slam" && gh > 0 && gh < 1) { g.save(); g.globalAlpha = 0.45 * (1 - gh); g.strokeStyle = fill; g.lineWidth = 2;

          for (let li = 0; li < n; li++) { const base = cy + (li - (n - 1) / 2) * size * 1.02 + size * 0.36; let x = 960 - geo[li].tot / 2;

      }
      // the camera shakes a little with every hit
      const IMP = [[Q.bounce, 10], [Q.burst, 24], [Q.lock, 4], [Q.score + 0.05, 10], [Q.stamp, 9], [Q.button + 0.35, 6]];

      TB.rows.forEach((_, i) => IMP.push([Q.rows + i * Q.rowGap, 4]));
      function shake(b) { let x = 0, y = 0; for (const [bi, a] of IMP) { const t = b - bi; if (t < 0 || t > 0.9) continue; const e = a * Math.exp(-t * 7);

      const circle = (x, y, rad, col) => { g.fillStyle = col; g.beginPath(); g.arc(x, y, Math.max(0, rad), 0, 2 * PI); g.fill(); };
      const ring = (x, y, rad, col, w, a = 1) => { g.globalAlpha = a; g.strokeStyle = col; g.lineWidth = w; g.beginPath(); g.arc(x, y, Math.max(0, rad), 0, 2 * PI); g.stroke(); g.globalAlpha = 1; };
      function rrect(x, y, w, h, rad) { rad = Math.min(rad, w / 2, h / 2); g.beginPath(); g.moveTo(x + rad, y); g.arcTo(x + w, y, x + w, y + h, rad); g.arcTo(x + w, y + h, x, y + h, rad);
        g.arcTo(x, y + h, x, y, rad); g.arcTo(x, y, x + w, y, rad); g.closePath(); }
      function mono(s, x, y, size, col, al = "left", wt = 500, sp = 0.12) { g.font = `${wt} ${size}px JBM`; g.letterSpacing = `${sp}em`; g.textAlign = al; g.textBaseline = "alphabetic"; g.fillStyle = col; g.fillText(s, x, y); g.letterSpacing = "0px"; }
      function brackets(x, y, s, col, w, a) { g.globalAlpha = a; g.strokeStyle = col; g.lineWidth = w; g.lineCap = "square"; const l = Math.max(8, s * 0.42);
        for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) { g.beginPath(); g.moveTo(x + sx * s, y + sy * (s - l)); g.lineTo(x + sx * s, y + sy * s); g.lineTo(x + sx * (s - l), y + sy * s); g.stroke(); }

      // ================= the open and 01 FIND
      function sceneFind(b) {
        g.fillStyle = INK; g.fillRect(-60, -60, W + 120, H + 120);
        if (b < Q.burst) {   // a reticle waits, the dot drops into it, bounces, gathers itself and swells
          const ra = r(b, 0.15, 0.9) * (1 - r(b, 1.7, 2.0)); if (ra > 0) { g.globalAlpha = 0.35 * ra; g.strokeStyle = BONE; g.lineWidth = 2; const L = 60 * eo3(r(b, 0.15, 0.9));

            let rad = 18; if (b > 2.5) rad = b < 2.62 ? lerp(18, 12, sm(r(b, 2.5, 2.62))) : lerp(12, 120, ei3(r(b, 2.62, Q.burst)));
            const sq = b < Q.bounce ? 1 + 0.5 * r(b, 1.6, 2.0) : 1 + 0.6 * Math.exp(-t * 8) * Math.cos(t * 28);
            g.save(); g.translate(960, y + (b < Q.bounce ? 0 : rad * (1 - 1 / sq) * 0.5)); g.scale(b < Q.bounce ? 1 / sq : sq, b < Q.bounce ? sq : 1 / sq); circle(0, 0, rad, CORAL); g.restore();
            if (b >= Q.bounce) { const u = r(b, Q.bounce, Q.bounce + 0.8); ring(960, 540, 18 + 320 * eo3(u), BONE, 2, 0.6 * (1 - u)); } }
          return;
        }
        // the burst: a coral flash fills the frame, ink chases it back, and the prospects fly out to their places
        if (b < Q.burst + 0.5) { circle(960, 540, lerp(120, 1250, eo3(r(b, Q.burst, Q.burst + 0.14))), CORAL); circle(960, 540, 1250 * eio3(r(b, Q.burst + 0.1, Q.burst + 0.42)), INK); }
        const sw = r(b, Q.burst, Q.burst + 0.7); if (sw < 1) ring(960, 540, 1500 * eo3(sw), BONE, 3, 0.7 * (1 - sw));

        const dimW = 1 - 0.62 * sm(r(b, 5.0, 5.2)) * (1 - sm(r(b, 8.4, 8.9))), dimL = 1 - 0.7 * sm(r(b, Q.lock + 0.1, Q.lock + 0.5));
        const pn = new Path2D(), pl = new Path2D(), rings = [];
        for (let i = 0; i < NF; i++) { if (i === HERO) continue; let p = fieldPos(i, b), rad = 3.2;
          if (lens && b < Q.lock + 0.3) { const dx = p[0] - lp[0], dy = p[1] - lp[1], d = Math.hypot(dx, dy); if (d < LR) { const f = 1 - d / LR; p = [p[0] + dx * 0.45 * f, p[1] + dy * 0.45 * f]; rad *= 1 + 1.3 * f; } }
          rad *= 1 + 0.22 * Math.sin(FX[i] * 0.012 - b * 2.2) * r(b, 4.6, 5.4);
          const lit = b >= LIT[i]; if (lit) { rad *= 1.35; const lt = b - LIT[i]; if (lt < 0.5) rings.push([p, lt]); }
          const s = X(p); rad *= z; if (s[0] < -rad || s[0] > W + rad || s[1] < -rad || s[1] > H + rad) continue;
          const P = lit ? pl : pn; P.moveTo(s[0] + rad, s[1]); P.arc(s[0], s[1], rad, 0, 2 * PI); }
        g.globalAlpha = 0.5 * dimW * dimL; g.fillStyle = BONE; g.fill(pn); g.globalAlpha = dimW * (1 - 0.35 * r(b, Q.lock + 0.1, Q.lock + 0.5)); g.fillStyle = TEAL; g.fill(pl);
        for (const [p, lt] of rings) { const s = X(p); ring(s[0], s[1], (4 + 22 * eo3(lt / 0.5)) * z, TEAL, 2, 0.8 * (1 - lt / 0.5)); }

        if (lens) { const la = 1 - r(b, Q.zoom, Q.zoom + 0.3), s = X(lp);
          if (b < Q.lock + 0.3) { g.globalAlpha = 0.07 * la; circle(s[0], s[1], LR * z, TEAL); g.globalAlpha = 1; ring(s[0], s[1], LR * z, BONE, 2, 0.85 * la);
            for (let k = 0; k < 4; k++) { const a = k * PI / 2 + b * 0.6; g.globalAlpha = 0.85 * la; g.strokeStyle = BONE; g.lineWidth = 2; g.beginPath();
              g.moveTo(s[0] + Math.cos(a) * (LR + 6), s[1] + Math.sin(a) * (LR + 6)); g.lineTo(s[0] + Math.cos(a) * (LR + 20), s[1] + Math.sin(a) * (LR + 20)); g.stroke(); }
            g.globalAlpha = la; mono("MATCH ≥ 85", s[0], s[1] - LR - 22, 16, BONE, "center", 600); g.globalAlpha = 1; } }

            const ta = a * r(b, Q.lock + 0.3, Q.lock + 0.5); g.globalAlpha = ta; mono("PROSPECT 0412", hs[0] + 48, hs[1] - 6, 18, BONE, "left", 600); mono("FIT 87", hs[0] + 48, hs[1] + 20, 18, TEAL, "left", 700); g.globalAlpha = 1;

        circle(hs[0], hs[1], (b < Q.burst + 0.2 ? lerp(120, 9, eo3(r(b, Q.burst, Q.burst + 0.2))) : 9) * z * (1 + 0.25 * Math.exp(-Math.max(0, b - Q.lock) * 6) * (b >= Q.lock ? 1 : 0)), CORAL);

      }

      // ================= 02 SCORE
      const CX = 960, CY = 600, th = (v) => (210 - 2.4 * v) * PI / 180, gp = (v, R) => [CX + R * Math.cos(th(v)), CY - R * Math.sin(th(v))];
      const needleV = (b) => { const t = b - (Q.needle + 0.4); return t <= 0 ? 0 : Math.min(100, Math.max(0, 87 - 87 * Math.exp(-2.2 * t) * Math.cos(5.5 * t))); };
      const X0 = 560, rowY = (s) => 290 + s * 70, BL = 8;
      const RANK = TB.bars.map((v, i) => [v, i]).sort((a, c) => c[0] - a[0]).reduce((o, [, i], k) => { o[i] = k; return o; }, []);
      function heroBarGeo(b) {   // where the hero's needle, then bar, is: pivot, length, width, angle
        const m = eio3(r(b, Q.morph, Q.morph + 0.8)), v = needleV(b), len0 = 280 * eo3(r(b, Q.needle, Q.needle + 0.4));

      }
      function sceneScore(b) {
        g.fillStyle = BONE; g.fillRect(-60, -60, W + 120, H + 120);
        const m = eio3(r(b, Q.morph, Q.morph + 0.8)), fade = 1 - m;
        if (b >= Q.dial && b < Q.bars + 0.5) {   // the gauge draws itself tick by tick, then drops apart
          TB.dialTicks.forEach((tb, k) => { const u = eo3(r(b, tb, tb + 0.15)); if (u <= 0) return; const v = k * 2.5, major = k % 4 === 0;
            const fall = Math.pow(r(b, Q.morph + k * 0.008, Q.morph + 0.7 + k * 0.008), 2), R2 = 330, R1 = lerp(R2, major ? 282 : 302, u);

          g.globalAlpha = fade; g.strokeStyle = INK; g.lineWidth = 2; g.beginPath(); const au = r(b, Q.dial, Q.dial + 1.0);
          g.arc(CX, CY, 346, -th(0), -th(100 * au) + 0.0001, false); g.stroke();
          const bu = eo3(r(b, Q.dial + 1.0, Q.dial + 1.4)); if (bu > 0) { g.strokeStyle = CORAL; g.lineWidth = 12; g.beginPath(); g.arc(CX, CY, 356, -th(70), -th(lerp(70, 100, bu)), false); g.stroke(); }
          g.globalAlpha = 1; }

          g.fillText(String(Math.round(v)).padStart(2, "0"), CX, 820); mono("FIT SCORE", CX, 860, 18, INK, "center", 600, 0.3); g.globalAlpha = 1; }
