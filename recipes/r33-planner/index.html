<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <!--
      R33 · Planner. 33.3 s at 108 bpm, paper cut-out stop motion (season 4, film 2). For the Social Media Content
      Calendar, João's system that plans a month of posts from one brand brief. A month of social media built as a
      paper planner on a desk: a brief slides in and its fields pull out as tabs, a volvelle clicks four times and a
      banner unrolls for each weekly theme, an accordion of card unfolds into thirty days whose flaps lift in a wave,
      rubber stamps throw out a repeated hook, a repeated CTA and a third post of one format, the month folds into a
      printer and a tractor-feed CSV scrolls out, a pencil ticks the review down the margin, the strip tears off and
      flies away as a paper plane. Then the desk is swept and the JQ AI SYSTEMS logo lands.
      The brief and the month are a sample for JQ VISIONS, illustrative, not the system's own output.
      Technique: the R32 engine on one Canvas 2D. Every piece is a cut path whose edge is torn by noise along its
      normals and filled with a paper stock generated from noise; a tabletop light gives each piece a shadow that grows
      with its height; time is snapped to 12 poses a second and every pose re-cuts each edge a little. paint(t) draws
      every frame from one baked table (assets/table.js, from bake/table.py); score/compose.py reads it too.
    -->
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/table.js"></script>
    <style>
      @font-face { font-family: "Archivo"; src: url("assets/fonts/Archivo.ttf") format("truetype"); font-weight: 100 900; }
      @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/InstrumentSerif-Regular.ttf") format("truetype"); font-weight: 400; font-style: normal; }
      @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/InstrumentSerif-Italic.ttf") format("truetype"); font-weight: 400; font-style: italic; }
      @font-face { font-family: "JBM"; src: url("assets/fonts/jetbrains-mono.woff2") format("woff2"); font-weight: 100 800; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #24324d; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #24324d; color: #221f1d; }
      #ct-stage { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      #cv { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
      #ct-ui { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      .hud { position: absolute; top: 40px; font: 600 17px "JBM", monospace; letter-spacing: 0.2em; white-space: nowrap; color: #f2e9d8; text-transform: uppercase; text-shadow: 0 2px 8px rgba(0,0,0,0.6); }
      #hud-l { left: 64px; }
      #hud-l span { color: #f4a98f; }
      #hud-r { right: 64px; letter-spacing: 0.12em; text-transform: none; color: #f4a98f; }
      #title { position: absolute; inset: 0; opacity: 0; }
      #t-logo { position: absolute; left: 590px; top: 352px; width: 740px; height: 154px; }
      #t-name { position: absolute; left: 0; right: 0; top: 560px; text-align: center; font: 700 50px "Archivo", sans-serif; color: #f2e9d8; white-space: nowrap; opacity: 0; }
      #t-line { position: absolute; left: 0; right: 0; top: 632px; text-align: center; font: italic 400 38px "Instrument Serif", serif; color: #cbbfab; white-space: nowrap; opacity: 0; }
      #t-url { position: absolute; left: 0; right: 0; top: 708px; height: 40px; text-align: center; font: 500 30px "JBM", monospace; color: #ec8a6e; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="33.3333" data-width="1920" data-height="1080">
      <div id="ct-stage" class="clip" data-start="0" data-duration="33.3333" data-track-index="0">
        <canvas id="cv" width="1920" height="1080" data-layout-allow-overflow></canvas>
      </div>
      <div id="ct-ui" class="clip" data-start="0" data-duration="33.3333" data-track-index="1">
        <div class="hud" id="hud-l" data-layout-allow-occlusion>JQ AI SYSTEMS <span>· content calendar</span></div>
        <div class="hud" id="hud-r" data-layout-allow-occlusion><span id="hud-st">01 brand brief</span></div>
        <div id="title" data-layout-allow-occlusion>
          <img id="t-logo" src="assets/brand/jqai-logo.png" alt="JQ AI SYSTEMS">
          <div id="t-name">Social Media Content Calendar</div>
          <div id="t-line">One brief in, a month of posts out</div>
          <div id="t-url"></div>
        </div>
      </div>
      <audio id="score" src="assets/bgm/score.wav" data-start="0" data-duration="33.3333" data-track-index="7" data-volume="0.8"></audio>
    </div>

    <script>
      const TB = window.TABLE, T = TB.T, E = TB.E, DUR = TB.dur, BEAT = TB.beat, PZ = TB.poses;
      const W = 1920, H = 1080;
      const URL_TEXT = "ai.joaoqueiros.com/systems/content-calendar";
      const $ = (s) => document.querySelector(s);
      const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const r = (t, a, b) => cl((t - a) / (b - a));
      const lerp = (a, b, u) => a + (b - a) * u;
      const eOut = (u) => 1 - Math.pow(1 - u, 3), eIn = (u) => u * u * u, eIO = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
      const eBack = (u) => { const c = 1.6, c3 = c + 1; return 1 + c3 * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
      function hash(n) { const s = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); }
      function vnoise(x, seed) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i + seed * 57.31), hash(i + 1 + seed * 57.31), u) * 2 - 1; }
      function prng(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

      let ctx, POSE = 0, DEPTH = 0, PARA = true;
      const CAM = { x: 960, y: 540, z: 1 };

      // ---------------------------------------------------------------- paper stocks, made once from noise
      const STOCK = { birch: "#dcc5a0", birchD: "#c9ad84", felt: "#24324d", leather: "#7c4f35", cream: "#f2e9d8", white: "#f8f5ef", news: "#e8e2d4", ink: "#221f1d",
        navy: "#2a3b5c", navyD: "#1d2a42", coral: "#e07a5f", coralD: "#b85a42", mustard: "#dcab4a", sage: "#9db38f", lilac: "#b8a5cc", manila: "#e4c88f",
        steel: "#bfc3c6", brass: "#c9a54f", wood: "#9a7049", woodD: "#7a5535", pencil: "#e3b23a", lead: "#3a3633", bar: "#e3e8d6" };
      const PLAT = { Instagram: "mustard", LinkedIn: "sage", Pinterest: "lilac" };
      const PAT = {};
      function makeStocks() {
        Object.entries(STOCK).forEach(([k, base], si) => {
          const c = document.createElement("canvas"); c.width = c.height = 512;
          const g = c.getContext("2d"), R = prng(2000 + si * 7919);
          g.fillStyle = base; g.fillRect(0, 0, 512, 512);
          const dark = k === "ink" || k === "felt" || k === "navyD", dk = dark ? 0.05 : 0.03, lt = dark ? 0.02 : 0.04;
          const wrapDraw = (fn) => { for (const ox of [-512, 0, 512]) for (const oy of [-512, 0, 512]) fn(ox, oy); };
          for (let i = 0; i < 110; i++) {
            const x = R() * 512, y = R() * 512, rad = 20 + R() * 80, d = R() < 0.5;
            wrapDraw((ox, oy) => { const gr = g.createRadialGradient(x + ox, y + oy, 0, x + ox, y + oy, rad);
              gr.addColorStop(0, d ? `rgba(0,0,0,${dk})` : `rgba(255,255,255,${lt})`); gr.addColorStop(1, "rgba(0,0,0,0)");
              g.fillStyle = gr; g.fillRect(x + ox - rad, y + oy - rad, rad * 2, rad * 2); });
          }
          // felt is all fibre; birch has a grain running one way
          const fibres = k === "felt" ? 4200 : 1500;
          g.lineWidth = 0.8;
          for (let i = 0; i < fibres; i++) {
            const x = R() * 512, y = R() * 512, a = k.startsWith("birch") ? (R() - 0.5) * 0.15 : R() * Math.PI, l = k.startsWith("birch") ? 30 + R() * 90 : 4 + R() * 16;
            const dk2 = R() < 0.55, al = (dk2 ? 0.07 : 0.11) * R();
            g.strokeStyle = dk2 ? `rgba(0,0,0,${al})` : `rgba(255,255,255,${al})`;
            wrapDraw((ox, oy) => { if (Math.abs(ox) + Math.abs(oy) && (x > 120 && x < 392 && y > 24 && y < 488)) return;
              g.beginPath(); g.moveTo(x + ox, y + oy); g.quadraticCurveTo(x + ox + Math.cos(a + 0.7) * l * 0.5, y + oy + Math.sin(a + 0.7) * l * 0.5, x + ox + Math.cos(a) * l, y + oy + Math.sin(a) * l); g.stroke(); });
          }
          for (let i = 0; i < 700; i++) { g.fillStyle = `rgba(0,0,0,${0.1 * R()})`; g.fillRect(R() * 512, R() * 512, 1.2, 1.2); }
          PAT[k] = ctx.createPattern(c, "repeat");
        });
      }
      let GRAIN, LIGHT;
      function makePost() {
        GRAIN = document.createElement("canvas"); GRAIN.width = GRAIN.height = 256;
        const g = GRAIN.getContext("2d"), im = g.createImageData(256, 256), R = prng(78);
        for (let i = 0; i < 256 * 256; i++) { const v = 100 + R() * 56; im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = 255; }
        g.putImageData(im, 0, 0);
        LIGHT = document.createElement("canvas"); LIGHT.width = W; LIGHT.height = H;
        const l = LIGHT.getContext("2d");
        const gr = l.createRadialGradient(1120, 260, 80, 980, 520, 1250);
        gr.addColorStop(0, "rgba(255, 240, 214, 0.17)"); gr.addColorStop(0.55, "rgba(255, 240, 214, 0)"); gr.addColorStop(1, "rgba(6, 8, 16, 0.5)");
        l.fillStyle = gr; l.fillRect(0, 0, W, H);
      }

      // ---------------------------------------------------------------- cut paper
      const SH = new Map();
      function resample(poly, step) {
        const pts = [];
        for (let i = 0; i < poly.length; i++) {
          const [x0, y0] = poly[i], [x1, y1] = poly[(i + 1) % poly.length];
          const n = Math.max(1, Math.round(Math.hypot(x1 - x0, y1 - y0) / step));
          for (let k = 0; k < n; k++) pts.push([x0 + ((x1 - x0) * k) / n, y0 + ((y1 - y0) * k) / n]);
        }
        return pts;
      }
      function shape(key, make, step) {
        let s = SH.get(key);
        if (s) return s;
        const pts = resample(make(), step), n = pts.length, nrm = [];
        for (let i = 0; i < n; i++) { const a = pts[(i - 1 + n) % n], b = pts[(i + 1) % n]; const nx = b[1] - a[1], ny = -(b[0] - a[0]), l = Math.hypot(nx, ny) || 1; nrm.push([nx / l, ny / l]); }
        s = { pts, nrm }; SH.set(key, s); return s;
      }
      const RECT = (w, h) => () => [[-w / 2, -h / 2], [w / 2, -h / 2], [w / 2, h / 2], [-w / 2, h / 2]];
      const CIRC = (rx, ry = rx, n = 36) => () => Array.from({ length: n }, (_, i) => [rx * Math.cos((i / n) * 2 * Math.PI), ry * Math.sin((i / n) * 2 * Math.PI)]);
      function fillStock(path, stock, seed) {
        const p = PAT[stock];
        p.setTransform(new DOMMatrix().translate(hash(seed) * 512, hash(seed + 1.3) * 512));
        ctx.fillStyle = p; ctx.fill(path);
      }
      // one piece of paper: a torn outline, a stock, a shadow from its height, and whatever is printed or glued on it
      function piece(P) {
        const S = shape(P.key, P.make, P.step || 12), n = S.pts.length, tear = P.tear ?? 1.3, seed = P.seed ?? 1;
        const path = new Path2D();
        for (let i = 0; i < n; i++) {
          const p = S.pts[i], q = S.nrm[i];
          const d = tear * vnoise(i * 0.55, seed) + 0.55 * (hash(i * 3.17 + seed * 11.3 + POSE * 0.731) - 0.5);
          const x = p[0] + q[0] * d, y = p[1] + q[1] * d;
          i ? path.lineTo(x, y) : path.moveTo(x, y);
        }
        path.closePath();
        const jx = (hash(seed * 7.7 + POSE * 1.37) - 0.5) * 1.0, jy = (hash(seed * 3.3 + POSE * 2.11) - 0.5) * 1.0, jr = (hash(seed * 5.1 + POSE * 0.77) - 0.5) * 0.004;
        ctx.save();
        const h = P.h ?? 0.6, top = DEPTH === 0 && PARA;
        const px = top ? (P.x - CAM.x) * h * 0.01 : 0, py = top ? (P.y - CAM.y) * h * 0.01 : 0, ps = top ? 1 + h * 0.008 : 1;
        ctx.translate(P.x + jx + px, P.y + jy + py); ctx.rotate((P.rot || 0) + jr);
        const s = (P.s ?? 1) * ps; ctx.scale(s * (P.sx ?? 1), s * (P.sy ?? 1));
        if (P.alpha !== undefined) ctx.globalAlpha *= P.alpha;
        const z = (PARA ? CAM.z : 1) * (P.zs ?? 1);
        if (h > 0) {
          ctx.shadowColor = `rgba(6, 8, 18, ${(0.5 - 0.05 * Math.min(h, 4)).toFixed(3)})`;
          ctx.shadowBlur = (2 + h * 9) * z; ctx.shadowOffsetX = (1.5 + h * 6) * z; ctx.shadowOffsetY = (2 + h * 8) * z;
        }
        fillStock(path, P.stock, seed);
        ctx.shadowColor = "transparent";
        if (P.content) { ctx.save(); ctx.clip(path); DEPTH++; P.content(); DEPTH--; ctx.restore(); }
        ctx.lineWidth = 1.5 / Math.max(0.2, s); ctx.strokeStyle = P.edge || "rgba(255, 248, 236, 0.34)"; ctx.stroke(path);
        ctx.restore();
      }
      function txt(s, x, y, font, col, align = "center") { ctx.font = font; ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = "middle"; ctx.fillText(s, x, y); }
      function fillRectStock(stock, x, y, w, h, seed = 3) { const p = new Path2D(); p.rect(x, y, w, h); fillStock(p, stock, seed); }
      // a pencil line drawn by hand: a few passes, each a little off, re-drawn per pose
      function graphite(pts, col = "rgba(58, 54, 51, 0.8)", w = 2.2, seed = 1) {
        ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = "round"; ctx.lineJoin = "round";
        for (let pass = 0; pass < 2; pass++) {
          ctx.beginPath();
          pts.forEach(([x, y], i) => { const dx = (hash(seed + i * 3.1 + pass * 7 + POSE * 0.37) - 0.5) * 1.6, dy = (hash(seed + i * 5.7 + pass * 3 + POSE * 0.53) - 0.5) * 1.6; i ? ctx.lineTo(x + dx, y + dy) : ctx.moveTo(x + dx, y + dy); });
          ctx.globalAlpha = pass ? 0.45 : 1; ctx.stroke();
        }
        ctx.restore();
      }

      // ---------------------------------------------------------------- type: every word on its own strip of paper
      const WC = new Map();
      function wordW(text, font) { const k = font + "|" + text; if (!WC.has(k)) { ctx.font = font; WC.set(k, ctx.measureText(text).width); } return WC.get(k); }
      function wrapText(text, font, maxW) {
        ctx.font = font; const out = []; let cur = "";
        for (const w of text.split(" ")) { const t = cur ? cur + " " + w : w; if (ctx.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; }
        if (cur) out.push(cur); return out;
      }
      function layLines() {
        TB.lines.forEach((L, i) => {
          const big = !!L.big, fs = big ? 128 : 74, fa = big ? 152 : 90;
          const words = L.words.map((w, k) => {
            const acc = k === L.accent, font = acc ? `italic 400 ${fa}px "Instrument Serif"` : `800 ${fs}px "Archivo"`;
            return { text: w, font, acc, w: wordW(w, font) + (big ? 46 : 32), h: fs * 1.24 };
          });
          const gap = big ? 18 : 12, total = words.reduce((s, w) => s + w.w, 0) + gap * (words.length - 1);
          let x = L.at[0] === 0 ? 960 - total / 2 : L.at[0];
          L.lay = words.map((w, k) => {
            const sd = 300 + i * 20 + k, ink = !w.acc && k % 2 === 1;
            const o = { ...w, key: `w${i}_${k}`, x: x + w.w / 2, y: L.at[1] + (hash(sd) - 0.5) * 14, rot: (hash(sd * 1.7) - 0.5) * 0.07, seed: sd,
              stock: w.acc ? "coral" : ink ? "ink" : "news", col: w.acc || ink ? "#f6efe2" : "#221f1d", dy: w.acc ? fs * 0.02 : fs * 0.05 };
            x += w.w + gap; return o;
          });
        });
      }
      function drawLine(L, t) {
        if (t < L.t || t > L.out + 1.4) return;
        const n = L.lay.length;
        L.lay.forEach((w, k) => {
          const ti = L.t + k * 0.16, to = L.out + (n - 1 - k) * 0.08;
          if (t < ti) return;
          const a = eOut(r(t, ti, ti + 0.25)), b = eIn(r(t, to, to + 0.4));
          if (b >= 1) return;
          piece({ key: w.key, make: RECT(w.w, w.h), x: w.x + 40 * b, y: w.y - 22 * (1 - a) - 320 * b, rot: w.rot + (k % 2 ? 0.5 : -0.5) * b, s: lerp(1.14, 1, a) + 0.08 * b,
            h: lerp(3.6, 0.45, a) + 3.5 * b, stock: w.stock, seed: w.seed, tear: 1.6, step: 14, content: () => txt(w.text, 0, w.dy, w.font, w.col) });
        });
      }

      // ---------------------------------------------------------------- layout
      const FORM = { x: 560, y: 600, w: 520, h: 560 };
      const WHEEL = { x: 520, y: 620 };
      const BAN = { x: 1250, w: 780, h: 118 }, BANY = (k) => 330 + k * 150;
      const GX = (c) => 600 + c * 200, GY = (rw) => 330 + rw * 140, CARD = { w: 184, h: 124 };
      const cellOf = (day) => ({ c: (day - 1) % 7, rw: Math.floor((day - 1) / 7) });
      const LABX = 300, LABS = 0.42;
      const PRN = { x: 960, y: 960, lip: 860 };
      const STRIP = { w: 1040, H: 1500, rowH: 40, lmax: 1350, perf: 560 };
      const DOW = ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"];
      const REJ = {}; TB.rejects.forEach((j, i) => (REJ[j.day] = { ...j, i, ts: E.stamps[i] }));
      let TAB_W = [], HOOK_L = {}, BAN_W = [];

      // ---------------------------------------------------------------- I · the brief: a form, its fields pulled out as tabs
      function drawBrief(t) {
        if (t > E.formOut[1] + 0.05) return;
        const a = eBack(r(t, E.formIn[0], E.formIn[1])), o = eIn(r(t, E.formOut[0], E.formOut[1]));
        const fx = lerp(-700, FORM.x, a) - 1500 * o, fy = FORM.y - 260 * o, rot = lerp(-0.05, -0.012, a) - 0.1 * o, h = 0.6 + 2.4 * o + 1.5 * (1 - a);
        // the tabs pull out from under the form's right edge
        TB.brief.forEach(([lab, val], k) => {
          const u = eOut(r(t, E.tabs[k], E.tabs[k] + 0.32)); if (u <= 0) return;
          const w = TAB_W[k], ry = -170 + k * 72, tx = FORM.w / 2 - 30 - w / 2 + (w - 10) * u;
          const c = Math.cos(rot), sn = Math.sin(rot);
          piece({ key: "tab" + k, make: RECT(w, 52), x: fx + tx * c - ry * sn, y: fy + tx * sn + ry * c, rot: rot + (hash(k * 4.1) - 0.5) * 0.02, h: h * 0.9, stock: k % 2 ? "news" : "cream", seed: 140 + k, tear: 0.8, step: 10,
            content: () => { ctx.fillStyle = "#e07a5f"; ctx.fillRect(w / 2 - 14, -26, 14, 52); txt(val, -w / 2 + 40, 2, '700 24px "Archivo"', "#221f1d", "left"); } });
        });
        piece({ key: "form", make: RECT(FORM.w, FORM.h), x: fx, y: fy, rot, h, stock: "cream", seed: 131, tear: 1.6, step: 14, content: () => {
          piece({ key: "fhead", make: RECT(FORM.w, 92), x: 0, y: -FORM.h / 2 + 46, h: 0.1, stock: "navy", seed: 132, tear: 0.8, step: 12, content: () => {
            txt("brand brief", -FORM.w / 2 + 34, -12, 'italic 400 44px "Instrument Serif"', "#f2e9d8", "left");
            txt("JQ VISIONS · sample brief", -FORM.w / 2 + 36, 26, '600 15px "JBM"', "#f4a98f", "left");
          } });
          TB.brief.forEach(([lab], k) => {
            const ry = -170 + k * 72;
            txt(lab, -FORM.w / 2 + 34, ry, '600 18px "JBM"', "#8a3e2a", "left");
            ctx.fillStyle = "rgba(34, 31, 29, 0.55)"; ctx.fillRect(FORM.w / 2 - 34, ry - 26, 6, 52);   // the slot the tab runs through
            ctx.strokeStyle = "rgba(34, 31, 29, 0.14)"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-FORM.w / 2 + 30, ry + 36); ctx.lineTo(FORM.w / 2 - 30, ry + 36); ctx.stroke();
          });
        } });
      }

      // ---------------------------------------------------------------- II · a volvelle clicks four times, a banner unrolls per week
      function wheelRot(t) { return Math.PI / 2 - (Math.PI / 2) * E.clicks.reduce((s, c) => s + eBack(r(t, c, c + 0.3)), 0); }
      function drawWheel(t) {
        if (t < E.wheelIn[0] || t > E.wheelOut[1] + 0.05) return;
        const a = eBack(r(t, E.wheelIn[0], E.wheelIn[1])), o = eIn(r(t, E.wheelOut[0], E.wheelOut[1]));
        const x = WHEEL.x - 1300 * o, y = lerp(1500, WHEEL.y, a), h = 0.6 + 2 * (1 - a) + 2 * o, rho = wheelRot(t);
        piece({ key: "vbase", make: CIRC(282, 282, 64), x, y, h, stock: "navy", seed: 151, tear: 1.2, step: 10, content: () => {
          for (let i = 0; i < 28; i++) { const q = (i / 28) * Math.PI * 2; ctx.fillStyle = i % 7 ? "rgba(242,233,216,0.3)" : "#f2e9d8"; ctx.save(); ctx.rotate(q); ctx.fillRect(250, -2, i % 7 ? 14 : 22, 4); ctx.restore(); }
        } });
        piece({ key: "vwheel", make: CIRC(236, 236, 60), x, y, rot: rho, h: h + 0.35, stock: "cream", seed: 152, tear: 1.0, step: 10, content: () => {
          for (let k = 0; k < 4; k++) {

          ctx.save(); ctx.setLineDash([10, 8]); ctx.strokeStyle = "rgba(242, 233, 216, 0.22)"; ctx.lineWidth = 2; ctx.strokeRect(-850, -490, 1700, 980); ctx.restore();
        } });
        for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]])
          piece({ key: "corner", make: () => [[0, 0], [190, 0], [0, 190]], x: 1000 + sx * 880, y: 600 + sy * 520, sx: -sx, sy: -sy, h: 0.4, stock: "leather", seed: 10 + sx + 3 * sy, tear: 0.8, step: 10 });
        // a mug of pencils, a stamp pad and a stapler
        piece({ key: "mug", make: CIRC(92, 92, 40), x: 1890, y: 120, h: 2.2, stock: "coral", seed: 21, tear: 0.6, step: 10, content: () => {
          ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.beginPath(); ctx.arc(4, 4, 74, 0, 7); ctx.fill();
          [["#e3b23a", -30, -20], ["#9db38f", 22, -30], ["#f2e9d8", -4, 26], ["#b8a5cc", 34, 18], ["#e3b23a", -38, 30]].forEach(([c, x, y]) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, 13, 0, 7); ctx.fill(); ctx.fillStyle = "#3a3633"; ctx.beginPath(); ctx.arc(x, y, 4, 0, 7); ctx.fill(); });
        } });
        piece({ key: "spad", make: RECT(240, 150), x: 70, y: 1010, rot: 0.12, h: 1.2, stock: "navyD", seed: 22, tear: 0.6, step: 10, content: () => { ctx.fillStyle = "#8e3a28"; ctx.fillRect(-100, -55, 200, 110); ctx.fillStyle = "rgba(255,255,255,0.06)"; ctx.fillRect(-100, -55, 200, 20); } });
        piece({ key: "stapler", make: RECT(300, 70), x: 1840, y: 1040, rot: -0.2, h: 1.6, stock: "steel", seed: 23, tear: 0.4, step: 10, content: () => { fillRectStock("ink", -150, -22, 260, 44, 24); } });
        [[160, 230, "mustard"], [1880, 520, "cream"], [120, 640, "coral"], [1700, 1060, "lilac"], [380, 1050, "sage"], [1890, 860, "news"]].forEach(([x, y, st], i) =>
          piece({ key: "scrap" + (i % 3), make: [() => [[-22, -14], [26, -6], [-6, 18]], RECT(54, 14), () => [[-18, -18], [20, -10], [14, 16], [-16, 12]]][i % 3], x, y, rot: hash(i * 7.3) * 6, h: 0.15, stock: st, seed: 60 + i, tear: 0.5, step: 6 }));
      }
      // the camera: a slow crane over the spread, stepped like a stop-motion rig; it pushes in only on the check and the export
      function camAt(t) {
        const S = E.stamps;
        const K = [[0, 760, 580, 1.36], [E.formIn[1] + 0.3, 770, 560, 1.26], [E.tabs[5] + 0.6, 830, 560, 1.2], [E.formOut[0], 830, 560, 1.2],
          [E.wheelIn[1], 1000, 560, 0.98], [E.clicks[3] + 0.8, 1040, 560, 1.0], [E.toRows[0], 1000, 590, 0.95], [E.rows[4] + 0.6, 1010, 610, 0.88],
          [E.flaps + 1.6, 1010, 610, 0.9], [T.variety[0], 1010, 610, 0.9], [S[0] - 0.4, 900, 400, 1.7], [S[0] + 1.2, 900, 400, 1.7],
          [S[1] - 0.4, 1000, 560, 1.42], [S[2] + 1.25, 1000, 560, 1.42], [T.export[0], 1010, 610, 0.9], [E.feedIn[0], 960, 600, 1.0],
          [E.feed[1], 960, 540, 1.03], [E.ticks[1], 940, 500, 1.08], [T.title, 960, 560, 1.0], [DUR, 960, 540, 1.0]];
        let i = 0; while (i < K.length - 2 && t > K[i + 1][0]) i++;
        const A = K[i], B = K[i + 1], u = eIO(r(t, A[0], B[0]));
        return { x: lerp(A[1], B[1], u), y: lerp(A[2], B[2], u), z: lerp(A[3], B[3], u) };
      }
      function post(t) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1 - 0.7 * r(t, E.sweep[0], E.sweep[1]); ctx.drawImage(LIGHT, 0, 0); ctx.globalAlpha = 1;
        const f = (hash(POSE * 1.713) - 0.5) * 0.05;
        ctx.fillStyle = f > 0 ? `rgba(255, 244, 228, ${f.toFixed(3)})` : `rgba(20, 10, 4, ${(-f).toFixed(3)})`; ctx.fillRect(0, 0, W, H);
        ctx.save(); ctx.globalCompositeOperation = "overlay"; ctx.globalAlpha = 0.16;
        const ox = Math.floor(hash(POSE * 3.1) * 256), oy = Math.floor(hash(POSE * 5.3) * 256);
        for (let x = -ox; x < W; x += 512) for (let y = -oy; y < H; y += 512) ctx.drawImage(GRAIN, x, y, 512, 512);
        ctx.restore();
      }
      function sweep(t) {
        const u = r(t, E.sweep[0], E.sweep[1]);
        if (u <= 0) return false;
        const x = lerp(-1300, 960, eOut(u));
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        piece({ key: "sheet", make: RECT(2500, 1500), x, y: 540, rot: lerp(0.06, 0, eOut(u)), h: 2 * (1 - u) + 0.6, stock: "ink", seed: 900, tear: 7, step: 26, edge: "rgba(255,248,236,0.12)" });
        return u >= 1;
      }

      function paint(t) {
        const ts = Math.floor(t * PZ + 1e-4) / PZ;   // shot on twos: every frame shows the pose of its twelfth of a second
        POSE = Math.round(ts * PZ);
        const covered = ts >= E.sweep[1];
        Object.assign(CAM, camAt(ts));
        if (!covered) {
          PARA = true;
          drawDesk();
          drawBrief(ts); drawWheel(ts); drawStrip(ts); drawMonth(ts); drawPrinter(ts); drawBanners(ts); drawStamps(ts); drawPlane(ts);
          ctx.setTransform(1, 0, 0, 1, 0, 0); PARA = false;
          TB.lines.forEach((L) => drawLine(L, ts));
        }
        PARA = false;
        sweep(ts);
        post(ts);
        const lo = r(ts, E.logo, E.logo + 0.25);
        $("#title").style.opacity = lo > 0 ? 1 : 0;
        $("#t-logo").style.opacity = lo.toFixed(3); $("#t-logo").style.transform = `scale(${lerp(1.06, 1, eOut(lo)).toFixed(4)})`;
        $("#t-name").style.opacity = r(ts, E.name, E.name + 0.25).toFixed(3);
        $("#t-line").style.opacity = r(ts, E.name + 0.4, E.name + 0.7).toFixed(3);
        $("#t-url").textContent = URL_TEXT.slice(0, Math.round(URL_TEXT.length * r(t, E.url, E.url + 1.1)));
        let st = TB.hud[0][1]; for (const [a, s] of TB.hud) if (ts >= a) st = s;
        $("#hud-st").textContent = st;
        const ho = (1 - r(ts, E.sweep[0], E.sweep[0] + 0.4)).toFixed(3);
        $("#hud-l").style.opacity = ho; $("#hud-r").style.opacity = ho;
      }

      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => paint(clock.t) }, 0);

      async function build() {
        await Promise.all([document.fonts.load('800 40px "Archivo"'), document.fonts.load('700 40px "Archivo"'), document.fonts.load('italic 400 40px "Instrument Serif"'),
          document.fonts.load('500 20px "JBM"'), document.fonts.load('700 20px "JBM"'), document.fonts.load('800 20px "JBM"'), $("#t-logo").decode()]);
        ctx = $("#cv").getContext("2d");
        makeStocks(); makePost(); layLines();
        TAB_W = TB.brief.map(([, v]) => wordW(v, '700 24px "Archivo"') + 80);
        const hooks = new Set([...TB.posts.map((p) => p.hook), ...TB.rejects.map((j) => j.draft.hook).filter(Boolean)]);
        hooks.forEach((h) => (HOOK_L[h] = wrapText(h, '700 15px "Archivo"', 168).slice(0, 2)));
        window.addEventListener("hf-seek", (ev) => paint(ev.detail.time));
        paint(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
      }
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["planner"] = build();
    </script>
