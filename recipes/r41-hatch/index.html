      R41 · Hatch. 34.56 s at 125 bpm. For Codex Control Center, which sees the shape of the activity and not the words.
      The whole film is one engraved field of lines, like a banknote. Nothing is shaded and nothing is laid on top: 3D forms and big
      words exist only because the lines swell or bend. One fragment shader, stateless, three sub-frames of motion blur per frame.
      Type goes in through one canvas: red makes lines swell (ink), blue only bends them (shape with no ink), green is flat small type.
      The logo is a flat image at the close and is never put through the lines.

      const VS = "#version 300 es\nin vec2 c; void main(){ gl_Position = vec4(c, 0.0, 1.0); }";
      const FS = `#version 300 es
precision highp float;
uniform sampler2D uT, uLogo;
uniform vec2 uShake, uC, uFC;
uniform vec3 uPA, uIA, uPB, uIB, uFlat, uShockA, uShockB;
uniform float uBar[7];
uniform int uS, uM0, uM1;
uniform float uF, uAng, uMix, uBg, uPulse, uDisp, uObjMix, uObjF, uObjD, uA, uB2, uYaw, uPitch, uDist, uTxtTone, uTxtH, uBlueH, uFR, uLA, uTunZ, uTunR, uOpenBoost;
out vec4 o;
const vec2 RES = vec2(1920.0, 1080.0);
mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
float box(vec3 p, vec3 b, float r){ vec3 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0) - r; }
float map(vec3 q) {
  if (uS == 0) {
    float l = uB2 * sin(3.1 * q.x + uYaw * 2.0) * sin(3.7 * q.y - uYaw * 1.4) * sin(3.3 * q.z + uYaw);
    return (length(q) - uA - l) * 0.72;
  }
  if (uS == 1) {
    vec3 g = q - vec3(-0.75, 0.0, 0.0);
    float d = 1e3;
    for (int i = 0; i < 7; i++) {
      float h = max(0.01, uBar[i]);
      d = min(d, box(g - vec3(float(i) * 0.36 - 1.08, -0.92 + h, 0.1), vec3(0.14, h, 0.34), 0.03));
    }
    vec3 c = q - vec3(1.82, -0.02 + uB2, 0.05);
    c.yz = rot(uA) * c.yz; c.xz = rot(uA * 0.6) * c.xz;
    float t = length(vec2(length(c.xz) - 0.64, c.y)) - 0.14;
    return min(d, t);
  }
  if (uS == 2) {
    float fr = min(box(q - vec3(-1.56, 0.0, 0.0), vec3(0.14, 1.72, 0.2), 0.02), box(q - vec3(1.56, 0.0, 0.0), vec3(0.14, 1.72, 0.2), 0.02));
    fr = min(fr, box(q - vec3(0.0, 1.72, 0.0), vec3(1.7, 0.14, 0.2), 0.02));
    fr = min(fr, box(q - vec3(0.0, -1.72, 0.0), vec3(1.7, 0.14, 0.2), 0.02));
    vec3 a = q - vec3(-1.42, 0.0, 0.0); a.xz = rot(uA) * a.xz;
    vec3 b = q - vec3(1.42, 0.0, 0.0); b.xz = rot(-uA) * b.xz;
    float da = max(box(a - vec3(0.71, 0.0, 0.0), vec3(0.7, 1.58, 0.07), 0.01), -box(a - vec3(0.71, 0.0, -0.07), vec3(0.5, 1.36, 0.035), 0.01));
    float db = max(box(b + vec3(0.71, 0.0, 0.0), vec3(0.7, 1.58, 0.07), 0.01), -box(b + vec3(0.71, 0.0, -0.07), vec3(0.5, 1.36, 0.035), 0.01));
    return min(fr, min(da, db));
  }
  // the X
  vec3 x = q; x.xy = rot(0.7854) * x.xy;
  return min(box(x, vec3(1.42, 0.34, 0.28), 0.03), box(x, vec3(0.34, 1.42, 0.28), 0.03));
}
vec3 normalAt(vec3 q) {
  const vec2 e = vec2(0.002, 0.0);
  return normalize(vec3(map(q + e.xyy) - map(q - e.xyy), map(q + e.yxy) - map(q - e.yxy), map(q + e.yyx) - map(q - e.yyx)));
}
float field(int m, vec2 p) {
  if (m == 0) return (rot(uAng) * p).y;
  if (m == 1) return length(p - uC);
  if (m == 2) return atan(p.y - uC.y, p.x - uC.x) / 6.2832 * 3.0;
  if (m == 3) { vec2 d = p - uC; return length(d) * 0.72 + atan(d.y, d.x) / 6.2832 * (3.0 / uF); }
  vec2 d = rot(uTunR) * (p - uC) * vec2(1.0, 1.25);
  return 0.28 / max(max(abs(d.x), abs(d.y)), 0.016) * 0.22 + uTunZ;
}
vec3 soft(vec2 uv, float lod) {
  vec2 d = pow(2.0, lod) * 0.8 / RES;
  vec3 c = textureLod(uT, uv, lod).rgb * 0.25;
  c += (textureLod(uT, uv + vec2(d.x, 0.0), lod).rgb + textureLod(uT, uv - vec2(d.x, 0.0), lod).rgb + textureLod(uT, uv + vec2(0.0, d.y), lod).rgb + textureLod(uT, uv - vec2(0.0, d.y), lod).rgb) * 0.125;
  c += (textureLod(uT, uv + d, lod).rgb + textureLod(uT, uv - d, lod).rgb + textureLod(uT, uv + vec2(d.x, -d.y), lod).rgb + textureLod(uT, uv + vec2(-d.x, d.y), lod).rgb) * 0.0625;
  return c;
}
float shock(vec3 s, vec2 p) {
  if (s.z < 0.0) return 0.0;
  float r = length(p - s.xy), f = r - s.z * 2.6;
  return 7.0 * exp(-f * f / 0.012) * exp(-s.z * 2.4);
}
float stripe(float x, float w, float aa) {
  float d = abs(fract(x) - 0.5) * 2.0;
  float c = 1.0 - smoothstep(w - aa, w + aa, d);
  return mix(c, clamp(w, 0.0, 1.0), smoothstep(0.6, 1.5, aa));
}
void main() {
  vec2 uv = gl_FragCoord.xy / RES;
  vec2 p = (uv - 0.5) * vec2(1.7778, 1.0) + uShake;
  vec2 tuv = uv + vec2(uShake.x / 1.7778, uShake.y);
  vec3 tx = texture(uT, tuv).rgb;
  float rh = textureLod(uT, tuv, 3.0).r, bh = soft(tuv, 4.0).b * 0.75 + soft(tuv, 5.5).b * 0.6, gh = textureLod(uT, tuv, 4.0).g;
  float tone = uBg, disp = 0.0, obj = 0.0, objL = 0.0;
  if (uS >= 0) {
    vec3 ro = vec3(0.0, 0.0, -uDist);
    vec3 rd = normalize(vec3(p, 1.55));
    ro.yz = rot(uPitch) * ro.yz; rd.yz = rot(uPitch) * rd.yz;
    float yaw = uS == 0 ? 0.0 : uYaw;
    ro.xz = rot(yaw) * ro.xz; rd.xz = rot(yaw) * rd.xz;
    float t = 0.0; bool hit = false;
    for (int i = 0; i < 64; i++) {
      float d = map(ro + rd * t);
      if (d < 0.0012) { hit = true; break; }
      t += d; if (t > uDist + 7.0) break;
    }
    if (hit) {
      vec3 q = ro + rd * t, n = normalAt(q);
      float l = clamp(dot(n, normalize(vec3(-0.55, 0.72, -0.5))), 0.0, 1.0);
      float rim = pow(1.0 - clamp(-dot(n, rd), 0.0, 1.0), 2.5);
      float shade = clamp(0.92 - 0.8 * l + 0.14 * rim, uS == 3 ? 0.62 : 0.06, 1.0);
      obj = 1.0;
      tone = mix(tone, shade, uObjMix);
      bool door = uS == 2 && abs(q.x) < 1.42 && abs(q.y) < 1.58;
      if (door) tone = min(1.0, tone + 0.2);
      objL = uS == 2 ? (door ? (q.x + q.z * 0.8) * 0.9 : q.y * 0.6) : dot(q, normalize(vec3(0.25, 1.0, 0.18)));
      disp = max(0.0, uDist - t) * uObjD;
    }
  }
  if (uM0 == 4) { vec2 dt = rot(uTunR) * (p - uC) * vec2(1.0, 1.25); tone = mix(0.1, 0.8, smoothstep(0.04, 0.46, max(abs(dt.x), abs(dt.y)))); }
  disp += (rh * 1.5) * uTxtH + bh * uBlueH;
  tone = mix(tone, uTxtTone, tx.r);
  tone = max(tone, uBg * (1.0 - obj)) + uPulse * (0.05 + 0.14 * tone);
  tone *= 1.0 - smoothstep(0.015, 0.2, gh);
  vec2 pw = p;
  float L = mix(field(uM0, pw), field(uM1, pw), uMix) * uF + 0.5;
  L += disp * uDisp + shock(uShockA, p) + shock(uShockB, p);
  L = mix(L, objL * uObjF, obj * uObjMix * 0.999);
  float fw = max(fwidth(L), 0.0005);
  float main_ = stripe(L, min(tone * 0.88, 1.0), fw * 1.15);
  float crossW = clamp((tone - 0.56) * 1.15, 0.0, 0.7);
  float Lx = L * 0.0 + (uM0 == 0 ? (rot(uAng + 1.5708) * p).y : (rot(0.7854) * p).y) * uF;
  float cross = crossW > 0.0 ? stripe(Lx + 0.5, crossW, max(fwidth(Lx), 0.0005) * 1.15) : 0.0;
  float ink = max(main_, cross);
  // the wipe: a front of solid ink, the new colours behind it
  float s = length(p - uFC) - uFR;
  vec3 paper = s < 0.0 ? uPB : uPA, inkc = s < 0.0 ? uIB : uIA;
  ink = max(ink, smoothstep(0.075, 0.015, abs(s)));
  vec3 col = mix(paper, inkc, ink);
  col = mix(col, uFlat, tx.g);
  vec2 q = (uv - vec2(0.5, 0.5 + 180.0 / 1080.0)) * RES / vec2(620.0, 129.0) + 0.5;
  if (uLA > 0.0 && q.x > 0.0 && q.x < 1.0 && q.y > 0.0 && q.y < 1.0) { vec4 lg = texture(uLogo, vec2(q.x, 1.0 - q.y)); col = mix(col, lg.rgb, lg.a * uLA); }
  o = vec4(col, 1.0);
}`;
    </script>

    <script>
      const TB = window.TABLE, DUR = TB.dur, BEAT = TB.beat, FPS = 30, SUBS = 3;

      const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), r = (t, a, b) => cl((t - a) / (b - a)), lerp = (a, b, u) => a + (b - a) * u;
      const eo = (u) => 1 - Math.pow(1 - cl(u), 3), ex = (u) => { u = cl(u); return u >= 1 ? 1 : 1 - Math.pow(2, -10 * u); }, ei = (u) => Math.pow(cl(u), 3);
      const back = (u, k = 1.9) => { u = cl(u) - 1; return u * u * ((k + 1) * u + k) + 1; };
      const io = (u) => { u = cl(u); return u * u * (3 - 2 * u); };

      const URL_TEXT = "ai.joaoqueiros.com";

      function initGL() {

        const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };

      // Type. Red swells the lines, blue only bends them, green is flat small type.
      const R_ = "rgb(255,0,0)", G_ = "rgb(0,255,0)", B_ = "rgb(0,0,255)";
      function fit(s, cx, cy, w, col, scale = 1, skew = 0, stretch = "normal") {
        g.save(); g.fontStretch = stretch; g.font = HEAVY(200); const size = 200 * w / g.measureText(s).width; g.font = HEAVY(size);
        g.translate(cx, cy); g.transform(1, 0, skew, 1, 0, 0); g.scale(scale, scale); g.fillStyle = col; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(s, 0, size * 0.035); g.restore(); g.fontStretch = "normal"; return size;
      }
      function sized(s, cx, cy, size, col) { g.font = HEAVY(size); g.fillStyle = col; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(s, cx, cy); }
      function lab(s, x, y, size = 20, a = "left", font = MONO) { g.font = font(size); g.fillStyle = G_; g.textAlign = a; g.textBaseline = "middle"; g.fillText(s, x, y); }
