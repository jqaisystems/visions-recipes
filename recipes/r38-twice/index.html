<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <!--
      R38 · Twice. 35.45 s at 88 bpm (season 5, time as a material, film 3). Made for Klatea, a preparation studio and
      live meeting copilot whose promise is that the hard moment of a call happens twice, first in rehearsal, then for
      real. The conversation sits in one texture array, in the order it happens (here a procedural demo call from
      bake/demo.py, or your own screens through bake/prep.py), and every pixel picks its own moment:
      the brief written out of a slit; the client's question cut out of time and held; two windows, rehearsal and
      live, the same objection on the same beat, then the slit sweeps and it all goes live; two sides, each moved in
      time by its own speaker; the whole call as one image, folded into the debrief; a tunnel back to the next prep;
      type cut out of the call; your mark.
      paint(t) sets every uniform from one baked table (assets/table.js, from bake/table.py); a 2D canvas on top
      draws the hairlines, labels and outlines, and a second, offscreen one draws the letters the shader fills.
    -->
   <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/table.js"></script>
    <style>
      @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-latin.woff2") format("woff2"); font-weight: 100 900; font-style: normal; }
      @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Italic.ttf") format("truetype"); font-weight: 100 900; font-style: italic; }
      @font-face { font-family: "Plex"; src: url("assets/fonts/IBMPlexMono-Regular.ttf") format("truetype"); font-weight: 400; }
      @font-face { font-family: "Plex"; src: url("assets/fonts/IBMPlexMono-Medium.ttf") format("truetype"); font-weight: 500; }
      @font-face { font-family: "Instrument"; src: url("assets/fonts/InstrumentSans.ttf") format("truetype"); font-weight: 400 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #F4F1EA; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #F4F1EA; color: #20272A; }
      #ct-stage { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      #gl, #ov { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
      #ct-ui { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      .hud { position: absolute; top: 38px; font: 500 16px "Plex", monospace; letter-spacing: 0.18em; white-space: nowrap; color: #646C6A; text-transform: uppercase; }
      #hud-l { left: 200px; color: #114353; }
      #hud-l span { color: #646C6A; }
      #hud-r { right: 200px; }
      #rail { position: absolute; left: 112px; top: 520px; width: 0; height: 0; }
      #rail div { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%) rotate(-90deg); font: 500 16px "Plex", monospace; letter-spacing: 0.32em; color: #646C6A; white-space: nowrap; }
      #ln { position: absolute; left: 200px; top: 984px; font: 500 64px/1.05 "Fraunces", serif; letter-spacing: -0.015em; color: #114353; white-space: nowrap; opacity: 0; }
      #ln em { font-style: italic; color: #6B8A67; }
      #flash { position: absolute; inset: 0; background: #FFFDF8; opacity: 0; }
      #veil { position: absolute; inset: 0; background: #F4F1EA; opacity: 1; }
      #card { position: absolute; inset: 0; background: #F4F1EA; opacity: 0; }
      #c-logo { position: absolute; left: 580px; top: 330px; width: 760px; height: 135px; }
      #c-claim { position: absolute; left: 0; right: 0; top: 540px; text-align: center; font: 500 50px "Fraunces", serif; color: #114353; white-space: nowrap; letter-spacing: -0.01em; }
      #c-claim em { font-style: italic; color: #6B8A67; }
      #c-url { position: absolute; left: 0; right: 0; top: 650px; height: 34px; text-align: center; font: 500 26px "Plex", monospace; color: #114353; white-space: nowrap; letter-spacing: 0.04em; }
      #c-beta { position: absolute; left: 0; right: 0; top: 712px; text-align: center; font: 500 18px "Plex", monospace; letter-spacing: 0.28em; color: #D64550; white-space: nowrap; text-transform: uppercase; }
    </style>

  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="35.4545" data-width="1920" data-height="1080">
      <div id="ct-stage" class="clip" data-start="0" data-duration="35.4545" data-track-index="0">
        <canvas id="gl" width="1920" height="1080" data-layout-allow-overflow></canvas>
        <canvas id="ov" width="1920" height="1080" data-layout-allow-overflow></canvas>
      </div>
      <div id="ct-ui" class="clip" data-start="0" data-duration="35.4545" data-track-index="1">
        <div class="hud" id="hud-l" data-layout-allow-occlusion>Klatea <span>· discovery call · demo scenario</span></div>
        <div class="hud" id="hud-r" data-layout-allow-occlusion><span id="hud-st"></span></div>
        <div id="rail" data-layout-allow-occlusion><div id="rail-t"></div></div>
        <div id="ln" data-layout-allow-occlusion></div>
        <div id="card" data-layout-allow-occlusion>
          <img id="c-logo" src="assets/brand/your-mark.svg" alt="Your mark">
          <div id="c-claim"></div>

          <div id="c-beta"></div>
        </div>
        <div id="flash" data-layout-allow-occlusion></div>
        <div id="veil" data-layout-allow-occlusion></div>
      </div>
      <audio id="score" src="assets/bgm/score.wav" data-start="0" data-duration="35.4545" data-track-index="7" data-volume="0.9"></audio>
    </div>

    <script>
      // one pass: every pixel picks its own moment of the conversation
      const FS = `#version 300 es
precision highp float;
precision highp sampler2DArray;
uniform sampler2DArray uSlab;
uniform sampler2D uMask;
uniform vec2 uRes;
uniform float uTime, uMode, uN;
uniform float uP[16];
uniform vec4 uR, uA, uB, uH;
out vec4 fragColor;

const vec3 PAPER = vec3(0.957, 0.945, 0.918);
const vec3 INK = vec3(0.067, 0.263, 0.325);
const vec3 SAGE = vec3(0.420, 0.541, 0.404);
float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
vec3 F0(vec2 uv, float k) { return texture(uSlab, vec3(clamp(uv, 0.0005, 0.9995), clamp(k, 0.0, uN - 1.0))).rgb; }
// a moment between two frames melts from one to the next
vec3 F(vec2 uv, float k) {
  k = clamp(k, 0.0, uN - 1.0);
  float a = floor(k), f = k - a;
  vec3 c = F0(uv, a);
  if (f > 0.002) c = mix(c, F0(uv, a + 1.0), f);
  return c;
}
// a frame shown in a window rect (x, y, w, h); paper outside it
bool inR(vec2 P, vec4 R) { return P.x >= R.x && P.y >= R.y && P.x < R.x + R.z && P.y < R.y + R.w; }
vec2 uvR(vec2 P, vec4 R) { return (P - R.xy) / R.zw; }
float slitLine(float d, float w) { return exp(-abs(d) / w); }
// the call as one image: each column of the window a different moment, in order
float colK(float u) { return clamp(u, 0.0, 1.0) * (uN - 1.0); }

// ---------------- I · the prep form plays; a slit sweeps and the brief writes itself out of it
vec3 mOpen(vec2 P) {
  if (!inR(P, uR)) return PAPER;
  vec2 uv = uvR(P, uR);
  float x = uP[0], d = x - P.x;
  vec3 c;
  if (d < 0.0) c = F(uv, uP[1]);
  else {
    // behind the slit: the brief, its later lines trailing back from the slit as a time smear
    float k = uP[2] + clamp(d / 700.0, 0.0, 1.0) * uP[3];
    vec2 sv = uv + vec2(0.0, -0.035 * exp(-d / 160.0));
    c = F(sv, k);
  }
  c = mix(c, INK, slitLine(d, 1.2) * uP[4] + slitLine(d, 26.0) * 0.08 * uP[4]);
  return c;
}
// ---------------- II · the role-play: a scan brings it in, the client's question is cut out of time and held
vec3 mRehearse(vec2 P) {
  if (!inR(P, uR)) return PAPER;
  vec2 uv = uvR(P, uR);
  float y = uP[0], d = y - P.y;
  vec3 c;
  if (d < 0.0) c = F(uv, uP[1]);
  else {
    // a slow ripple of time down the screen: rows run a little behind or ahead
    float k = uP[2] - uP[5] * (0.5 + 0.5 * sin(P.y / 70.0 - uTime * 2.2)) * 1.6;
    c = F(uv + vec2(uP[5] * 0.0025 * sin(P.y / 23.0 + uTime * 3.0), 0.0), k);
  }
  c = mix(c, INK, slitLine(d, 1.2) * uP[6]);
  // the rest drifts back towards paper while the question holds
  c = mix(c, PAPER, 0.42 * uP[3]);
  // the held question: frozen at its own moment, lifted a little
  if (uP[3] > 0.0) {
    vec4 Hd = uH + vec4(-uP[4] * 0.02 * uH.z, -uP[4] * 22.0 - uP[4] * 0.02 * uH.w, uP[4] * 0.04 * uH.z, uP[4] * 0.04 * uH.w);
    if (inR(P, Hd)) {
      vec2 hu = uvR(P, Hd);
      vec2 src = (uH.xy + hu * uH.zw - uR.xy) / uR.zw;
      c = mix(c, F0(src, uP[7]), uP[3]);
    }
  }
  return c;
}
// ---------------- III · twice: two windows, then the slit sweeps and it all goes live
vec3 mTwice(vec2 P) {
  vec3 c = PAPER;
  if (inR(P, uA)) {
    vec2 uv = uvR(P, uA);
    c = F(uv, uP[0]);
    c = mix(c, PAPER, uP[4]);
  }
  if (inR(P, uB)) {
    vec2 uv = uvR(P, uB);
    // just inside the slit, the live call runs a moment behind: a time smear on the sweep's edge
    float e = P.x - uB.x;
    float k = uP[1] - uP[3] * 2.4 * exp(-e / 140.0);
    c = F(uv, k);
  }
  // the slit between them
  float sx = uP[2];
  if (sx > 0.0) c = mix(c, INK, slitLine(P.x - sx, 1.2) * uP[5] * step(uP[6], P.y) * step(P.y, uP[7]));
  return c;
}
// ---------------- IV · two sides: each side of the transcript moved in time by its own speaker
vec3 mSides(vec2 P) {
  if (!inR(P, uR)) return PAPER;
  vec2 uv = uvR(P, uR);
  float fx = uv.x * 1600.0;
  float them = smoothstep(560.0, 420.0, fx), you = smoothstep(380.0, 520.0, fx) * smoothstep(1010.0, 960.0, fx);
  float e = uP[1] * them + uP[2] * you;
  float row = 0.5 + 0.5 * sin(P.y / 16.0 + uTime * 9.0);
  float k = uP[0] - e * (0.6 + 1.4 * row);
  vec3 c = F(uv + vec2(e * 0.014 * (row - 0.5), 0.0), k);
  return c;
}
// ---------------- V · the call as one image, squeezed to a strip, unfolded into the debrief
vec3 mDebrief(vec2 P) {
  // the window can be squeezed to a strip about its centre line
  float sq = uP[2];
  float cy = uR.y + 0.5 * uR.w, hh = mix(0.5 * uR.w, 64.0, sq);
  if (P.x < uR.x || P.x >= uR.x + uR.z || abs(P.y - cy) > hh) return PAPER;
  vec2 uv = vec2((P.x - uR.x) / uR.z, 0.5 + (P.y - cy) / (2.0 * hh) * mix(1.0, 0.16, sq));
  float x = uP[0], d = x - P.x;
  vec3 c;
  vec3 strip = F0(uv, floor(colK(uv.x) + 0.5));
  if (uP[3] > 0.0) {
    // unfold: the debrief grows back out of the strip
    vec2 du = vec2((P.x - uR.x) / uR.z, (P.y - (cy - hh)) / (2.0 * hh));
    c = mix(strip, F(du, uP[4]), uP[3]);
  } else if (d < 0.0) c = F(uv, uP[1]);
  else c = strip;
  c = mix(c, INK, slitLine(d, 1.2) * uP[5]);
  return c;
}
// ---------------- VI · a tunnel back to the next prep: each ring is the next moment of the call
vec3 gate(vec2 P) {
  float y = P.y - 0.5 * uRes.y, ay = abs(y) + 0.5;
  float z = 240.0 / ay;
  float u = (P.x - 0.5 * uRes.x) / ay * 0.42, v = z * 0.11 + uP[1];
  vec2 uv = vec2(1.0 - abs(1.0 - mod(u * 0.5 + 0.5, 2.0)), fract(v));
  if (y < 0.0) uv.y = 1.0 - uv.y;
  float k = mod(floor(v) * 5.0 + (y < 0.0 ? 27.0 : 0.0), uN);
  vec3 c = F0(uv, k);
  c = mix(PAPER, c, smoothstep(0.0, 0.6, ay / (0.5 * uRes.y)));
  c = mix(c, INK, exp(-ay / 2.0) * 0.9);
  return c;
}
vec3 mLoop(vec2 P) {
  vec3 col = PAPER;
  float g = uP[0];
  if (g > 0.0) {
    float ay = abs(P.y - 0.5 * uRes.y), e = g * 0.5 * uRes.y;
    if (ay < e + 2.0) col = mix(col, gate(P), smoothstep(e + 2.0, e - 30.0, ay));
  }
  if (uP[2] > 0.0 && inR(P, uR)) col = mix(col, F(uvR(P, uR), uP[3]), uP[2]);
  return col;
}
// ---------------- VII · type cut out of the call
vec3 mTitle(vec2 P) {
  vec2 uv = P / uRes;
  vec4 mk = texture(uMask, uv);
  vec3 c = PAPER;
  if (mk.r > 0.004) {
    float k = floor(mk.g / max(mk.r, 1e-3) * 255.0 + 0.5);
    vec3 f = F0(uv * 0.5 + vec2(0.04, 0.06), k);
    // ink letters with the moment inside: the screen shows through, darkened into the brand's ink
    float lum = dot(f, vec3(0.3, 0.59, 0.11));
    vec3 lt = mix(vec3(0.16, 0.40, 0.46), INK * 0.32, smoothstep(0.86, 0.35, lum));
    c = mix(c, lt, mk.r);
  }
  return mix(c, PAPER, uP[1]);
}

void main() {
  vec2 P = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec3 col;
  if (uMode < 0.5) col = mOpen(P);
  else if (uMode < 1.5) col = mRehearse(P);
  else if (uMode < 2.5) col = mTwice(P);
  else if (uMode < 3.5) col = mSides(P);
  else if (uMode < 4.5) col = mDebrief(P);
  else if (uMode < 5.5) col = mLoop(P);
  else col = mTitle(P);
  col += (hash(gl_FragCoord.xy + fract(uTime * 7.0) * 91.0) - 0.5) / 160.0;
  fragColor = vec4(col, 1.0);
}
`;
    </script>

    <script>
      const TB = window.TABLE, T = TB.T, DUR = TB.dur, BEAT = TB.beat, N = TB.n, SH = TB.shots;
      const W = 1920, H = 1080;
      const $ = (s) => document.querySelector(s);
      const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), r = (t, a, b) => cl((t - a) / (b - a)), lerp = (a, b, u) => a + (b - a) * u;
      const E = (n) => gsap.parseEase(n), eOut = E("power3.out"), eIO = E("power3.inOut"), eExpo = E("expo.out"), eExpoIO = E("expo.inOut"), eBack = E("back.out(1.6)"),
        eSine = E("sine.inOut"), eP2 = E("power2.inOut");
      const b = (x) => x * BEAT;
      const INK = "#114353", SAGE = "#6B8A67", CORAL = "#D64550", HAIR = "#DDD8CB", MUTED = "#646C6A", CARD = "#FFFDF8";
      const R = TB.R, SC = R[2] / TB.fw;            // the window, and frame pixels to screen pixels
      const toS = (x, y) => [R[0] + x * SC, R[1] + y * SC];
      const rectS = (q) => [R[0] + q[0] * SC, R[1] + q[1] * SC, q[2] * SC, q[3] * SC];
      const shot = (name, u) => SH[name][0] + cl(u) * (SH[name][1] - 1);
      const envAt = (t) => TB.env[Math.max(0, Math.min(TB.env.length - 1, Math.round(t * 30)))];
      // the two windows of III: rehearsal on the left, live on the right
      const HALF_W = 780, HALF_H = HALF_W * 9 / 16, GAP = 40;
      const RA0 = [W / 2 - GAP / 2 - HALF_W, 230, HALF_W, HALF_H], RB0 = [W / 2 + GAP / 2, 230 + 36, HALF_W, HALF_H];

      function scene(t) {
        const S = { mode: 0, p: new Array(16).fill(0), A: [0, 0, 0, 0], B: [0, 0, 0, 0], Hr: [0, 0, 0, 0] };
        const p = S.p;
        if (t < T.rehearse[0]) {
          S.mode = 0;
          const u = eIO(r(t, TB.sweep[0], TB.sweep[1]));
          p[0] = t < TB.sweep[0] ? R[0] - 40 : lerp(R[0] - 10, R[0] + R[2] + 30, u);
          p[1] = shot("prep", r(t, 0.3, TB.sweep[1]));
          // behind the slit: the brief, paging on through the objections once the slit has passed
          const after = r(t, TB.sweep[1] - 0.6, T.rehearse[0]);
          p[2] = lerp(SH.brief[0], SH.objections[0] + SH.objections[1] - 1.2, eP2(after));
          p[3] = Math.min(5 * (1 - after), SH.objections[0] + SH.objections[1] - 1 - p[2]);
          p[4] = r(t, TB.sweep[0] - 0.2, TB.sweep[0]) * (1 - r(t, TB.sweep[1] - 0.1, TB.sweep[1] + 0.2));
        } else if (t < T.twice[0]) {
          S.mode = 1;
          const u = eIO(r(t, TB.scanIn[0], TB.scanIn[1]));
          p[0] = lerp(R[1] - 10, R[1] + R[3] + 30, u);
          p[1] = SH.objections[0] + SH.objections[1] - 1;
          p[2] = shot("roleplay", r(t, TB.scanIn[0], T.twice[0]));
          p[3] = eOut(r(t, TB.hold, TB.hold + 0.5));
          p[4] = eBack(r(t, TB.hold, TB.hold + 0.7));
          p[5] = r(t, TB.scanIn[1], TB.scanIn[1] + 1.2);
          p[6] = r(t, TB.scanIn[0] - 0.1, TB.scanIn[0]) * (1 - r(t, TB.scanIn[1], TB.scanIn[1] + 0.25));
          p[7] = TB.holdK;
          S.Hr = rectS(TB.bubbleR);
        } else if (t < T.sides[0]) {
          S.mode = 2;
          // the full window splits into two, then the live one sweeps back to full
          const s = eExpoIO(r(t, TB.split[0], TB.split[1]));
          const w = eExpoIO(r(t, TB.sweep2[0], TB.sweep2[1]));
          const A = RA0.map((v, i) => lerp(R[i], v, s));
          const B = RB0.map((v, i) => lerp(R[i], v, s));
          // on the sweep: the live window grows back to the full window, the rehearsal is pushed out to the left
          S.B = B.map((v, i) => lerp(v, R[i], w));
          S.A = [A[0] - w * (A[0] + A[2] + 40), A[1], A[2], A[3]];
          if (s < 0.02) S.A = [0, 0, 0, 0];
          p[0] = TB.holdK;
          // the live call: before the objection, then it lands on the beat, then the help card
          const kl0 = SH.live[0], land = r(t, TB.both - 0.55, TB.both + 0.15);
          p[1] = kl0 + 4 * land + 3 * r(t, TB.help - 0.8, TB.help + 0.6);
          p[2] = s > 0.02 ? S.B[0] - GAP / 2 * (1 - w) : 0;
          p[3] = w * (1 - w) * 4;
          p[4] = 0;
          p[5] = s * (1 - r(t, TB.sweep2[1] - 0.1, TB.sweep2[1] + 0.2));
          p[6] = Math.min(A[1], S.B[1]) - 30; p[7] = Math.max(A[1] + A[3], S.B[1] + S.B[3]) + 30;
        } else if (t < T.debrief[0]) {
          S.mode = 3;
          p[0] = lerp(SH.live[0] + 7, SH.live[0] + SH.live[1] - 1, eSine(r(t, T.sides[0], T.sides[1] - 0.3)));
          const e = envAt(t); p[1] = e[0]; p[2] = e[1];
        } else if (t < T.loop[0]) {
          S.mode = 4;
          const u = eIO(r(t, TB.strip[0], TB.strip[1]));
          p[0] = lerp(R[0] - 10, R[0] + R[2] + 30, u);
          p[1] = SH.live[0] + SH.live[1] - 1;
          p[2] = eExpoIO(r(t, TB.fold[0], TB.fold[1])) * (1 - eExpoIO(r(t, TB.unfold[0], TB.unfold[1])));
          p[3] = eIO(r(t, TB.unfold[0] - 0.1, TB.unfold[1]));
          p[4] = shot("debrief", r(t, TB.unfold[0], TB.dbItems[0][0]));
          p[5] = r(t, TB.strip[0], TB.strip[0] + 0.2) * (1 - r(t, TB.strip[1] - 0.1, TB.strip[1] + 0.2));
        } else if (t < T.title) {
          S.mode = 5;
          p[0] = eExpo(r(t, TB.gate[0], TB.gate[0] + 0.8)) * (1 - eIO(r(t, TB.next, TB.next + 0.5)));
          const tg = Math.max(0, t - TB.gate[0]);
          p[1] = 1.2 * tg + 0.45 * tg * tg;
          p[2] = eIO(r(t, TB.next - 0.2, TB.next + 0.5));
          p[3] = shot("next", r(t, TB.next, T.title));
        } else {
          S.mode = 6;
          p[1] = eIO(r(t, T.mark - 0.35, T.mark + 0.2));
        }
        return S;
      }

      // ---------------- WebGL2
      let gl, P1, U = {}, maskTex, maskC;
      const UNI = ["uSlab", "uMask", "uRes", "uTime", "uMode", "uN", "uP", "uR", "uA", "uB", "uH"];
      function initGL(frames) {
        gl = $("#gl").getContext("webgl2", { antialias: false, alpha: false, depth: false, stencil: false, preserveDrawingBuffer: true });
        const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
        P1 = gl.createProgram();
        gl.attachShader(P1, sh(gl.VERTEX_SHADER, "#version 300 es\nin vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }"));
        gl.attachShader(P1, sh(gl.FRAGMENT_SHADER, FS));
        gl.bindAttribLocation(P1, 0, "p"); gl.linkProgram(P1);
        if (!gl.getProgramParameter(P1, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(P1));
        for (const n of UNI) U[n] = gl.getUniformLocation(P1, n);
        const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
        gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
        const lin = (target) => { gl.texParameteri(target, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(target, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
          gl.texParameteri(target, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(target, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); };
        const fw = frames[0].naturalWidth, fh = frames[0].naturalHeight;
        gl.activeTexture(gl.TEXTURE0); const slab = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D_ARRAY, slab);
        gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.RGBA8, fw, fh, frames.length);
        frames.forEach((im, k) => gl.texSubImage3D(gl.TEXTURE_2D_ARRAY, 0, 0, 0, k, fw, fh, 1, gl.RGBA, gl.UNSIGNED_BYTE, im));
        lin(gl.TEXTURE_2D_ARRAY);
        gl.activeTexture(gl.TEXTURE2); maskTex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, maskTex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, maskC); lin(gl.TEXTURE_2D);
        gl.useProgram(P1);
        gl.uniform1i(U.uSlab, 0); gl.uniform1i(U.uMask, 2);
        gl.uniform2f(U.uRes, W, H); gl.uniform1f(U.uN, N);
        gl.uniform4f(U.uR, ...R);
        gl.viewport(0, 0, W, H);
      }
      function drawGL(S, t) {
        gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, maskTex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, maskC);
        gl.uniform1f(U.uTime, t); gl.uniform1f(U.uMode, S.mode);
        gl.uniform1fv(U.uP, new Float32Array(S.p));
        gl.uniform4f(U.uA, ...S.A); gl.uniform4f(U.uB, ...S.B); gl.uniform4f(U.uH, ...S.Hr);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      }

      // ---------------- the letters the shader fills: red is coverage, green the moment
      let TL = null;
      function titleLetters() {
        if (TL) return TL;
        const g = maskC.getContext("2d"); TL = [];
        const txt = TB.name, font = '500 330px "Fraunces"', track = -6;
        g.font = font; const ws = [...txt].map((ch) => g.measureText(ch).width + track), tot = ws.reduce((a, v) => a + v, 0) - track;
        let x = W / 2 - tot / 2;
        const ks = [SH.prep[0] + 2, SH.brief[0] + 4, SH.roleplay[0] + 2, SH.live[0] + 6, SH.live[0] + 13, SH.debrief[0] + 5];
        [...txt].forEach((ch, k) => { TL.push({ ch, font, x, y: 540, still: ks[k % ks.length] }); x += ws[k]; });
        return TL;
      }
      function maskLetters(t, S) {
        const g = maskC.getContext("2d");
        g.globalCompositeOperation = "source-over"; g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
        if (S.mode !== 6) return;
        const u = r(t, TB.titleType[0], TB.titleType[1]);
        g.textBaseline = "middle"; g.globalCompositeOperation = "lighter";
        titleLetters().forEach((L, k) => {
          const on = eOut(cl(u * 1.4 * 6 - k)); if (on <= 0) return;
          g.font = L.font; g.textAlign = "left";
          g.fillStyle = `rgba(255,${L.still},0,${on})`;
          g.fillText(L.ch, L.x, L.y + 40 * (1 - on));
        });
        g.globalCompositeOperation = "source-over";
      }

      // ---------------- the overlay: hairlines, labels, outlines, meters
      const ov = () => $("#ov").getContext("2d");
      function hair(g, q, a, col = HAIR, lw = 2) { if (a <= 0 || q[2] <= 0) return; g.save(); g.globalAlpha = a; g.strokeStyle = col; g.lineWidth = lw; g.strokeRect(q[0] - 1, q[1] - 1, q[2] + 2, q[3] + 2); g.restore(); }
      function label(g, txt, x, y, col, a, align = "left", size = 15) {
        if (a <= 0) return; g.save(); g.globalAlpha = a; g.font = `500 ${size}px "Plex"`; g.fillStyle = col; g.textAlign = align; g.textBaseline = "middle";
        g.letterSpacing = "0.2em"; g.fillText(txt, x, y); g.restore();
      }
      function chip(g, txt, x, y, col, a, size = 16) {
        if (a <= 0) return;
        g.save(); g.globalAlpha = a; g.font = `500 ${size}px "Plex"`; g.letterSpacing = "0.06em"; const w = g.measureText(txt).width + 30;
        g.fillStyle = CARD; g.strokeStyle = col; g.lineWidth = 2;
        g.beginPath(); g.roundRect(x - w / 2, y - size - 2, w, size * 2 + 4, 6); g.fill(); g.stroke();
        g.fillStyle = col === HAIR ? INK : col; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(txt, x, y + 1); g.restore();
      }
      // an outline that draws itself round a rect
      function trace(g, q, u, col, lw = 2.5, pad = 8) {
        if (u <= 0) return;
        const x = q[0] - pad, y = q[1] - pad, w = q[2] + 2 * pad, h = q[3] + 2 * pad, L = 2 * (w + h);
        g.save(); g.strokeStyle = col; g.lineWidth = lw; g.setLineDash([L * u, L]); g.beginPath(); g.rect(x, y, w, h); g.stroke(); g.restore();
      }
      function overlay(t, S) {
        const g = ov(); g.clearRect(0, 0, W, H);
        const p = S.p;
        if (S.mode === 0 || S.mode === 1 || S.mode === 3 || (S.mode === 4 && p[2] < 0.05 && p[3] <= 0)) hair(g, R, r(t, 0.1, 0.6));
        if (S.mode === 0) {
          // the slit's label
          const a = p[4];
          if (a > 0) label(g, "PREP → BRIEF", Math.min(R[0] + R[2] - 10, p[0] + 14), R[1] + R[3] + 26, INK, a);
          label(g, "BRIEF · TALKING POINTS · OBJECTIONS", R[0] + R[2], R[1] - 26, SAGE, r(t, TB.sweep[1], TB.sweep[1] + 0.3) * (1 - r(t, T.rehearse[0] - 0.3, T.rehearse[0])), "right");
        } else if (S.mode === 1) {
          const ha = p[3];
          if (ha > 0) {
            const q = S.Hr, lift = p[4];
            const Hd = [q[0] - lift * 0.02 * q[2], q[1] - lift * 22 - lift * 0.02 * q[3], q[2] * (1 + 0.04 * lift), q[3] * (1 + 0.04 * lift)];
            trace(g, Hd, eOut(r(t, TB.hold + 0.1, TB.hold + 0.8)), SAGE, 2.5, 6);
            label(g, "HELD · THE CLIENT'S HARD QUESTION, REHEARSED", Hd[0] - 6, Hd[1] - 30, SAGE, r(t, TB.hold + 0.4, TB.hold + 0.8));
            // the app's own feedback, brought up under it
            const fy = R[1] + TB.feedbackY * SC;
            trace(g, [R[0] + 34 * SC, fy - 12, 1180 * SC, 24], eOut(r(t, TB.hold + 1.2, TB.hold + 1.9)), INK, 1.5, 6);
          }
        } else if (S.mode === 2) {
          if (S.A[0] + S.A[2] > 0) hair(g, S.A, 1); hair(g, S.B, 1);
          const la = r(t, TB.split[1] - 0.2, TB.split[1] + 0.2) * (1 - r(t, TB.sweep2[0], TB.sweep2[0] + 0.3));
          if (la > 0 && S.A[2] > 0) {
            label(g, "REHEARSED", S.A[0], S.A[1] - 26, SAGE, la);
            label(g, "LIVE", S.B[0] + 22, S.B[1] - 26, INK, la);
            g.save(); g.globalAlpha = la; g.fillStyle = CORAL; g.beginPath(); g.arc(S.B[0] + 6, S.B[1] - 26, 6, 0, 7); g.fill(); g.restore();
            // the same objection on the same beat, on both sides
            const u = eOut(r(t, TB.both, TB.both + 0.6));
            const qa = TB.bubbleR, qb = TB.liveBubbleR, sa = S.A[2] / TB.fw, sb = S.B[2] / TB.fw;
            trace(g, [S.A[0] + qa[0] * sa, S.A[1] + qa[1] * sa, qa[2] * sa, qa[3] * sa], u, SAGE, 2.5, 5);
            trace(g, [S.B[0] + qb[0] * sb, S.B[1] + qb[1] * sb, qb[2] * sb, qb[3] * sb], u, SAGE, 2.5, 5);
            chip(g, "the same objection · twice", W / 2, S.A[1] + S.A[3] + 70, SAGE, r(t, TB.both + 0.3, TB.both + 0.7));
          }
          // after the sweep: live, and the help from the prep
          const lv = r(t, TB.sweep2[1] - 0.2, TB.sweep2[1] + 0.2);
          if (lv > 0) {
            label(g, "LIVE", R[0] + 22, R[1] - 26, INK, lv);
            g.save(); g.globalAlpha = lv; g.fillStyle = CORAL; g.beginPath(); g.arc(R[0] + 6, R[1] - 26, 6, 0, 7); g.fill(); g.restore();
            trace(g, rectS(TB.helpR), eOut(r(t, TB.help + 0.4, TB.help + 1.1)), SAGE, 2.5, 6);
            label(g, "FROM THE PREP", rectS(TB.helpR)[0], rectS(TB.helpR)[1] + rectS(TB.helpR)[3] + 30, SAGE, r(t, TB.help + 0.8, TB.help + 1.2));
          }
        } else if (S.mode === 3) {
          label(g, "LIVE", R[0] + 22, R[1] - 26, INK, 1);
          g.save(); g.fillStyle = CORAL; g.beginPath(); g.arc(R[0] + 6, R[1] - 26, 6, 0, 7); g.fill(); g.restore();
          // the two sides and their levels
          const e = envAt(t);
          [["THEM", e[0], R[0] + 300], ["YOU", e[1], R[0] + 620]].forEach(([nm, v, x]) => {
            label(g, nm, x, R[1] - 26, v > 0.2 ? INK : MUTED, 1);
            for (let j = 0; j < 6; j++) {
              const hgt = 4 + 18 * cl(v * (0.6 + 0.4 * Math.sin(t * 17 + j * 1.9)) * (1 - Math.abs(j - 2.5) / 4));
              g.fillStyle = v > 0.05 ? SAGE : HAIR; g.fillRect(x + 64 + j * 7, R[1] - 26 - hgt / 2, 4, hgt);
            }
          });
          // talk time: fills to where the debrief says it ended
          const m = eOut(r(t, T.sides[0] + 0.4, T.sides[1] - 0.6));
          const mx = R[0] + R[2] - 470, my = R[1] - 26, mw = 300;
          label(g, "TALK TIME", mx - 18, my, MUTED, 1, "right");
          g.fillStyle = HAIR; g.fillRect(mx, my - 5, mw, 10);
          g.fillStyle = SAGE; g.fillRect(mx, my - 5, mw * TB.talk[0] / 100 * m, 10);
          label(g, `YOU ${Math.round(TB.talk[0] * m)}% · THEM ${Math.round(TB.talk[1] * m)}%`, mx + mw + 16, my, INK, 1);
          const ta = r(t, TB.trans, TB.trans + 0.4);
          if (ta > 0) {
            const q = rectS(TB.arabicR);
            trace(g, q, eOut(r(t, TB.trans, TB.trans + 0.7)), SAGE, 2.5, 6);
            chip(g, TB.transLabel, q[0] + q[2] / 2 + 60, q[1] + q[3] + 60, SAGE, ta);
          }
        } else if (S.mode === 4) {
          const sq = p[2];
          if (sq > 0.05 && p[3] < 0.95) {
            // the strip: the call in order
            const cy = R[1] + R[3] / 2, hh = lerp(R[3] / 2, 64, sq);
            hair(g, [R[0], cy - hh, R[2], 2 * hh], 1);
            const segs = [["PREP", SH.prep[0], SH.roleplay[0]], ["REHEARSAL", SH.roleplay[0], SH.live[0]], ["LIVE", SH.live[0], SH.debrief[0]], ["DEBRIEF", SH.debrief[0], N]];
            const la = r(t, TB.fold[1] - 0.3, TB.fold[1]) * (1 - r(t, TB.unfold[0], TB.unfold[0] + 0.25));
            segs.forEach(([nm, a, z]) => {
              const x0 = R[0] + a / (N - 1) * R[2], x1 = R[0] + Math.min(z - 1, N - 1) / (N - 1) * R[2];
              label(g, nm, (x0 + x1) / 2, cy + hh + 34, nm === "LIVE" ? CORAL : INK, la, "center");
              g.save(); g.globalAlpha = la; g.strokeStyle = INK; g.lineWidth = 1.5; g.beginPath(); g.moveTo(x0 + 4, cy + hh + 14); g.lineTo(x1 - 4, cy + hh + 14); g.stroke(); g.restore();
            });
            label(g, "THE WHOLE CALL · ONE IMAGE", W / 2, cy - hh - 34, SAGE, la, "center");
          }
          if (p[3] > 0.95) {
            hair(g, R, 1);
            label(g, "DEBRIEF", R[0], R[1] - 26, INK, r(t, TB.unfold[1] - 0.2, TB.unfold[1] + 0.2));
            // the debrief's own lines, outlined as they are read (in the last frame of the pan)
            TB.dbItems.forEach(([tk, q, txt], k) => {
              const u = eOut(r(t, tk, tk + 0.6));
              const qs = rectS([q[0], q[1], q[2], q[3]]);
              trace(g, qs, u, SAGE, 2.5, 7);
              label(g, txt.toUpperCase(), R[0] + 1010 * SC, qs[1] + qs[3] / 2, SAGE, r(t, tk + 0.3, tk + 0.6));
            });
            chip(g, "follow-up email · drafted", R[0] + R[2] - 240, R[1] + 120, INK, r(t, TB.email, TB.email + 0.3));
          }
        } else if (S.mode === 5) {
          if (p[2] > 0.5) { hair(g, R, (p[2] - 0.5) * 2); label(g, "NEW PREPARATION", R[0], R[1] - 26, INK, (p[2] - 0.5) * 2); }
        }
      }

      // ---------------- the type
      const HUD = [[0, "before the call"], [T.rehearse[0], "mock session"], [T.twice[0], "the real call"], [T.sides[0], "both sides · transcribed locally"],
        [T.debrief[0], "after the call"], [T.loop[0], "the next one"], [T.title, ""]];
      let lastLn = "", lastRail = "";
      function paint(t) {
        const S = scene(t);
        maskLetters(t, S);
        if (gl) drawGL(S, t);
        overlay(t, S);
        let ln = null; for (const L of TB.lines) if (t >= L[0] && t < L[1]) ln = L;
        const el = $("#ln");
        if (ln) {
          if (ln[2] !== lastLn) { el.innerHTML = ln[2]; lastLn = ln[2]; }
          const u = r(t, ln[0], ln[0] + 0.6);
          el.style.opacity = (u * (1 - r(t, ln[1] - 0.25, ln[1]))).toFixed(3);
          el.style.clipPath = `inset(-20px ${(100 * (1 - eExpo(u))).toFixed(1)}% -20px 0)`;
          el.style.transform = `translateY(${(12 * (1 - eOut(u))).toFixed(1)}px)`;
        } else el.style.opacity = 0;
        let st = HUD[0][1]; for (const [a, s] of HUD) if (t >= a) st = s;
        $("#hud-st").textContent = st;
        let rl = TB.rail[0][1]; for (const [a, s] of TB.rail) if (t >= a) rl = s;
        if (rl !== lastRail) { $("#rail-t").textContent = rl; lastRail = rl; }
        const hudO = r(t, 0.4, 0.9) * (1 - r(t, T.title - 0.2, T.title));
        $("#hud-l").style.opacity = hudO; $("#hud-r").style.opacity = hudO; $("#rail").style.opacity = hudO;
        let fl = 0; for (const c of TB.cuts) if (t >= c && t < c + 0.12) fl = Math.max(fl, 0.35 * (1 - (t - c) / 0.12));
        $("#flash").style.opacity = fl.toFixed(3);
        $("#veil").style.opacity = (1 - eOut(r(t, 0.0, 0.45))).toFixed(3);
        const ca = r(t, T.mark - 0.15, T.mark + 0.1);
        $("#card").style.opacity = ca.toFixed(3);
        const lu = eBack(r(t, T.mark, T.mark + 0.7));
        $("#c-logo").style.transform = `translateY(${(26 * (1 - lu)).toFixed(1)}px) scale(${(0.95 + 0.05 * lu).toFixed(3)})`;
        $("#c-logo").style.opacity = r(t, T.mark, T.mark + 0.35).toFixed(3);
        $("#c-claim").style.opacity = r(t, TB.line - 0.6, TB.line).toFixed(3);
        $("#c-claim").style.transform = `translateY(${(14 * (1 - eOut(r(t, TB.line - 0.6, TB.line)))).toFixed(1)}px)`;
        $("#c-url").textContent = TB.url.slice(0, Math.round(TB.url.length * r(t, TB.line + 0.1, TB.line + 0.7)));
        $("#c-beta").style.opacity = r(t, TB.line + 0.7, TB.line + 1.0).toFixed(3);
      }

      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => paint(clock.t) }, 0);

      async function build() {
        const load = (src) => { const im = new Image(); im.src = src; return im; };
        const frames = Array.from({ length: N }, (_, k) => load(`assets/img/f${String(k + 1).padStart(3, "0")}.jpg`));
        await Promise.all([...frames.map((im) => im.decode()), $("#c-logo").decode(),
          document.fonts.load('500 40px "Fraunces"'), document.fonts.load('italic 500 40px "Fraunces"'),
          document.fonts.load('500 20px "Plex"'), document.fonts.load('400 20px "Plex"'), document.fonts.load('500 20px "Instrument"')]);
        $("#c-claim").innerHTML = "Every big conversation, <em>rehearsed</em> before it happens.";
        $("#c-beta").textContent = TB.beta;
        maskC = document.createElement("canvas"); maskC.width = W; maskC.height = H;
        initGL(frames);
        window.addEventListener("hf-seek", (ev) => paint(ev.detail.time));
        paint(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
      }
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["twice"] = build();
    </script>
