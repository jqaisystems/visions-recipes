    <!--
      R25 · First Line. 32 s, cel-shaded anime in Three.js (WebGPURenderer, WebGL2 backend, TSL), season 1, film 3.
      For joaoqueiros.com, a brand identity studio whose mark is a JQ drawn as four parallel strokes. Every identity
      starts as one line: a blank sheet at night by a window over the Douro, one pencil line, roughs piling up, a flip
      book of roughs, the four strokes drawing themselves and lifting off the paper, then the cut moves through the
      anime pipeline: blue pencil, clean ink, cel colour. Manga panels of a generic identity's applications, the
      strokes flying out over Porto at dawn, the figures, the official logo, flat.
      New in this film: every frame of the 3D world can be rendered twice, once in cel colour and once as pure line
      art, and the two are composited in 2D as a boiling blue-pencil pass, a clean ink pass or full colour, with wipes
      between them. The clock is one baked table (assets/table.js, from bake/table.py); score/compose.py reads it too.
    -->
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/table.js"></script>
    <script type="importmap">
      { "imports": { "three": "./assets/vendor/three.webgpu.js", "three/webgpu": "./assets/vendor/three.webgpu.js", "three/tsl": "./assets/vendor/three.tsl.js" } }

    <script type="module">
      import * as THREE from "three/webgpu";
      import { toonOutlinePass, screenUV, screenSize, vec2, vec3, vec4, float, dot, fract, length, step, mix, clamp, max, normalView, positionViewDirection, positionGeometry, output, diffuseColor } from "three/tsl";

      const W = 1920, H = 1080, PORTRAIT = H > W, SS = Math.min(W, H) / 1080;
      const TB = window.TABLE, T = TB.T, FPS = TB.fps, DUR = TB.dur, BEAT = TB.beat;
      const SMEAR = new Set(TB.smears);
      const cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
      const r = (t, a, b) => cl((t - a) / (b - a));
      const lerp = (a, b, u) => a + (b - a) * u;
      const E = (n) => gsap.parseEase(n);
      const eOut = E("power3.out"), eIO = E("power2.inOut"), eIn = E("power2.in"), eBack = E("back.out(2.2)"), eExpo = E("expo.out");
      const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
      const TAU = Math.PI * 2;
      const frameOf = (t) => Math.round(t * FPS + 1e-6);
      const twos = (t) => Math.floor(t * 12 + 1e-6) / 12;                 // the drawings change 12 times a second
      const TEAL = "#00a79d", CYAN = "#0095da", JQB = "#0d1114", PAPER = "#f4efe4", INK = "#0b0d10", GRAPHITE = "#4d525c", BLUEP = "#2a5fd0";
      const C = (h) => new THREE.Color(h);
      const mixC = (a, b, u) => a.clone().lerp(b, cl(u));
      const impactAt = (t) => { const f = frameOf(t); for (const d of TB.impacts) { const f0 = frameOf(d.t); if (f >= f0 && f < f0 + d.n) return f - f0; } return -1; };
      const shakeAt = (t) => { let s = 0; for (const d of TB.impacts) { const u = (t - d.t) / 0.32; if (u >= 0 && u < 1) s = Math.max(s, (1 - u) * (1 - u)); } return s; };
      const scene_ = (t) => t < T.sketch[0] ? "brief" : t < T.ink[0] ? "sketch" : t < T.system[0] ? "ink" : t < T.world[0] ? "system" : t < T.title ? "world" : "title";
      const WIPE = 0.5;
      // which pass the frame is in: before a wipe, the previous one; during a wipe, both
      function passAt(t) {
        let from = "colour", to = null, p = 0;
        for (const w of TB.wipes) { if (t >= w.t + WIPE) from = w.to; else if (t >= w.t) { to = w.to; p = eIO(r(t, w.t, w.t + WIPE)); } }
        if (t >= T.system[0]) { from = "colour"; to = null; }
        return { from, to, p };
      }

      // ================= the four strokes of the mark: centrelines traced from the official symbol =================
      // symbol coordinates (530.42 x 530.18, y down); every stroke is a band 50.55 wide around these lines
      const ARC = (cx, cy, rr, a0, a1, n = 28) => Array.from({ length: n + 1 }, (_, i) => { const a = (lerp(a0, a1, i / n) * Math.PI) / 180; return [cx + rr * Math.cos(a), cy + rr * Math.sin(a)]; });
      const STROKES = [
        { pts: [[25.27, 140.28], [25.27, 25.27], ...ARC(358.42, 172, 146.73, -90, 0), [505.15, 530.18]], x0: 0, x1: 530.42 },
        { pts: [[352.82, 504.9], ...ARC(172.24, 358.18, 146.72, 90, 180)], x0: 0.24, x1: 352.82 },
        { pts: [[0, 303.33], [114.3, 303.33], ...ARC(172.24, 358.18, 57.94, 180, 90)], x0: 0, x1: 352.82, tail: [352.82, 416.1] },
        { pts: [[86.16, 114.08], ...ARC(358.42, 172, 57.92, -90, 0), [416.34, 530.18]], x0: 86.16, x1: 441.61 },
      ];
      STROKES[2].pts.push(STROKES[2].tail);
      const BAND = 50.55, MS = 0.0087, MCX = 265.21, MH = 530.18;           // the mark is 4.6 units across

      // ================= the 2D layers =================
      const comp = document.querySelector("#comp").getContext("2d");
      const fx = document.querySelector("#fx").getContext("2d");
      const mk = (w = W, h = H) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return [c, c.getContext("2d")]; };
      const [cA, gA] = mk(), [cB, gB] = mk(), [cBl, gBl] = mk(), [cP, gP] = mk();
      const [cGrain, gGrain] = mk(256, 256);
      { const id = gGrain.createImageData(256, 256); for (let i = 0; i < 256 * 256; i++) { const v = 222 + 33 * hash(i * 0.731 + 5); id.data[i * 4] = v; id.data[i * 4 + 1] = v; id.data[i * 4 + 2] = v - 6; id.data[i * 4 + 3] = 255; } gGrain.putImageData(id, 0, 0); }
      function speedLines(g, t, cx, cy, n, r0, r1, col, seed) {
        const k = Math.floor(t * 15); g.fillStyle = col;
        for (let i = 0; i < n; i++) {
          const a = hash(i * 3.1 + seed + k * 0.37) * TAU, a0 = r0 + 220 * hash(i + k * 1.7 + seed), a1 = a0 + r1 * (0.5 + hash(i * 7 + k)), w = 1.5 + 6 * hash(i * 11 + k + seed);
          const ca = Math.cos(a), sa = Math.sin(a);
          g.beginPath(); g.moveTo(cx + ca * a0, cy + sa * a0); g.lineTo(cx + ca * a1 - sa * w, cy + sa * a1 + ca * w); g.lineTo(cx + ca * a1 + sa * w, cy + sa * a1 - ca * w); g.fill();
        }
      }
      function inkText(g, s, x, y, font, fill, stroke = INK, lw = 8, sh = 0) {
        g.font = font; g.lineJoin = "round";
        if (sh) { g.fillStyle = stroke; g.fillText(s, x + sh, y + sh); }
        g.lineWidth = lw; g.strokeStyle = stroke; g.strokeText(s, x, y); g.fillStyle = fill; g.fillText(s, x, y);
      }
      // a pencil line: drawn twice, a hair apart, the way a quick hand goes over a line
      function pencilPath(g, pts, u, col, w, seed, wob = 1) {
        if (u <= 0 || pts.length < 2) return;
        let L = 0; const seg = []; for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); L += d; }
        const lim = L * u;
        for (let pass = 0; pass < 2; pass++) {
          g.strokeStyle = col; g.lineWidth = w * (pass ? 0.6 : 1); g.globalAlpha = pass ? 0.55 : 0.9; g.lineCap = "round"; g.lineJoin = "round";
          g.beginPath(); let acc = 0;
          for (let i = 0; i < pts.length; i++) {
            const j = (k) => (hash(seed * 7 + i * 1.3 + k + pass * 17) - 0.5) * 2.4 * wob * (pass ? 1.8 : 1);
            if (i === 0) { g.moveTo(pts[0][0] + j(1), pts[0][1] + j(2)); continue; }
            if (acc + seg[i - 1] >= lim) { const f = (lim - acc) / seg[i - 1]; g.lineTo(lerp(pts[i - 1][0], pts[i][0], f), lerp(pts[i - 1][1], pts[i][1], f)); break; }
            acc += seg[i - 1]; g.lineTo(pts[i][0] + j(1), pts[i][1] + j(2));
          }
          g.stroke();
        }
        g.globalAlpha = 1;
      }
      const pointAlong = (pts, u) => { let L = 0; const seg = []; for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); L += d; }
        let lim = L * cl(u), acc = 0; for (let i = 1; i < pts.length; i++) { if (acc + seg[i - 1] >= lim) { const f = seg[i - 1] ? (lim - acc) / seg[i - 1] : 0; return [lerp(pts[i - 1][0], pts[i][0], f), lerp(pts[i - 1][1], pts[i][1], f)]; } acc += seg[i - 1]; } return pts[pts.length - 1]; };
      // the roughs: abstract marks, never anyone's logo; nine kinds, each a few strokes with its construction lines
      const circ = (cx, cy, rr, a0 = 0, a1 = TAU, n = 40) => Array.from({ length: n + 1 }, (_, i) => { const a = lerp(a0, a1, i / n); return [cx + rr * Math.cos(a), cy + rr * Math.sin(a)]; });
      function roughShapes(kind) {   // strokes in a -1..1 box
        const S = [];
        if (kind === 0) { S.push(circ(0, 0, 0.8)); S.push([[0.2, -0.9], [0.2, 0.3], ...circ(-0.15, 0.3, 0.35, 0, Math.PI, 12)]); }
        if (kind === 1) for (let k = 0; k < 3; k++) S.push([[-0.8 + k * 0.3, -0.8], [-0.8 + k * 0.3, 0.6 - k * 0.3], [0.8, 0.6 - k * 0.3]]);
        if (kind === 2) S.push([[-0.8, 0.8], [-0.8, -0.8], [0.8, -0.8], [0.8, 0.6], [-0.5, 0.6], [-0.5, -0.5], [0.5, -0.5], [0.5, 0.3], [-0.2, 0.3]]);
        if (kind === 3) { S.push(circ(0, -0.1, 0.65)); S.push([[0.25, 0.3], [0.85, 0.9]]); }
        if (kind === 4) for (let k = 0; k < 2; k++) S.push([[0.5 - k * 0.3, -0.85], [0.5 - k * 0.3, 0.25], ...circ(0.05 - k * 0.15, 0.25, 0.45 - k * 0.15, 0, Math.PI, 12)]);
        if (kind === 5) for (let k = 0; k < 3; k++) S.push(circ(0, 0.4, 0.4 + k * 0.25, Math.PI, TAU, 18));
        if (kind === 6) { S.push(circ(-0.3, 0, 0.5)); S.push(circ(0.3, 0, 0.5)); }
        if (kind === 7) { S.push([[-0.7, -0.6], [0.7, -0.6], [0.7, 0.7]]); S.push([[-0.7, 0.1], [0.2, 0.1], [0.2, 0.7]]); S.push([[-0.7, 0.7], [-0.3, 0.7]]); }
        if (kind === 8) for (let k = 0; k < 4; k++) { const o = k * 0.22; S.push([[-0.85 + o, 0.3 - o], [-0.85 + o, -0.85 + o], [0.4, -0.85 + o], ...circ(0.4, -0.35 + o * 0.0, 0.5 - o, -Math.PI / 2, 0, 8), [0.9 - o, 0.9]]); }
        return S;
      }
      function rough(g, cx, cy, sz, kind, u, seed, col = GRAPHITE, w = 3) {
        const S = roughShapes(kind);
        // construction lines first, lighter: a box and a centre cross
        g.globalAlpha = 0.35 * r(u, 0, 0.2); g.strokeStyle = col; g.lineWidth = 1.2;
        g.strokeRect(cx - sz, cy - sz, sz * 2, sz * 2); g.beginPath(); g.moveTo(cx - sz * 1.1, cy); g.lineTo(cx + sz * 1.1, cy); g.moveTo(cx, cy - sz * 1.1); g.lineTo(cx, cy + sz * 1.1); g.stroke(); g.globalAlpha = 1;
        S.forEach((pts, k) => { const a = k / S.length, b = (k + 1) / S.length; pencilPath(g, pts.map(([x, y]) => [cx + x * sz, cy + y * sz]), r(u, 0.15 + a * 0.85, 0.15 + b * 0.85), col, w, seed + k * 13); });
      }
      // animation paper: pegs at the top, a field guide, a cut box
      function paperBase(g, w, h, cut) {
        g.fillStyle = PAPER; g.fillRect(0, 0, w, h);
        g.strokeStyle = "rgba(11,13,16,0.85)"; g.lineWidth = 6; g.strokeRect(3, 3, w - 6, h - 6);
        g.fillStyle = "#2a2d33"; g.beginPath(); g.arc(w / 2, 34, 15, 0, TAU); g.fill();
        for (const s of [-1, 1]) { g.beginPath(); g.roundRect(w / 2 + s * 330 - 46, 26, 92, 16, 8); g.fill(); }
        g.strokeStyle = "rgba(63,120,200,0.45)"; g.lineWidth = 2; g.strokeRect(70, 80, w - 140, h - 150);
        g.font = '500 26px "IBM Plex Mono"'; g.fillStyle = "rgba(63,120,200,0.8)"; g.textAlign = "right"; g.textBaseline = "alphabetic"; g.fillText(cut, w - 84, 120);
      }

      // ================= DOM painter =================
      const $ = (s) => document.querySelector(s);
      const STS = [[$("#st-0"), 0.9, 3.25], [$("#st-1"), 5.0, 8.3], [$("#st-2"), 16.55, 17.95]];
      const STATE = [[0, "cut 01 · layout"], [T.sketch[0], "cut 02 · roughs"], [TB.strokes[0][0], "cut 03 · key drawings"], [TB.wipes[1].t, "cut 04 · clean-up"],
        [TB.wipes[2].t, "cut 05 · ink and paint"], [T.system[0], "cut 06 · applications"], [T.world[0], "cut 07 · composite"], [T.title, "joaoqueiros.com"]];
      const URL_TEXT = "joaoqueiros.com";
      let glRender = null;
      function paint(t) {
        if (glRender) glRender(t);
        const im = impactAt(t);
        $("#ct-stage").style.filter = im >= 0 ? (im % 2 ? "grayscale(1) contrast(9)" : "invert(1) grayscale(1) contrast(9)") : "none";
        const sh = shakeAt(t), f = frameOf(t);
        $("#ct-stage").style.transform = sh > 0 ? `translate(${((hash(f) - 0.5) * 34 * sh).toFixed(1)}px, ${((hash(f + 9) - 0.5) * 34 * sh).toFixed(1)}px) scale(1.03)` : "none";
        const hudO = r(t, 0.5, 0.9) * (1 - r(t, T.title, T.title + 0.3));
        $("#hud-l").style.opacity = hudO; $("#hud-r").style.opacity = hudO;
        let st = STATE[0][1]; for (const [a, s] of STATE) if (t >= a) st = s;
        $("#hud-st").textContent = st;
        STS.forEach(([el, t0, t1]) => {
          const a = r(t, t0, t0 + 0.25), b = r(t, t1, t1 + 0.2), on = t >= t0 && t < t1 + 0.2;
          el.style.opacity = on ? 1 : 0;
          el.style.transform = `translateX(${(-260 * (1 - eExpo(a)) - 400 * eIn(b)).toFixed(1)}px) skewX(${(-12 * (1 - eExpo(a))).toFixed(1)}deg)`;
        });
        // the lockup: the official file, flat
        const tu = T.title + 0.6;
        $("#title").style.opacity = r(t, T.title, T.title + 0.45);
        const lw = eExpo(r(t, tu, tu + 0.8));
        $("#t-logo").style.clipPath = `inset(0 ${(100 * (1 - lw)).toFixed(1)}% 0 0)`;
        $("#t-logo").style.transform = `translateX(${(-40 * (1 - lw)).toFixed(1)}px)`;
        const lu = r(t, tu + 0.7, tu + 1.3); $("#t-line").style.opacity = lu; $("#t-line").style.transform = `translateY(${(20 * (1 - eOut(lu))).toFixed(1)}px)`;
        $("#t-url").textContent = URL_TEXT.slice(0, Math.round(URL_TEXT.length * r(t, tu + 1.2, tu + 1.9)));
        $("#t-rule").style.transform = `scaleX(${E("expo.inOut")(r(t, tu + 1.8, tu + 2.5)).toFixed(3)})`;
        $("#t-note").style.opacity = r(t, tu + 2.3, tu + 2.8);
      }
      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => paint(clock.t) }, 0);

      // ================= the 3D film =================
      async function build() {
        await Promise.all([document.fonts.load('800 96px "Montserrat"'), document.fonts.load('900 200px "Montserrat"'), document.fonts.load('500 40px "Montserrat"'),
          document.fonts.load('700 40px "Montserrat"'), document.fonts.load('500 20px "IBM Plex Mono"'), document.fonts.load('400 20px "IBM Plex Mono"')]);
        const canvas = $("#ct-gl");
        const gl = canvas.getContext("webgl2", { antialias: true, alpha: false, depth: true, stencil: false, preserveDrawingBuffer: true });
        const getExt = gl.getExtension.bind(gl), getSup = gl.getSupportedExtensions.bind(gl);
        gl.getExtension = (name) => (name === "KHR_parallel_shader_compile" ? null : getExt(name));
        gl.getSupportedExtensions = () => getSup().filter((n) => n !== "KHR_parallel_shader_compile");
        const renderer = new THREE.WebGPURenderer({ canvas, context: gl, antialias: true, forceWebGL: true });
        renderer.setPixelRatio(1); renderer.setSize(W, H, false);
        renderer.toneMapping = THREE.NoToneMapping;
        renderer.shadowMap.enabled = true;
        await renderer.init();
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(34, W / H, 0.05, 4000);
