<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <!--
      R35 · Pop-Up. 33.4 s at 88 bpm, paper cut-out stop motion, a pop-up book (season 4, film 4). For the AI Brief
      Generator, João's internal tool that turns a client intake form into a structured creative brief. A brief as a
      book that builds itself: an intake form and the optional call notes slide in under a closed book, the cover
      opens and two vague answers are pulled through a slot and come out as concrete attributes, the system's seven
      sections fan out as tabs, then each spread pops up: three personas on a box fold, a tone scale and a skyline of
      three unnamed competitors with the gap between them, a fan of swatches and the deliverables standing up line by
      line, a ? flap over two questions for a person. A red pencil edits the summary, a stamp says reviewed, and the
      book closes, folds flat into a PDF and goes into an envelope. The JQ AI SYSTEMS logo lands.
      The client, the answers and everything in the brief are an illustrative sample; the section template is the
      system's own.
      Technique: the R34 paper engine on one Canvas 2D, in 3D. The table is seen from the front and above, orthographic,
      so every flat piece on any plane (a page at any angle, a card standing on its hinge, a flap) is one affine
      setTransform and keeps its torn edge, its paper stock and its print. Leaves turn about the spine; a spread's
      pop-ups rise as its leaf lands and fold as the next one lifts. Time is snapped to 12 poses a second and every
      pose re-cuts each edge a little. paint(t) draws every frame from one baked table (assets/table.js, from
      bake/table.py); score/compose.py reads it too.
    -->
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/table.js"></script>

      #t-line { position: absolute; left: 0; right: 0; top: 632px; text-align: center; font: italic 400 38px "Instrument Serif", serif; color: #cbbfab; white-space: nowrap; opacity: 0; }
      #t-url { position: absolute; left: 0; right: 0; top: 708px; height: 40px; text-align: center; font: 500 30px "JBM", monospace; color: #dda04a; white-space: nowrap; }

  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="33.4091" data-width="1920" data-height="1080">
      <div id="ct-stage" class="clip" data-start="0" data-duration="33.4091" data-track-index="0">
        <canvas id="cv" width="1920" height="1080" data-layout-allow-overflow></canvas>
      </div>
      <div id="ct-ui" class="clip" data-start="0" data-duration="33.4091" data-track-index="1">
        <div class="hud" id="hud-l" data-layout-allow-occlusion>JQ AI SYSTEMS <span>· ai brief generator</span></div>
        <div class="hud" id="hud-r" data-layout-allow-occlusion><span id="hud-st">01 intake</span></div>

          <img id="t-logo" src="assets/brand/jqai-logo.png" alt="JQ AI SYSTEMS">
          <div id="t-name">AI Brief Generator</div>
          <div id="t-line">Intake form in, full brief out.</div>
          <div id="t-url"></div>
        </div>
      </div>
      <audio id="score" src="assets/bgm/score.wav" data-start="0" data-duration="33.4091" data-track-index="7" data-volume="0.8"></audio>
    </div>

    <script>
      const TB = window.TABLE, T = TB.T, E = TB.E, DUR = TB.dur, BEAT = TB.beat, PZ = TB.poses;
      const W = 1920, H = 1080;
      const URL_TEXT = "ai.joaoqueiros.com/systems/ai-brief-generator";
      const $ = (s) => document.querySelector(s);
      const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const r = (t, a, b) => cl((t - a) / (b - a));
      const lerp = (a, b, u) => a + (b - a) * u;
      const eOut = (u) => 1 - Math.pow(1 - u, 3), eIn = (u) => u * u * u, eIO = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
      const eBack = (u) => { const c = 1.6, c3 = c + 1; return 1 + c3 * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
      function hash(n) { const s = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); }
      function vnoise(x, seed) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i + seed * 57.31), hash(i + 1 + seed * 57.31), u) * 2 - 1; }
      function prng(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

      let ctx, POSE = 0, LS = 1;
      const CAM = { x: 0, y: 0, s: 1 };

      // ---------------------------------------------------------------- paper stocks, made once from noise
      const STOCK = { linen: "#a7ad9a", linenD: "#8a907d", ivory: "#f4eedf", cream: "#efe2c8", white: "#faf7f0", news: "#e8e2d4", ink: "#1d1a1f",
        terra: "#c4553b", terraD: "#8f3a28", teal: "#2f6f73", tealD: "#1f4c50", ochre: "#dda04a", kraft: "#c9a77a", red: "#b8322b",
        sage: "#8fae96", sky: "#9cc3c9", rose: "#e3a59a", gold: "#c9a24f", amber: "#e8a948" };
      const DARK = new Set(["terraD", "teal", "tealD", "ink", "linenD"]);
      const PAT = {};
      function makeStocks() {
        Object.entries(STOCK).forEach(([k, base], si) => {
          const c = document.createElement("canvas"); c.width = c.height = 512;
          const g = c.getContext("2d"), R = prng(3000 + si * 7919);
          g.fillStyle = base; g.fillRect(0, 0, 512, 512);
          const dark = DARK.has(k), dk = dark ? 0.06 : 0.035, lt = dark ? 0.03 : 0.045;
          const wrapDraw = (fn) => { for (const ox of [-512, 0, 512]) for (const oy of [-512, 0, 512]) fn(ox, oy); };
          for (let i = 0; i < 110; i++) {
            const x = R() * 512, y = R() * 512, rad = 20 + R() * 80, d = R() < 0.5;
            wrapDraw((ox, oy) => { const gr = g.createRadialGradient(x + ox, y + oy, 0, x + ox, y + oy, rad);
              gr.addColorStop(0, d ? `rgba(0,0,0,${dk})` : `rgba(255,255,255,${lt})`); gr.addColorStop(1, "rgba(0,0,0,0)");
              g.fillStyle = gr; g.fillRect(x + ox - rad, y + oy - rad, rad * 2, rad * 2); });
          }
          // linen is a weave of longer fibres; kraft has a grain running one way
          const grain = k === "kraft", fibres = k.startsWith("linen") ? 2600 : 1500;
          g.lineWidth = 0.8;
          for (let i = 0; i < fibres; i++) {
            const x = R() * 512, y = R() * 512, a = grain ? (R() - 0.5) * 0.12 : R() * Math.PI, l = grain ? 40 + R() * 100 : k.startsWith("linen") ? 10 + R() * 22 : 4 + R() * 16;
            const dk2 = R() < 0.55, al = (dk2 ? 0.07 : 0.11) * R();
            g.strokeStyle = dk2 ? `rgba(0,0,0,${al})` : `rgba(255,255,255,${al})`;
            wrapDraw((ox, oy) => { if (Math.abs(ox) + Math.abs(oy) && (x > 120 && x < 392 && y > 24 && y < 488)) return;
              g.beginPath(); g.moveTo(x + ox, y + oy); g.quadraticCurveTo(x + ox + Math.cos(a + 0.7) * l * 0.5, y + oy + Math.sin(a + 0.7) * l * 0.5, x + ox + Math.cos(a) * l, y + oy + Math.sin(a) * l); g.stroke(); });
          }
          for (let i = 0; i < 700; i++) { g.fillStyle = `rgba(0,0,0,${0.1 * R()})`; g.fillRect(R() * 512, R() * 512, 1.2, 1.2); }
          PAT[k] = ctx.createPattern(c, "repeat");
        });
      }
      let GRAIN, LIGHT;
      function makePost() {
        GRAIN = document.createElement("canvas"); GRAIN.width = GRAIN.height = 256;
        const g = GRAIN.getContext("2d"), im = g.createImageData(256, 256), R = prng(91);
        for (let i = 0; i < 256 * 256; i++) { const v = 100 + R() * 56; im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = 255; }
        g.putImageData(im, 0, 0);
        LIGHT = document.createElement("canvas"); LIGHT.width = W; LIGHT.height = H;
        const l = LIGHT.getContext("2d");
        const gr = l.createRadialGradient(960, 520, 200, 960, 560, 1150);
        gr.addColorStop(0, "rgba(0, 0, 0, 0)"); gr.addColorStop(0.6, "rgba(40, 30, 20, 0.08)"); gr.addColorStop(1, "rgba(40, 30, 20, 0.42)");
        l.fillStyle = gr; l.fillRect(0, 0, W, H);
      }

      // ---------------------------------------------------------------- cut paper
      const SH = new Map();
      function resample(poly, step) {
        const pts = [];
        for (let i = 0; i < poly.length; i++) {
          const [x0, y0] = poly[i], [x1, y1] = poly[(i + 1) % poly.length];
          const n = Math.max(1, Math.round(Math.hypot(x1 - x0, y1 - y0) / step));
          for (let k = 0; k < n; k++) pts.push([x0 + ((x1 - x0) * k) / n, y0 + ((y1 - y0) * k) / n]);
        }
        return pts;
      }
      function shape(key, make, step) {
        let s = SH.get(key);
        if (s) return s;
        const pts = resample(make(), step), n = pts.length, nrm = [];
        for (let i = 0; i < n; i++) { const a = pts[(i - 1 + n) % n], b = pts[(i + 1) % n]; const nx = b[1] - a[1], ny = -(b[0] - a[0]), l = Math.hypot(nx, ny) || 1; nrm.push([nx / l, ny / l]); }
        s = { pts, nrm }; SH.set(key, s); return s;
      }
      const RECT = (w, h) => () => [[-w / 2, -h / 2], [w / 2, -h / 2], [w / 2, h / 2], [-w / 2, h / 2]];
      const CIRC = (rx, ry = rx, n = 36) => () => Array.from({ length: n }, (_, i) => [rx * Math.cos((i / n) * 2 * Math.PI), ry * Math.sin((i / n) * 2 * Math.PI)]);
      const ARC = (r0, r1, a0, a1, n = 18) => () => [...Array.from({ length: n + 1 }, (_, i) => { const a = lerp(a0, a1, i / n); return [r1 * Math.cos(a), r1 * Math.sin(a)]; }),
        ...Array.from({ length: n + 1 }, (_, i) => { const a = lerp(a1, a0, i / n); return [r0 * Math.cos(a), r0 * Math.sin(a)]; })];
      function fillStock(path, stock, seed) {
        const p = PAT[stock];
        p.setTransform(new DOMMatrix().translate(hash(seed) * 512, hash(seed + 1.3) * 512));
        ctx.fillStyle = p; ctx.fill(path);
      }
      // one piece of paper: a torn outline, a stock, a shadow from its height, light coming through it, and what is printed on it
      function piece(P) {
        const S = shape(P.key, P.make, P.step || 12), n = S.pts.length, tear = P.tear ?? 1.3, seed = P.seed ?? 1;
        const path = new Path2D();
        for (let i = 0; i < n; i++) {
          const p = S.pts[i], q = S.nrm[i];
          const d = tear * vnoise(i * 0.55, seed) + 0.55 * (hash(i * 3.17 + seed * 11.3 + POSE * 0.731) - 0.5);
          const x = p[0] + q[0] * d, y = p[1] + q[1] * d;
          i ? path.lineTo(x, y) : path.moveTo(x, y);
        }
        path.closePath();
        const jx = (hash(seed * 7.7 + POSE * 1.37) - 0.5) * 1.0, jy = (hash(seed * 3.3 + POSE * 2.11) - 0.5) * 1.0, jr = (hash(seed * 5.1 + POSE * 0.77) - 0.5) * 0.004;
        ctx.save();
        ctx.translate(P.x + jx, P.y + jy); ctx.rotate((P.rot || 0) + jr);
        const s = P.s ?? 1; ctx.scale(s * (P.sx ?? 1), s * (P.sy ?? 1));
        if (P.alpha !== undefined) ctx.globalAlpha *= P.alpha;
        const h = P.h ?? 0.6;
        if (h > 0) {
          ctx.shadowColor = `rgba(40, 30, 18, ${(0.42 - 0.04 * Math.min(h, 4)).toFixed(3)})`;
          ctx.shadowBlur = (2 + h * 8) * LS; ctx.shadowOffsetX = (1 + h * 4) * LS; ctx.shadowOffsetY = (2 + h * 6) * LS;
        }
        fillStock(path, P.stock, seed);
        ctx.shadowColor = "transparent";
        if (P.content) { ctx.save(); ctx.clip(path); P.content(); ctx.restore(); }
        // backlight: where a light sits behind translucent paper, the paper glows
        if (P.glow > 0) {
          ctx.save(); ctx.clip(path); ctx.globalCompositeOperation = "screen";
          const R0 = P.gr || 300, g = ctx.createRadialGradient(P.gx || 0, P.gy || 0, 0, P.gx || 0, P.gy || 0, R0);
          g.addColorStop(0, `rgba(${P.gc || "255,214,140"},${(0.85 * P.glow).toFixed(3)})`); g.addColorStop(1, `rgba(${P.gc || "255,214,140"},0)`);
          ctx.fillStyle = g; ctx.fillRect(-R0 * 3, -R0 * 3, R0 * 6, R0 * 6); ctx.restore();
        }
        ctx.lineWidth = 1.5 / Math.max(0.2, s); ctx.strokeStyle = P.edge || "rgba(255, 248, 236, 0.28)"; ctx.stroke(path);
        ctx.restore();
      }
      function txt(s, x, y, font, col, align = "center") { ctx.font = font; ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = "middle"; ctx.fillText(s, x, y); }
      function graphite(pts, col = "rgba(242, 233, 216, 0.8)", w = 2.2, seed = 1) {
        ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = "round"; ctx.lineJoin = "round";
        for (let pass = 0; pass < 2; pass++) {
          ctx.beginPath();
          pts.forEach(([x, y], i) => { const dx = (hash(seed + i * 3.1 + pass * 7 + POSE * 0.37) - 0.5) * 1.6, dy = (hash(seed + i * 5.7 + pass * 3 + POSE * 0.53) - 0.5) * 1.6; i ? ctx.lineTo(x + dx, y + dy) : ctx.moveTo(x + dx, y + dy); });
          ctx.globalAlpha = pass ? 0.45 : 1; ctx.stroke();
        }
        ctx.restore();
      }
      // light added on top: a soft cone from a point, as a lamp or a lens throws it
      function cone(x0, y0, x1, y1, w0, w1, col, a) {
        if (a <= 0) return;
        const nx = -(y1 - y0), ny = x1 - x0, l = Math.hypot(nx, ny) || 1, ux = nx / l, uy = ny / l;
        ctx.save(); ctx.globalCompositeOperation = "lighter";
        const g = ctx.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, `rgba(${col},${a.toFixed(3)})`); g.addColorStop(1, `rgba(${col},0)`);
        ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x0 + ux * w0, y0 + uy * w0); ctx.lineTo(x1 + ux * w1, y1 + uy * w1); ctx.lineTo(x1 - ux * w1, y1 - uy * w1); ctx.lineTo(x0 - ux * w0, y0 - uy * w0); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      function glowAt(x, y, rad, col, a, mode = "screen") {
        if (a <= 0) return;
        ctx.save(); ctx.globalCompositeOperation = mode;
        const g = ctx.createRadialGradient(x, y, 0, x, y, rad); g.addColorStop(0, `rgba(${col},${a.toFixed(3)})`); g.addColorStop(1, `rgba(${col},0)`);
        ctx.fillStyle = g; ctx.fillRect(x - rad, y - rad, rad * 2, rad * 2); ctx.restore();
      }

      // ---------------------------------------------------------------- type: every word on its own strip of paper
      const WC = new Map();
      function wordW(text, font) { const k = font + "|" + text; if (!WC.has(k)) { ctx.font = font; WC.set(k, ctx.measureText(text).width); } return WC.get(k); }
      function layLines() {
        TB.lines.forEach((L, i) => {
          const big = !!L.big, fs = big ? 128 : 74, fa = big ? 152 : 90;
          const words = L.words.map((w, k) => {
            const acc = k === L.accent, font = acc ? `italic 400 ${fa}px "Instrument Serif"` : `800 ${fs}px "Archivo"`;
            return { text: w, font, acc, w: wordW(w, font) + (big ? 46 : 32), h: fs * 1.24 };
          });
          const gap = big ? 18 : 12, total = words.reduce((s, w) => s + w.w, 0) + gap * (words.length - 1);
          let x = L.at[0] === 0 ? 960 - total / 2 : L.at[0];
          L.lay = words.map((w, k) => {
            const sd = 300 + i * 20 + k, ink = !w.acc && k % 2 === 1;
            const o = { ...w, key: `w${i}_${k}`, x: x + w.w / 2, y: L.at[1] + (hash(sd) - 0.5) * 14, rot: (hash(sd * 1.7) - 0.5) * 0.07, seed: sd,
              stock: w.acc ? "amber" : ink ? "ink" : "news", col: ink ? "#f6efe2" : "#1d1a1f", dy: w.acc ? fs * 0.02 : fs * 0.05 };
            x += w.w + gap; return o;
          });
        });
      }
      function drawLine(L, t) {
        if (t < L.t || t > L.out + 1.4) return;
        const n = L.lay.length;
        L.lay.forEach((w, k) => {
          const ti = L.t + k * 0.16, to = L.out + (n - 1 - k) * 0.08;
          if (t < ti) return;
          const a = eOut(r(t, ti, ti + 0.25)), b = eIn(r(t, to, to + 0.4));
          if (b >= 1) return;
          piece({ key: w.key, make: RECT(w.w, w.h), x: w.x + 40 * b, y: w.y - 22 * (1 - a) - 320 * b, rot: w.rot + (k % 2 ? 0.5 : -0.5) * b, s: lerp(1.14, 1, a) + 0.08 * b,
            h: lerp(3.6, 0.45, a) + 3.5 * b, stock: w.stock, seed: w.seed, tear: 1.6, step: 14, content: () => txt(w.text, 0, w.dy, w.font, w.col) });
        });
      }


      // ---------------------------------------------------------------- the book in 3D, drawn flat
      // an orthographic view of the table from the front, a little to the left, looking down: any flat piece on any plane
      // in the scene is one affine map, so every page, card and flap is a piece() drawn through a single setTransform
      const PSI = -0.12, PHI = 0.82, cps = Math.cos(PSI), sps = Math.sin(PSI), sph = Math.sin(PHI), cph = Math.cos(PHI);
      function pl(X, Y, Z) { const x1 = X * cps - Z * sps, z1 = X * sps + Z * cps; return [x1, z1 * sph - Y * cph]; }
      function plane(O, U, V) {
        const o = pl(O[0], O[1], O[2]), u = pl(U[0], U[1], U[2]), v = pl(V[0], V[1], V[2]), S = CAM.s; LS = S;
        ctx.setTransform(u[0] * S, u[1] * S, v[0] * S, v[1] * S, (o[0] - CAM.x) * S + W / 2, (o[1] - CAM.y) * S + H / 2);
      }
      const flat = (X, Y, Z) => plane([X, Y, Z], [1, 0, 0], [0, 0, 1]);
      // a card hinged along its foot: lying flat and pointing away at a = 0, standing at a = PI/2; its local y runs from its top (-h) to the hinge (0)
      const stand = (X, Y, Z, a) => plane([X, Y, Z], [1, 0, 0], [0, -Math.sin(a), Math.cos(a)]);

      const PW = 470, PD = 600, BT = 32, SLOT = 110, SZ = [20, 196];
      const INK = "#1d1a1f", SEPIA = "#6b5a48", RED = "#b8322b";
      // leaf k turns from the right (0) to the left (PI); spread k is the back of leaf k and the front of leaf k + 1
      function leafA(k, t) { if (k > 4) return 0; const e = E["leaf" + k]; return Math.PI * eIO(r(t, e[0], e[1])); }
      const closeU = (t) => eIO(r(t, E.close[0], E.close[1]));
      // a spread's pop-ups rise as its leaf lands and fold flat as the next leaf lifts: the height follows the page's angle
      function rise(k, t) {
        const up = eOut(r(leafA(k, t), 0.6 * Math.PI, Math.PI));
        const down = k < 4 ? r(leafA(k + 1, t), 0, 0.42 * Math.PI) : r(closeU(t), 0, 0.42);
        return up * (1 - eIn(down));
      }
      function stackY(t) { let n = 0; for (let k = 0; k < 5; k++) n += leafA(k, t) / Math.PI; return { n, YL: 2 + 5.6 * n, YR: BT - 5.6 * n }; }

      // ---------------------------------------------------------------- what is printed on the pages
      function head(n, title) {
        if (n) txt(n, -PW / 2 + 40, -PD / 2 + 44, '700 14px "JBM"', "#c4553b", "left");
        txt(title, -PW / 2 + 40, -PD / 2 + 80, 'italic 400 38px "Instrument Serif"', INK, "left");
        ctx.fillStyle = "rgba(29,26,31,0.22)"; ctx.fillRect(-PW / 2 + 40, -PD / 2 + 106, PW - 80, 1.5);
      }
      function folio(s) { txt(s, 0, PD / 2 - 30, '500 11px "JBM"', "rgba(29,26,31,0.45)"); }
      function coverFront() {

          piece({ key: "spec", make: RECT(176, 160), x: 0, y: -80, h: 0.4 + 2 * Math.sin(sa), stock: "white", seed: 190, tear: 0.6, step: 8, content: () => {
            txt("Aa", -36, -20, '800 56px "Archivo"', INK); txt("Aa", 40, -18, 'italic 400 64px "Instrument Serif"', "#c4553b");
            txt("display · text", 0, 50, '500 11px "JBM"', SEPIA); } });
        }
        TB.scope.forEach((s, j) => {
          const a = (Math.PI / 2) * k * eBack(r(t, E.rows[j], E.rows[j] + 0.4));
          if (a <= 0.01) return;
          stand(PW / 2, YR + 0.5, -150 + j * 68, a);
          piece({ key: "row" + j, make: RECT(360, 46), x: 0, y: -23, h: 0.4 + 1.4 * Math.sin(a), stock: "white", seed: 200 + j, tear: 0.6, step: 8, content: () => {
            ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.strokeRect(-160, -10, 20, 20);
            txt(s, -128, 1, '600 16px "JBM"', INK, "left"); } });
        });
      }
      // VI and VII: a ? flap lifts on two questions; the red pencil goes through the summary; a stamp comes down
      function pops4(t, YL, YR) {
        const k = rise(4, t);
        if (k > 0.01) {
          // the flap is hinged on its left edge and swings open like a door, leaning over toward the gutter
          const be = 2.15 * eOut(r(t, E.flap[0], E.flap[1])) * k;
          plane([PW / 2 - 170, YR + 0.6, 30], [Math.cos(be), Math.sin(be), 0], [0, 0, 1]);
          piece({ key: "flap", make: RECT(340, 250), x: 170, y: 0, h: 0.5 + 1.6 * Math.sin(be), stock: be < 1.4 ? "rose" : "ivory", seed: 210, tear: 0.7, step: 10, content: () => {
            if (be < 1.3) { txt("?", 0, -6, 'italic 400 150px "Instrument Serif"', INK); txt("lift", 0, 96, '700 12px "JBM"', INK); } } });
          TB.questions.forEach((q, j) => {
            const a = (Math.PI / 2) * k * eBack(r(t, E.qt[j], E.qt[j] + 0.45));
            if (a <= 0.01) return;
            stand(PW / 2, YR + 0.6, -20 + j * 92, a);
            piece({ key: "q" + j, make: RECT(330, 50), x: 0, y: -25, h: 0.4 + 1.6 * Math.sin(a), stock: ["ochre", "sky"][j], seed: 220 + j, tear: 0.6, step: 8, content: () => {
              ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(-140, 0, 13, 0, 7); ctx.fill(); txt("?", -140, 1, '700 16px "JBM"', "#f4eedf");
              txt(q, -116, 1, '600 15px "JBM"', INK, "left"); } });
          });
        }
        // the pencil, lying on the summary page, tip on the line it is working
        const pa = r(t, E.strike[0] - 0.5, E.strike[0] - 0.1) * (1 - r(t, E.ticks[2] + 0.3, E.ticks[2] + 0.8));
        if (pa > 0 && closeU(t) === 0) {
          const [lx, ly] = pencilTip(t), off = (1 - pa) * 500;
          flat(-PW / 2 + lx + off, YL + 1, ly + off * 0.4);
          piece({ key: "pencil", make: () => [[0, 0], [30, -9], [330, -9], [330, 9], [30, 9]], x: 0, y: 0, rot: -0.55, h: 3.2, stock: "red", seed: 230, tear: 0.4, step: 8, content: () => {
            ctx.fillStyle = "#e8cfa6"; ctx.beginPath(); ctx.moveTo(4, -1); ctx.lineTo(30, -9); ctx.lineTo(30, 9); ctx.fill();
            ctx.fillStyle = RED; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(9, -3); ctx.lineTo(9, 3); ctx.fill();
            ctx.fillStyle = "#c9a24f"; ctx.fillRect(296, -9, 12, 18); ctx.fillStyle = "#e3a59a"; ctx.fillRect(308, -9, 22, 18); } });
        }
        // the stamp drops onto the questions page and lifts away
        const s0 = E.stamp, d = r(t, s0 - 0.35, s0), l = r(t, s0 + 0.15, s0 + 0.6);
        if (d > 0 && l < 1) {
          const Ys = l > 0 ? lerp(4, 360, eIn(l)) : lerp(320, 4, eIn(d));
          flat(PW / 2 + 90, YR + Ys, 200);
          piece({ key: "stampb", make: RECT(210, 74), x: 0, y: 0, rot: -0.12, h: 0.6 + Ys / 60, stock: "kraft", seed: 240, tear: 0.6, step: 8, content: () => {
            ctx.fillStyle = "#7a5236"; ctx.beginPath(); ctx.arc(0, 0, 24, 0, 7); ctx.fill(); } });
        }
      }

      // ---------------------------------------------------------------- export: the closed book folds flat into a PDF and goes in an envelope
      function drawExport(t) {
        const fl = r(t, E.flat[0], E.flat[1]);
        if (fl <= 0) return;
        const eu = r(t, E.env[0], E.env[1]);
        const env = () => {
          const ex = lerp(1600, 240, eOut(r(eu, 0, 0.4)));
          flat(ex, 0.5, 40);
          piece({ key: "envb", make: RECT(580, 360), x: 0, y: 0, h: 1.2, stock: "kraft", seed: 250, tear: 0.8, step: 12 });
          return ex;
        };
        const pocket = (ex) => {
          flat(ex, 1.6, 40);
          piece({ key: "envf", make: () => [[-290, -70], [0, 60], [290, -70], [290, 180], [-290, 180]], x: 0, y: 0, h: 0.6, stock: "kraft", seed: 251, tear: 0.8, step: 10, content: () => {
            ctx.fillStyle = "rgba(60,40,20,0.12)"; ctx.fillRect(-290, -70, 580, 250);
            txt("to: the client", -250, 120, '600 14px "JBM"', INK, "left"); txt("brief.pdf", 250, 120, 'italic 400 26px "Instrument Serif"', INK, "right"); } });
          const fu = r(eu, 0.8, 1);
          flat(ex, 2.2, -140);
          piece({ key: "envflap", make: () => [[-290, 0], [290, 0], [0, 210]], x: 0, y: 0, sy: lerp(-1, 1, eIO(fu)), h: 0.8 + 1.5 * Math.sin(fu * Math.PI), stock: "kraft", seed: 252, tear: 0.8, step: 10 });
        };
        let ex = 240;
        if (eu > 0 && eu < 0.4) { ex = env(); pocket(ex); }
        else if (eu >= 0.4) ex = env();
        // the book: its pages squash flat while the cover turns into a printed sheet
        const sh = r(eu, 0.4, 0.55), go = r(eu, 0.55, 0.8);
        if (go < 1) {
          if (fl < 1) { board(1); block(0, PW, 30 * (1 - fl), "R"); }
          if (fl < 1) { flat(0, 30 * (1 - fl) + 1, 0); piece({ key: "leaf0f", make: RECT(PW + 10, PD + 14), x: (PW + 10) / 2, y: 0, h: 0.4, alpha: 1 - fl, stock: "terra", seed: 40, tear: 0.7, step: 14, content: coverFront }); }
        }
        if (eu < 1) {
          flat(240, 1.4 + 8 * sh, lerp(0, -160, eIO(sh)) + lerp(0, 220, eIO(go)));
          piece({ key: "pdf", make: RECT(420, 540), x: 0, y: 0, sy: lerp(1, 0.55, eIO(sh)), h: 0.6 + 2 * sh, alpha: fl, stock: "white", seed: 260, tear: 0.5, step: 12, content: () => {
            txt("brief.pdf", -180, -238, 'italic 400 34px "Instrument Serif"', INK, "left"); txt("SAMPLE", 180, -238, '700 12px "JBM"', "#c4553b", "right");
            ctx.fillStyle = "rgba(29,26,31,0.3)"; ctx.fillRect(-180, -212, 360, 1.5);
            TB.tabs.forEach((s, j) => { txt(String(j + 1).padStart(2, "0") + "  " + s, -180, -176 + j * 44, '600 14px "JBM"', INK, "left");
              ctx.fillStyle = "rgba(29,26,31,0.1)"; ctx.fillRect(-180, -158 + j * 44, 360, 1); });
            ctx.fillStyle = "#2f6f73"; ctx.fillRect(-180, 150, 40, 40); ctx.fillStyle = "#dda04a"; ctx.fillRect(-134, 150, 40, 40); ctx.fillStyle = "#c4553b"; ctx.fillRect(-88, 150, 40, 40);
          } });
        }
        if (eu >= 0.4) pocket(ex);
      }

      // ---------------------------------------------------------------- the camera: each key is [time, the point to centre on, the scale]
      function camAt(t) {
        const K = [[0, -110, -40, 1.0], [E.feed[0], -110, -40, 1.0], [E.feed[1] + 0.2, 200, -40, 1.12], [E.leaf0[1], 40, -40, 1.2],
          [E.strip0[0] - 0.3, 70, -40, 1.45], [E.chips1[2] + 0.4, 70, -40, 1.45], [E.tabs[0] - 0.1, 170, -40, 1.25], [E.tabs[6] + 0.4, 170, -40, 1.25],
          [E.leaf1[0] + 0.3, 30, -60, 1.2], [E.leaf1[1] + 0.2, 0, -90, 1.3], [E.per[2] + 0.8, 0, -95, 1.36],
          [E.leaf2[0] + 0.2, 0, -60, 1.25], [E.leaf2[1] + 0.2, -230, -30, 1.55], [E.toneW[2] + 0.3, -230, -30, 1.55], [E.sky[0] - 0.3, 240, -90, 1.5], [E.gap[1] + 0.4, 240, -90, 1.5],
          [E.leaf3[0] + 0.2, 0, -60, 1.25], [E.leaf3[1] + 0.2, -250, -50, 1.5], [E.spec + 0.4, -250, -50, 1.5], [E.rows[0] - 0.4, 240, -40, 1.5], [E.rows[4] + 0.6, 240, -40, 1.5],
          [E.leaf4[0] + 0.2, 0, -60, 1.25], [E.leaf4[1] + 0.2, 240, -40, 1.5], [E.qt[1] + 0.5, 240, -40, 1.5], [E.strike[0] - 0.3, -240, -20, 1.6], [E.ticks[2] + 0.3, -240, -20, 1.6],
          [E.stamp - 0.3, 0, -40, 1.2], [E.stamp + 0.6, 0, -40, 1.2], [E.close[1], 200, -40, 1.2], [E.env[0], 240, -30, 1.2], [E.env[1], 300, -20, 1.15], [DUR, 300, -20, 1.15]];
        let i = 0; while (i < K.length - 2 && t > K[i + 1][0]) i++;
        const A = K[i], B = K[i + 1], u = eIO(r(t, A[0], B[0]));
        return { x: lerp(A[1], B[1], u), y: lerp(A[2], B[2], u), s: lerp(A[3], B[3], u) };
      }
      function post(t) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        // morning light through a window on the left
        ctx.save(); ctx.globalCompositeOperation = "screen";
        const g = ctx.createLinearGradient(0, 0, W * 0.75, H * 0.5); g.addColorStop(0, "rgba(255, 236, 200, 0.22)"); g.addColorStop(1, "rgba(255,236,200,0)");
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
        ctx.drawImage(LIGHT, 0, 0);
        const f = (hash(POSE * 1.713) - 0.5) * 0.04;
        ctx.fillStyle = f > 0 ? `rgba(255, 244, 228, ${f.toFixed(3)})` : `rgba(30, 24, 16, ${(-f).toFixed(3)})`; ctx.fillRect(0, 0, W, H);
        ctx.save(); ctx.globalCompositeOperation = "overlay"; ctx.globalAlpha = 0.14;
        const ox = Math.floor(hash(POSE * 3.1) * 256), oy = Math.floor(hash(POSE * 5.3) * 256);
        for (let x = -ox; x < W; x += 512) for (let y = -oy; y < H; y += 512) ctx.drawImage(GRAIN, x, y, 512, 512);
        ctx.restore();
      }
      // a black sheet slid over the table for the title
      function cloth(t) {
        const u = r(t, E.cloth[0], E.cloth[1]);
        if (u <= 0) return;
        ctx.setTransform(1, 0, 0, 1, 0, 0); LS = 1;
        piece({ key: "cloth", make: RECT(2400, 1400), x: lerp(-1300, 960, eOut(u)), y: 540, rot: lerp(0.04, 0, eOut(u)), h: 2 * (1 - u) + 0.6, stock: "ink", seed: 900, tear: 7, step: 26, edge: "rgba(255,248,236,0.12)" });
      }

      function paint(t) {
        const ts = Math.floor(t * PZ + 1e-4) / PZ;   // shot on twos: every frame shows the pose of its twelfth of a second
        POSE = Math.round(ts * PZ);
        const covered = ts >= E.cloth[1];
        Object.assign(CAM, camAt(ts));
        ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = "#8f9583"; ctx.fillRect(0, 0, W, H);
        if (!covered) {
          drawTable(); drawIntake(ts); drawBook(ts); drawExport(ts);
          ctx.setTransform(1, 0, 0, 1, 0, 0); LS = 1;
          TB.lines.forEach((L) => drawLine(L, ts));
        }
        cloth(ts);
        post(ts);
        const lo = r(ts, E.logo, E.logo + 0.25);
        $("#title").style.opacity = lo > 0 ? 1 : 0;
        $("#t-logo").style.opacity = lo.toFixed(3); $("#t-logo").style.transform = `scale(${lerp(1.06, 1, eOut(lo)).toFixed(4)})`;
        $("#t-name").style.opacity = r(ts, E.name, E.name + 0.25).toFixed(3);
        $("#t-line").style.opacity = r(ts, E.name + 0.4, E.name + 0.7).toFixed(3);
        $("#t-url").textContent = URL_TEXT.slice(0, Math.round(URL_TEXT.length * r(t, E.url, E.url + 1.1)));
        let st = TB.hud[0][1]; for (const [a, s] of TB.hud) if (ts >= a) st = s;
        $("#hud-st").textContent = st;
        const ho = (1 - r(ts, E.cloth[0], E.cloth[0] + 0.4)).toFixed(3);
        $("#hud-l").style.opacity = ho; $("#hud-r").style.opacity = ho;
      }

      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => paint(clock.t) }, 0);

      async function build() {
        await Promise.all([document.fonts.load('800 40px "Archivo"'), document.fonts.load('700 40px "Archivo"'), document.fonts.load('italic 400 40px "Instrument Serif"'),
          document.fonts.load('500 20px "JBM"'), document.fonts.load('600 20px "JBM"'), document.fonts.load('700 20px "JBM"'), $("#t-logo").decode()]);
        ctx = $("#cv").getContext("2d");
        makeStocks(); makePost(); layLines();
        window.addEventListener("hf-seek", (ev) => paint(ev.detail.time));
        paint(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
      }
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["popup"] = build();
    </script>
  </body>
