<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Reflow</title>
    <!-- Reflow: a website built from clay and squeezed between two walls until its columns reflow. Stop-motion clay made entirely in code, posed at
         12 poses a second. The site on screen says only YOUR BRAND and is labelled a demo. -->
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/table.js"></script>
    <style>
      @font-face { font-family: "Archivo"; src: url("assets/fonts/Archivo.ttf") format("truetype"); font-weight: 100 900; font-stretch: 62% 125%; }
      @font-face { font-family: "JBM"; src: url("assets/fonts/jetbrains-mono.woff2") format("woff2"); font-weight: 100 800; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #120C1E; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #120C1E; }
      #ct-stage { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      #stage, #over { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
      #logo { position: absolute; left: -2000px; top: 0; width: 926px; height: 193px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="32.1429" data-width="1920" data-height="1080">
      <div id="ct-stage" class="clip" data-start="0" data-duration="32.1429" data-track-index="0">
        <canvas id="stage" width="1920" height="1080" data-layout-allow-overflow></canvas>
        <canvas id="over" width="1920" height="1080" data-layout-allow-overflow></canvas>
        <img id="logo" src="assets/brand/your-mark.svg" alt="Your mark" data-layout-allow-overflow>
      </div>
      <audio id="score" src="assets/bgm/score.wav" data-start="0" data-duration="32.1429" data-track-index="7" data-volume="1"></audio>
    </div>

    <script>
      const VS = `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;

      // ---------------- the clay: shared by every scene
      const COMMON = `#version 300 es
precision highp float; precision highp sampler2DArray;
out vec4 o;
uniform vec2 uRes, uJit; uniform vec3 uEye, uTar; uniform float uFov, uSeed, uMorph;
uniform float uLS; uniform vec4 uLump[3]; uniform vec3 uLumpC[3]; uniform vec3 uWall, uFloor, uKey;
uniform float uTip[9], uRise9[9]; uniform vec4 uMould; uniform vec4 uFall;
uniform vec4 uSlab; uniform vec3 uPos; uniform float uPS, uTurn, uBulge, uShear, uPipes, uFlow, uWallX;
uniform vec4 uR[6]; uniform vec3 uRC[6]; uniform float uRZ[6], uRF[6], uRD[6];
uniform vec4 uBlob[3]; uniform vec4 uRip; uniform vec4 uCur;
uniform vec4 uP0[4], uP1[4]; uniform vec4 uFold; uniform float uFoldC;
uniform sampler2DArray uWords; uniform vec4 uA0, uA1, uB0, uB1; uniform vec3 uAC, uBC;
float gD; vec3 gC, gQ; float gK; float gSh = 0.0;
float h31(vec3 p){ return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }
float vn(vec3 p){ vec3 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(h31(i), h31(i + vec3(1,0,0)), f.x), mix(h31(i + vec3(0,1,0)), h31(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(h31(i + vec3(0,0,1)), h31(i + vec3(1,0,1)), f.x), mix(h31(i + vec3(0,1,1)), h31(i + vec3(1,1,1)), f.x), f.y), f.z); }
mat2 rot(float a){ float s = sin(a), c = cos(a); return mat2(c, s, -s, c); }   // rot(a) * v turns v by +a
float smin(float a, float b, float k){ float h = max(k - abs(a - b), 0.0) / k; return min(a, b) - h * h * k * 0.25; }
// hand-made: nothing is true. A cheap wobble in the object's own coordinates, so it travels with the object
float wob(vec3 q, float s){ return sin(q.x * 3.1 * s + sin(q.z * 2.3 * s + 1.3)) * sin(q.y * 2.7 * s + sin(q.x * 1.9 * s)) + 0.5 * sin(q.z * 5.3 * s + q.y * 4.1 * s); }
float rbox(vec3 p, vec3 b, float r){ vec3 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0) - r; }
float cyl(vec3 p, float R, float h, float r){ vec2 d = vec2(length(p.xy) - R + r, abs(p.z) - h + r); return min(max(d.x, d.y), 0.0) + length(max(d, 0.0)) - r; }
float tor(vec3 p, float R, float rr){ return length(vec2(length(p.xy) - R, p.z)) - rr; }
void U(float d, vec3 c, vec3 q, float k){ if (d < gD) { gD = d; gC = c; gQ = q; gK = k; } }
const vec3 TOM = vec3(0.78, 0.085, 0.03), BUT = vec3(0.86, 0.56, 0.06), COB = vec3(0.02, 0.09, 0.62), BON = vec3(0.74, 0.66, 0.50), PLUM = vec3(0.16, 0.035, 0.12), GREY = vec3(0.34, 0.33, 0.35), GREYD = vec3(0.17, 0.165, 0.19);
float box2(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }
float cap(vec3 p, vec3 a, vec3 b, float r){ vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0); return length(pa - ba * h) - r; }
// a word pressed out of clay: a 2D distance field in a texture, extruded and rounded
float wordF(vec3 p, vec4 W0, vec4 W1){
  if (W1.x <= 0.0) return 1e3;
  vec3 q = p - W0.xyz; q.y -= W0.w; vec3 w = vec3(W1.x, W1.x * 0.25, W1.y);
  float bb = rbox(q, w + 0.04, 0.02); if (bb > (gSh > 0.5 ? 1.6 : 0.3)) return bb;
  float d2 = textureLod(uWords, vec3(q.x / w.x * 0.5 + 0.5, 0.5 - q.y / w.y * 0.5, W1.z), 0.0).r * w.x + wob(q * 3.0, 1.0) * 0.007;
  float e = abs(q.z) - w.z, rr = 0.04; vec2 v = vec2(d2 + rr, e + rr);
  return min(max(v.x, v.y), 0.0) + length(max(v, 0.0)) - rr;
}
`;

      // ---------------- the scenes. Each writes into U(). A shot only compiles what it shows
      const SCENES = {
        lumps: `
void lumps(vec3 p){
  // the brand: three lumps of colour
  for (int i = 0; i < 3; i++) { vec3 q = p - uLump[i].xyz; float sq = uLump[i].w; q.y /= sq; q.xz *= sqrt(sq); q += float(i) * 1.7;
    q -= float(i) * 1.7; float d = (length(q) - 0.98) * min(sq, 1.0) + wob(q + float(i) * 3.0, 1.3) * 0.07;
    d = smin(d, length(q - vec3(0.42 - float(i) * 0.3, 0.4, 0.14)) - 0.5, 0.5); U(d, uLumpC[i], q + float(i) * 5.0, 0.0); }
}`,
        row: `
void row(vec3 p){
  // a row of the same site, over and over. Standing on one rail, turned towards the camera
  vec3 g = p; g.xz = rot(-0.62) * g.xz;
  float pl = rbox(g - vec3(0.0, 0.05, 0.0), vec3(5.4, 0.1, 1.6), 0.08) + wob(g, 1.0) * 0.012; U(pl, GREYD, g, 0.0);
  for (int i = 0; i < 9; i++) { float up = uRise9[i]; if (up <= 0.0) continue;
    vec3 q = g - vec3(-4.0 + float(i), 0.14, 0.0); q.xy = rot(uTip[i]) * q.xy; q.y -= 1.45 * up;
    float bb = rbox(q, vec3(0.3, 1.5 * up, 1.3), 0.05); if (bb > 0.25) { U(bb + 0.02, GREY, q, 0.0); continue; }
    float d = rbox(q, vec3(0.085, 1.45 * up, 1.2), 0.06) + wob(q, 1.8) * 0.006; U(d, GREY, q, 1.0);
    // the same layout on every one
    vec3 f = q - vec3(0.11, 0.0, 0.0);
    float rl = rbox(f - vec3(0.0, 1.12 * up, 0.0), vec3(0.035, 0.09, 1.02), 0.03);
    rl = min(rl, rbox(f - vec3(0.0, 0.34 * up, 0.0), vec3(0.035, 0.46 * up, 1.02), 0.03));
    vec3 cq = f - vec3(0.0, -0.74 * up, 0.0); cq.z = cq.z - clamp(floor(cq.z / 0.72 + 0.5), -1.0, 1.0) * 0.72; rl = min(rl, rbox(cq, vec3(0.035, 0.46 * up, 0.28), 0.03));
    U(rl, GREYD, f, 2.0); }
  if (uMould.w > 0.0) { vec3 m = g - uMould.xyz; float b = max(rbox(m, vec3(0.42, 1.7, 1.46), 0.12), -rbox(m + vec3(0.0, 0.9, 0.0), vec3(0.2, 1.0, 1.28), 0.04)); U(b + wob(m, 1.2) * 0.012, PLUM, m, 0.0); }
  if (uFall.w > 0.0) { vec3 m = g - uFall.xyz; U(length(m) - 0.72 + wob(m, 1.6) * 0.05, TOM, m, 0.0); }
}`,
        page: `
void page(vec3 p){
  // the site, one slab of clay. Everything on it lives in its own coordinates, so the whole thing can buckle, wobble and turn
  vec3 q = (p - uPos) / uPS; q.xz = rot(uTurn) * q.xz;
  float hw = uSlab.x, hh = uSlab.y, cy = hh + 0.1;
  float nx = q.x / hw, ny = (q.y - cy) / hh; float m = max(0.0, 1.0 - nx * nx) * max(0.0, 1.0 - ny * ny);
  q.z -= uBulge * m; q.x -= uShear * (ny + 1.0) * (ny + 1.0) * 0.25;
  vec2 rp = vec2(q.x, q.y - cy) - uRip.xy; float rr = length(rp), front = uRip.z * 2.9;
  if (uRip.w > 0.0) q.z -= uRip.w * sin((rr - front) * 3.6) * smoothstep(1.4, 0.0, abs(rr - front)) ;
  float lip = uPS / (1.0 + 1.6 * abs(uBulge) + 3.0 * uRip.w + abs(uShear));
  vec3 s = q - vec3(0.0, cy, 0.0);
  float slab = rbox(s, vec3(hw, hh, 0.2), 0.16) + wob(s, 0.9) * 0.012; U(slab * lip, BON, s, 0.0);
  for (int i = 0; i < 6; i++) { vec4 R = uR[i]; float F = uRF[i], D = uRD[i]; if (F <= 0.0 && D <= 0.0) continue;
    vec3 t = s - vec3(R.xy, 0.2 + uRZ[i]);
    float d2 = box2(t.xy, R.zw, 0.1);
    float tube = length(vec2(d2, t.z)) - 0.06 + wob(t, 2.4) * 0.006;
    float an = (atan(t.y, t.x) + 3.14159265) / 6.2831853; tube += max(0.0, an - D) * 3.0;
    if (i == 1 && F < 0.5) { float k = clamp(D * 1.3 - 0.3, 0.0, 1.0); vec3 aa = vec3(-R.z, -R.w, 0.0), bb = vec3(R.z, R.w, 0.0), cc = vec3(-R.z, R.w, 0.0), dd = vec3(R.z, -R.w, 0.0);
      if (k > 0.0) { tube = min(tube, cap(t, aa, mix(aa, bb, k), 0.05)); tube = min(tube, cap(t, cc, mix(cc, dd, k), 0.05)); } }
    float full = rbox(t, vec3(R.zw, 0.13), 0.1) + wob(t, 1.6) * 0.008;
    if (i >= 2 && i <= 4 && F > 0.8) { vec3 c = t - vec3(0.0, R.w * 0.26, 0.18); full = max(full, -rbox(c, vec3(R.z * 0.8, R.w * 0.46, 0.14), 0.07));
      float ln = rbox(t - vec3(0.0, -R.w * 0.58, 0.13), vec3(R.z * 0.7, 0.045, 0.04), 0.03); full = max(full, -ln); }
    if (i == 0 && F > 0.8) { vec3 c = t - vec3(R.z - 0.42, 0.0, 0.13); c.x = c.x + clamp(floor(-c.x / 0.34 + 0.5), 0.0, 2.0) * 0.34; full = min(full, length(c) - 0.075); }
    float d = mix(tube, full, smoothstep(0.0, 0.6, F));
    float fl = smoothstep(0.0, 0.28, F * (length(R.zw) * 1.25 + 0.3) - length(t.xy));
    U(d * lip, mix(GREY, uRC[i], fl), t, 2.0 + float(i)); }
  if (uP1[0].x > 0.0) U(wordF(s, uP0[0], uP1[0]) * lip, BON, s - uP0[0].xyz, 0.0);
  for (int i = 0; i < 3; i++) if (uBlob[i].w > 0.0) { vec3 t = s - uBlob[i].xyz; U((length(t) - uBlob[i].w + wob(t, 1.6) * 0.04) * lip, uRC[i], t, 9.0); }
  // round the back: the plumbing. Mirrored, so x reads left to right once the slab has turned
  if (uPipes > 0.0) { vec3 b = vec3(-s.x, s.y, -s.z); float rp2 = uPipes;
    float bg = 0.2 * rp2 + 0.05 * sin(b.x * 3.2 - uFlow) * rp2;
    float mn = cap(b, vec3(-3.9, -1.45, 0.34), vec3(3.9, -1.45, 0.34), max(bg, 0.001)) + wob(b, 2.0) * 0.008; U(mn * lip, COB, b, 11.0);
    for (int i = 0; i < 3; i++) { float x = -2.95 + float(i) * 2.95; float bv = 0.13 * rp2 + 0.035 * sin(b.y * 4.5 - uFlow * 1.4 + float(i)) * rp2;
      float v = cap(b, vec3(x, -1.45, 0.34), vec3(x, 0.15, 0.34), max(bv, 0.001)); U(v * lip, TOM, b, 12.0);
      float jn = length(b - vec3(x, -1.45, 0.34)) - 0.3 * rp2; U(jn * lip, BUT, b, 13.0);
      float pl = rbox(b - vec3(x, 0.72, 0.28), vec3(1.26 * rp2, 0.56 * rp2, 0.09), 0.08) + wob(b, 1.7) * 0.008; U(pl * lip, BUT, b, 14.0);
      if (uP1[i + 1].x > 0.0) U(wordF(b, uP0[i + 1], uP1[i + 1]) * lip, COB, b - uP0[i + 1].xyz, 0.0); } }
  // the walls
  if (uWallX < 14.0) { vec3 wq = p; float sg = wq.x < 0.0 ? -1.0 : 1.0; vec3 w = vec3(wq.x - sg * (uWallX + 3.0), wq.y - 5.4, wq.z - 0.2); float dw = rbox(w, vec3(3.0, 5.4, 1.5), 0.2) + wob(w, 0.7) * 0.022; U(dw, TOM, w + sg, 0.0); }
  // the cursor
  if (uCur.w > 0.0) { vec3 c = p - uCur.xyz; c.xy = rot(0.5) * c.xy; c /= uCur.w;
    vec2 a = vec2(abs(c.x), c.y); float tri = max(dot(a - vec2(0.0, 0.0), normalize(vec2(1.0, 0.42))), -(c.y + 1.05)); tri = max(tri, abs(c.z) - 0.14); float tl = rbox(c - vec3(0.0, -1.32, 0.0), vec3(0.16, 0.42, 0.14), 0.08);
    U(smin(tri, tl, 0.08) * uCur.w * 0.8, PLUM, c, 0.0); }
}`,
        folder: `
void folder(vec3 p){
  vec3 q = p - uFold.xyz; vec3 col = mix(BUT, PLUM, uFoldC);
  float bk = rbox(q - vec3(0.0, 2.0, -0.32), vec3(2.8, 2.0, 0.11), 0.09) + wob(q, 1.1) * 0.012;
  float tb = rbox(q - vec3(-1.55, 4.0, -0.32), vec3(0.95, 0.28, 0.11), 0.1) + wob(q, 1.1) * 0.012;
  U(smin(bk, tb, 0.1), col, q, 0.0);
  vec3 f = q - vec3(0.0, 0.1, 0.3); f.yz = rot(-uFold.w) * f.yz; float fl = rbox(f - vec3(0.0, 1.62, 0.0), vec3(2.8, 1.62, 0.11), 0.09) + wob(f, 1.3) * 0.012; U(fl, col, f + 2.0, 1.0);
}`,
      };

      const MAIN = `
vec3 N(vec3 p){ const vec2 e = vec2(0.0035, 0.0); return normalize(vec3(map(p + e.xyy) - map(p - e.xyy), map(p + e.yxy) - map(p - e.yxy), map(p + e.yyx) - map(p - e.yyx))); }
// the surface, in the object's own coordinates so it moves with the object
float thumbs(vec3 q, float tile){
  float S = 1.5, H = 0.0; vec3 g = q * S + tile * 3.1; vec3 i = floor(g);
  for (int z = -1; z <= 1; z++) for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
    vec3 c = i + vec3(x, y, z); if (h31(c) < 0.45) continue;
    vec3 o2 = vec3(h31(c + 1.1), h31(c + 2.2), h31(c + 3.3)); vec3 d = g - c - o2;
    float a = h31(c + 4.4) * 3.14; d.xy = rot(a) * d.xy; d.yz = rot(a * 1.7) * d.yz;
    float l = length(d * vec3(1.0, 1.5, 1.0)), m = smoothstep(0.5, 0.22, l); if (m <= 0.0) continue;
    H += m * (-0.8 + 0.2 * sin((length(d.xy * vec2(1.0, 1.55)) + vn(d * 4.0) * 0.1) * 95.0));
  }
  return H;
}
float surf(vec3 q, float tile){
  float h = 0.8 * vn(q * 2.1 + 3.0) + 0.42 * vn(q * 5.3 + 7.0) + 0.14 * vn(q * 15.0) + 0.05 * vn(q * 46.0);   // lumps, dents and nicks
  h += 0.28 * thumbs(q, tile);
  h += 0.035 * vn(q * 6.0 + uSeed * 11.0) + 0.016 * vn(q * 19.0 + uSeed * 37.0);                               // touched since the last pose
  h -= 0.018 * smoothstep(0.88, 0.92, vn(vec3(q.x * 2.2, q.y * 22.0, q.z * 2.2) + 9.0));                        // a tool mark
  return h;
}
float shadow(vec3 ro, vec3 rd){ gSh = 1.0; float s = 1.0, t = 0.04 + 0.05 * fract(sin(dot(gl_FragCoord.xy + uJit * 7.0, vec2(12.9898, 78.233))) * 43758.5453); for (int i = 0; i < 36; i++) { float d = map(ro + rd * t); s = min(s, 5.5 * d / t); t += clamp(d * 0.85, 0.035, 0.7); if (s < 0.002 || t > 22.0) break; } gSh = 0.0; s = clamp(s, 0.0, 1.0); return s * s * (3.0 - 2.0 * s); }
float ao(vec3 p, vec3 n){ float a = 0.0, w = 1.0; for (int i = 1; i <= 5; i++) { float h = 0.03 + 0.14 * float(i); a += (h - map(p + n * h)) * w; w *= 0.62; } return clamp(1.0 - 1.15 * a, 0.0, 1.0); }
void main(){
  vec2 uv = (gl_FragCoord.xy + uJit - 0.5 * uRes) / uRes.y;
  vec3 f = normalize(uTar - uEye), r = normalize(cross(f, vec3(0.0, 1.0, 0.0))), u = cross(r, f);
  vec3 rd = normalize(f * uFov + r * uv.x + u * uv.y), ro = uEye;
  float t = 0.0; bool hit = false;
  for (int i = 0; i < 120; i++) { float d = map(ro + rd * t); if (d < 0.0012 * (1.0 + t * 0.15)) { hit = true; break; } t += d * 0.85; if (t > 60.0) break; }
  vec3 c = uWall;
  if (hit) {
    vec3 p = ro + rd * t; map(p); vec3 q0 = gQ, alb = gC; float kk = gK;
    vec3 n = N(p);
    bool card = kk < -0.5; float tile = max(floor(kk), 0.0);
    const vec2 e = vec2(0.0045, 0.0);
    float h0 = surf(q0, tile);
    vec3 gr = vec3(surf(q0 + e.xyy, tile) - h0, surf(q0 + e.yxy, tile) - h0, surf(q0 + e.yyx, tile) - h0) / e.x;
    n = normalize(n - (gr - n * dot(gr, n)) * (card ? 0.012 : 0.042));
    // the colour is never one colour: kneaded, smeared, and dirtied in the dents
    if (!card) { alb *= 0.85 + 0.3 * vn(q0 * vec3(2.6, 4.4, 2.6) + 5.0); alb = mix(alb, alb * vec3(1.12, 0.9, 0.8), vn(q0 * 8.0)); alb *= 0.72 + 0.34 * smoothstep(0.1, 0.9, h0); }
    else alb *= 0.9 + 0.2 * vn(p * vec3(0.8, 3.0, 0.8));              // brush strokes on the painted card
    vec3 Lp = uKey - p; vec3 L = normalize(Lp), V = -rd, H = normalize(L + V);
    float sh = shadow(p + n * 0.014, L), a = ao(p, n);
    float wrap = clamp((dot(n, L) + 0.26) / 1.26, 0.0, 1.0);           // clay lets a little light in
    vec3 key = vec3(1.0, 0.84, 0.66) * 1.75 * wrap * mix(0.08, 1.0, sh);
    vec3 sky = vec3(0.56, 0.52, 0.98) * 0.30 * (0.5 + 0.5 * n.y) * a;
    vec3 bou = vec3(0.86, 0.60, 0.40) * 0.22 * (0.5 - 0.5 * n.y) * a;
    vec3 back = vec3(0.9, 0.8, 0.7) * 0.12 * clamp(dot(n, -L * vec3(1.0, 0.0, 1.0)), 0.0, 1.0) * a;
    c = alb * (key + sky + bou + back);
    c += alb * vec3(1.0, 0.42, 0.24) * 0.14 * (1.0 - wrap) * a * sh;   // warm where the light gets in
    if (!card) { c += vec3(1.0, 0.95, 0.88) * pow(max(dot(n, H), 0.0), 22.0) * 0.07 * sh;   // a faint greasy sheen, broad, never a highlight
      c += sky * alb * pow(1.0 - clamp(dot(n, V), 0.0, 1.0), 3.0) * 0.5; }
  }
  o = vec4(c, 1.0);
}`;

      const POST = `#version 300 es
precision highp float; uniform sampler2D uT; uniform float uTime, uFlick; out vec4 o;
float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
